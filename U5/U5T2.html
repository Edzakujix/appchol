<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Tema 2: Enfermedades</title>

    <link rel="stylesheet" href="../assets/css/styles.css">
    <link rel="stylesheet" href="../assets/css/enhanced-styles.css">

    <style>
        button.primary {
            opacity: 0.5;
            pointer-events: none;
        }
        button.primary.active {
            opacity: 1;
            pointer-events: auto;
        }

        .opt {
            min-width: 140px; 
            padding: 15px; 
            border-radius: 20px; 
            background: #fff; 
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px; 
            cursor: pointer; 
            border: 4px solid #E0E0E0;
            font-size: 1.1rem; 
            font-weight: 600; 
            transition: all .2s;
            text-align: center;
        }

        .opt:hover:not(.disabled) {
            transform: translateY(-5px); 
            border-color: var(--accent);
        }

        .opt.disabled { 
            pointer-events: none; 
            opacity: 0.7; 
            cursor: default;
        }

        .img-option img {
            width: 130px; 
            height: 130px; 
            border-radius: 12px; 
            object-fit: contain;
            border: 2px solid #f0f0f0;
        }

        .matching-click-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
            max-width: 700px;
            padding: 25px;
            background-color: #FFF; 
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            border: 4px solid #E0E0E0;
        }

        .matching-card {
            background-color: #F5F5F5;
            border-radius: 15px;
            padding: 15px 20px;
            font-weight: 700;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 0 rgba(0,0,0,0.1);
            border: 2px solid #E0E0E0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 60px;
            text-align: center;
        }

        .matching-card:hover:not(.matched):not(.selected) {
            transform: translateY(-2px);
            border-color: var(--accent);
            background-color: #FFF;
        }

        .matching-card.selected {
            border-color: var(--accent);
            background-color: #E3F2FD;
            color: var(--accent);
            transform: translateY(-2px);
        }

        .matching-card.matched {
            background-color: var(--ok);
            color: white;
            pointer-events: none;
            cursor: default;
            box-shadow: none;
            border-color: var(--ok);
            animation: pop 0.3s ease-out;
        }

        .matching-card.shaking {
            animation: shake 0.5s;
            border-color: var(--bad) !important;
            background-color: #FFEBEE !important;
            color: var(--bad);
        }

        .sentence-builder-container {
            width: 100%;
            max-width: 700px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 20px;
        }

        .answer-area {
            min-height: 80px;
            background-color: #ffffff;
            border-bottom: 4px solid var(--accent);
            border-radius: 15px 15px 0 0;
            padding: 20px;
            display: flex;
            flex-wrap: wrap; 
            gap: 10px;
            justify-content: center;
            align-items: center;
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.05);
        }

        .answer-area:empty::before {
            content: "Toca las palabras abajo para formar la frase...";
            color: #ccc;
            font-style: italic;
            font-weight: 500;
        }

        .word-bank {
            display: flex;
            flex-wrap: wrap; 
            gap: 12px;
            justify-content: center;
            padding: 20px;
            background-color: #E3F2FD;
            border-radius: 20px;
            border: 2px dashed #90CAF9;
        }

        .word-chip {
            background-color: #fff;
            border: 2px solid #29B6F6;
            border-radius: 12px;
            padding: 10px 20px;
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--color-texto); 
            cursor: pointer;
            transition: all 0.2s;
            user-select: none;
            box-shadow: 0 4px 0 rgba(0,0,0,0.1);
        }

        .word-chip:hover {
            transform: translateY(-3px);
            background-color: #E1F5FE;
        }

        .word-chip.in-sentence {
            background-color: var(--accent); 
            color: white;
            border-color: #D84315;
            box-shadow: 0 4px 0 #bf360c;
        }
        
        .word-chip.disabled {
            opacity: 0.6;
            pointer-events: none;
            filter: grayscale(0.5);
        }

        @keyframes pop {
            0% { transform: scale(0.8); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            75% { transform: translateX(-5px); }
            100% { transform: translateX(0); }
        }

        .questions-stack, .answers-stack {
            display: flex;
            flex-direction: column;
            gap: 12px;
            flex: 1;
        }

        .stack-title {
            font-weight: 800;
            font-size: 1.2rem;
            color: var(--text-color);
            margin-bottom: 10px;
            text-align: center;
            text-transform: uppercase;
        }

        @media (min-width: 601px) {
            .matching-click-container {
                flex-direction: row;
                justify-content: space-between;
            }
        }
    </style>
</head>
<body>
    <div class="app" role="application" aria-label="Prototipo actividades para primaria">
        <header>
            <h1 id="title">U5 - Tema 2: Enfermedades</h1>
            <div style="display: flex; gap: 10px;">
                <button class="ghost" onclick="goHome()" style="font-weight: 500; padding: 10px;">🏠 Inicio</button>
                <button class="primary" id="nextBtn" onclick="next()">Siguiente</button>
            </div>
        </header>

        <main class="stage-area" id="stageArea"></main>

        <div class="controls" id="controlsArea"></div>
        
        <footer>Prototipo educativo · Unidad 5</footer>
    </div>
    
    <div class="ground-sim"></div>

    <script src="../assets/js/sound-effects.js"></script>

<script>
    const TEMA_ID = 15; 
    const MAIN_SCREEN_URL = './U5MICU.html'; 
    const TOTAL_ACTIVITY_POINTS = 100;

    let stage1Attempts = 0;
    const stage1MaxAttempts = 2;

    let stage3Attempts = 0;
    const stage3MaxAttempts = 2;

    function goHome() {
        if(window.soundSystem) soundSystem.play('whoosh');
        setTimeout(() => {
            window.location.href = MAIN_SCREEN_URL;
        }, 200);
    }

    const stages = [renderStage0, renderStage1, renderStage2, renderStage3, renderStageFinal];
    let currentStage = 0;
    let userScore = 0;
    let stageProgress = new Array(stages.length).fill(false);
    
    let feedbackEl = null;
    const titleEl = document.getElementById('title');
    let nextBtn = null;
    const controlsArea = document.getElementById('controlsArea');

    function handleCorrectAnswer(el) {
        if(el) el.classList.add('ok');
    }

    function handleIncorrectAnswer(el) {
        if(el) {
            el.classList.add('bad');
            if(window.visualEffects && window.visualEffects.shake) {
                window.visualEffects.shake(el);
            } else {
                el.classList.add('shaking');
                setTimeout(() => el.classList.remove('shaking'), 500);
            }
        }
    }

    function setStageComplete(isComplete = true) {
        if (isComplete && !stageProgress[currentStage]) {
            if(currentStage >= 1 && currentStage <= 3) { 
                userScore += 25; 
            }
        }
        stageProgress[currentStage] = isComplete;
        if(nextBtn) nextBtn.classList.toggle('active', isComplete);
    }

    function clearFeedback(){ if(feedbackEl) feedbackEl.innerHTML = ""; }

    function setFeedback(text, kind){
        if(!feedbackEl) return;
        feedbackEl.innerHTML = text;
        if(kind === 'ok'){ feedbackEl.style.color = 'var(--ok, green)' }
        else if(kind === 'bad'){ feedbackEl.style.color = 'var(--bad, red)' }
        else { feedbackEl.style.color = 'var(--color-texto, #333)' }
    }

    function disableOptions(selector) {
        document.querySelectorAll(selector).forEach(el => {
            el.classList.add('disabled');
            el.onclick = null;
        });
    }

    function renderControls(html = '') {
        controlsArea.innerHTML = `<div id="feedback" class="feedback"></div>${html}`;
        feedbackEl = document.getElementById('feedback');
        nextBtn = document.getElementById('nextBtn'); 
    }

    function next() {
        if (!stageProgress[currentStage]) {
            setFeedback("¡Termina esta parte antes de continuar!", 'bad');
            if(window.soundSystem) soundSystem.play('error');
            return;
        }

        if(window.soundSystem) soundSystem.play('whoosh');

        if (currentStage === stages.length - 1) {
            goHome();
            return; 
        }

        currentStage++;
        render();
    }

    function speakText(text, lang='es-ES'){
        if(!window.speechSynthesis) return;
        const u = new SpeechSynthesisUtterance(text);
        u.lang = lang;
        window.speechSynthesis.cancel();
        window.speechSynthesis.speak(u);
    }

    function playAudio(audioFilename, text = 'Audio', lang = 'cho') {
        const audioUrl = `../assets/audio/${audioFilename}`; 
        const audio = new Audio(audioUrl);
        audio.play()
            .then(() => { setFeedback(`🔊 Reproduciendo...`, 'neutral'); })
            .catch(e => {
                console.error(`❌ Error audio: ${e.message}`);
                speakText(text, lang); 
                setFeedback(`[TTS] ${text}`, 'neutral');
            });
    }

    function createAudioButton(text, audioFilename, lang = 'cho') {
        const btn = document.createElement('button');
        btn.className = 'ghost audio-btn';
        btn.innerHTML = '🔊 Escuchar';
        btn.onclick = () => { playAudio(audioFilename, text, lang); };
        return btn;
    }

    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    function render() {
        clearFeedback();
        setStageComplete(false);
        const container = document.getElementById('stageArea');
        container.innerHTML = '';

        const titles = [
            'Introducción: Enfermedades',
            'Actividad 1: Vocabulario',
            'Actividad 2: Relacionar Dolor',
            'Actividad 3: Construye la Frase',
            '¡Unidad Completada!'
        ];
        titleEl.textContent = titles[currentStage];

        nextBtn = document.getElementById('nextBtn');
        if(nextBtn) {
            nextBtn.classList.remove('active');
            if(currentStage === 0) nextBtn.classList.add('active'); 
        }

        stages[currentStage](container);

        if (currentStage === 0 || currentStage === 4) {
            setStageComplete(true);
        }
    }

    function renderStage0(container) {
        renderControls();
        container.innerHTML = `
            <div class="video-wrapper">
                <iframe src="https://www.youtube.com/embed/RUTAS_PENDIENTES?rel=0" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
            </div>
            <p style="text-align:center; max-width: 600px; margin-top: 20px;">
                ¡Mira el video para aprender sobre las enfermedades en Ch'ol!
            </p>
        `;
        setStageComplete(true);
    }

    const stage1Data = [
        { word: 'Ojba', es: 'Tos', img: 'tos.png', audio: 'tos.mp3' },
        { word: 'K’ajk', es: 'Fiebre', img: 'fiebre.png', audio: 'fiebre.mp3' },
        { word: 'Tya’ñi’', es: 'Gripa', img: 'gripa.png', audio: 'gripa.mp3' },
        { word: 'Joch’', es: 'Inyección', img: 'inyeccion.png', audio: 'inyeccion.mp3' },
        { word: 'Ts’ak', es: 'Medicina', img: 'medicina.png', audio: 'medicina.mp3' }
    ];
    let currentRound1 = 0;

    function checkAnswer1(selectedImage, currentData, allOptionsElements, selectedElement) {
        if (selectedImage === currentData.img) {
            setFeedback(`¡Correcto! Es ${currentData.word} (${currentData.es})`, 'ok');
            handleCorrectAnswer(selectedElement);
            if(window.soundSystem) soundSystem.play('success');
            
            stage1Attempts = 0;
            currentRound1++;
            setTimeout(() => {
                renderStage1(document.getElementById('stageArea'));
            }, 1500);
        } else {
            stage1Attempts++;
            if (stage1Attempts < stage1MaxAttempts) {
                handleIncorrectAnswer(selectedElement);
                setFeedback(`Incorrecto. Te quedan ${stage1MaxAttempts - stage1Attempts} intentos.`, 'bad');
                if(window.soundSystem) soundSystem.play('error');
                
                setTimeout(() => {
                    allOptionsElements.forEach(el => {
                        el.classList.remove('disabled', 'bad');
                        el.style.pointerEvents = 'auto';
                        el.onclick = function() { 
                            const all = document.querySelectorAll('.opt');
                            disableOptions('.opt');
                            let isCorrect = (el.dataset.img === currentData.img);
                            if(isCorrect) el.classList.add('ok'); else el.classList.add('bad');
                            checkAnswer1(el.dataset.img, currentData, all, el);
                        }
                    });
                    setFeedback('Intenta de nuevo.', 'neutral');
                }, 1500);
            } else {
                handleIncorrectAnswer(selectedElement);
                setFeedback(`Incorrecto. La respuesta correcta era: ${currentData.es}`, 'bad');
                if(window.soundSystem) soundSystem.play('error');
                
                allOptionsElements.forEach(el => {
                    if (el.dataset.img === currentData.img) { el.classList.add('ok'); }
                });
                
                stage1Attempts = 0;
                currentRound1++;
                setTimeout(() => {
                    renderStage1(document.getElementById('stageArea'));
                }, 2500);
            }
        }
    }

    function renderStage1(container) {
        if (currentRound1 >= stage1Data.length) {
            container.innerHTML = `<h2 style="color: var(--ok); text-align:center;">¡Felicidades! Completaste el vocabulario.</h2>`;
            setStageComplete(true);
            renderControls();
            return;
        }

        const currentData = stage1Data[currentRound1];
        const attemptsInfo = stage1MaxAttempts > 1 ? `(Tienes ${stage1MaxAttempts} intentos)` : '';

        container.innerHTML = `<p class="stage0-info">Ronda ${currentRound1 + 1} de ${stage1Data.length}: Escucha y selecciona la imagen correcta. ${attemptsInfo}</p>`;
        
        const audioBtn = createAudioButton(currentData.word, currentData.audio, 'cho');
        renderControls();
        
        const buttonWrapper = document.createElement('div');
        buttonWrapper.style.cssText = "display: flex; gap: 15px; justify-content: center; margin-bottom: 20px;";
        buttonWrapper.appendChild(audioBtn);
        const feedbackEl = document.getElementById('feedback');
        if (controlsArea) { controlsArea.insertBefore(buttonWrapper, feedbackEl.nextSibling); }

        const row = document.createElement('div');
        row.className = 'options-row';
        row.style.cssText = "display: flex; flex-wrap: wrap; justify-content: center; gap: 15px;";
        
        let options = [currentData];
        let distractors = stage1Data.filter(d => d.word !== currentData.word);
        shuffleArray(distractors);
        options = options.concat(distractors.slice(0, 2)); 
        shuffleArray(options);

        options.forEach(item => {
            const b = document.createElement('div');
            b.className = 'opt img-option';
            b.dataset.img = item.img;
            
            b.innerHTML = `<img src="../assets/img/${item.img}" alt="${item.es}" onerror="this.src='https://via.placeholder.com/120?text=${item.es}'"/> <p>${item.es}</p>`;
            
            b.onclick = () => {
                const allOptions = document.querySelectorAll('.opt');
                disableOptions('.opt'); 
                
                if (item.img === currentData.img) { b.classList.add('ok'); } else { b.classList.add('bad'); }
                
                checkAnswer1(item.img, currentData, allOptions, b);
            };
            row.appendChild(b);
        });
        
        container.appendChild(row);
        setStageComplete(false);
    }

    const stage2Pairs = [
        { ch: 'K’ux jol', es: 'Dolor de cabeza' },
        { ch: 'K’ux ej', es: 'Dolor de diente' },
        { ch: 'K’ux pix', es: 'Dolor de rodillas' },
        { ch: 'K’ax ñäk’', es: 'Dolor de panza' },
        { ch: 'K’am-añ', es: 'Enfermedad' }
    ];

    let selectedQuestion = null;
    let matchedPairsCount = 0;

    function handleQuestionClick(cardEl, question) {
        if(window.soundSystem) soundSystem.play('click');
        if (cardEl.classList.contains('selected')) {
            cardEl.classList.remove('selected');
            selectedQuestion = null;
            setFeedback('Selecciona el dolor en Ch\'ol y luego su significado.', 'neutral');
            return;
        }
        document.querySelectorAll('.questions-stack .matching-card.selected').forEach(el => el.classList.remove('selected'));
        cardEl.classList.add('selected');
        selectedQuestion = question;
        setFeedback(`Seleccionaste <strong>${question.ch}</strong>. ¡Elige su traducción!`, 'neutral');
    }

    function handleAnswerClick(cardEl, answer) {
        if(window.soundSystem) soundSystem.play('click');
        if (!selectedQuestion) {
            setFeedback('Selecciona primero la palabra en Ch\'ol.', 'bad');
            handleIncorrectAnswer(cardEl); 
            return;
        }

        const questionCardEl = document.querySelector(`.questions-stack .matching-card[data-chol="${selectedQuestion.ch}"]`);

        if (selectedQuestion.ch === answer.ch) {
            setFeedback('¡Emparejamiento Correcto!', 'ok');
            if(window.soundSystem) soundSystem.play('success');
            
            cardEl.classList.add('matched');
            questionCardEl.classList.add('matched');
            cardEl.classList.remove('shaking');
            questionCardEl.classList.remove('shaking', 'selected');
            
            selectedQuestion = null;
            matchedPairsCount++;

            if (matchedPairsCount === stage2Pairs.length) {
                setTimeout(() => {
                    setFeedback('¡Actividad 2 Completada!', 'ok');
                    setStageComplete(true);
                }, 500);
            }
        } else {
            setFeedback('Incorrecto. Intenta de nuevo.', 'bad');
            if(window.soundSystem) soundSystem.play('error');
            
            cardEl.classList.add('shaking');
            questionCardEl.classList.add('shaking');
            setTimeout(() => {
                cardEl.classList.remove('shaking');
                questionCardEl.classList.remove('shaking');
            }, 500);
        }
    }

    function renderStage2(container) {
        matchedPairsCount = 0; 
        selectedQuestion = null;
        
        container.innerHTML = `
            <p class="stage0-info">Haz clic en el dolor en Ch'ol (Izquierda) y luego en su significado en Español (Derecha).</p>
            <div class="matching-click-container">
                <div id="questionGroup" class="questions-stack">
                    <p class="stack-title">Ch'ol</p>
                </div>
                <div id="answerGroup" class="answers-stack">
                    <p class="stack-title">Español</p>
                </div>
            </div>
        `;
        
        renderControls();
        setFeedback('Selecciona un par para comenzar.', 'neutral');

        const questionGroup = document.getElementById('questionGroup');
        const answerGroup = document.getElementById('answerGroup');
        const shuffledQuestions = shuffleArray([...stage2Pairs]);
        const shuffledAnswers = shuffleArray([...stage2Pairs]);

        shuffledQuestions.forEach(pair => {
            const qCard = document.createElement('div');
            qCard.className = 'matching-card';
            qCard.dataset.chol = pair.ch;
            qCard.textContent = pair.ch;
            qCard.onclick = () => handleQuestionClick(qCard, pair);
            questionGroup.appendChild(qCard);
        });

        shuffledAnswers.forEach(pair => {
            const aCard = document.createElement('div');
            aCard.className = 'matching-card';
            aCard.dataset.es = pair.es;
            aCard.textContent = pair.es;
            aCard.onclick = () => handleAnswerClick(aCard, pair);
            answerGroup.appendChild(aCard);
        });
        setStageComplete(false);
    }

    const stage3Data = [
        { es: 'Octavio tiene fiebre', ch: 'Aj Octavio k’ajk muk’', words: ['Aj', 'Octavio', 'k’ajk', 'muk’'], audio: 'Octavio_fiebre.mp3' },
        { es: 'Rosa tiene gripa', ch: 'Xrosa tya’ ñi’ muk’', words: ['Xrosa', 'tya’', 'ñi’', 'muk’'], audio: 'rosa_gripa.mp3' },
        { es: 'Me siento mal', ch: 'Mach yom ku’biñ', words: ['Mach', 'yom', 'ku’biñ'], audio: 'me_siento_mal.mp3' },
        { es: 'Damián tiene diarrea', ch: 'Aj Damián ja’ñäk’ tya’ muk’', words: ['Aj', 'Damián', 'ja’ñäk’', 'tya’', 'muk’'], audio: 'Damian_diarrea.mp3' }
    ];
    let currentRound3 = 0;

    function renderStage3(container) {
        if (currentRound3 >= stage3Data.length) {
            container.innerHTML = `<h2 style="color: var(--ok); text-align:center;">¡Felicidades! Completaste las frases.</h2>`;
            setStageComplete(true);
            renderControls();
            return;
        }

        const roundData = stage3Data[currentRound3];
        const attemptsInfo = stage3MaxAttempts > 1 ? `(Tienes ${stage3MaxAttempts} intentos)` : '';

        renderControls(`<button class="ghost" id="checkBtn" onclick="checkSentence()" style="margin-top:10px; border:2px solid #ccc; background:#f9f9f9;">Comprobar Frase</button>`);

        container.innerHTML = `
            <p class="stage0-info">Ronda ${currentRound3 + 1} de ${stage3Data.length}: ${attemptsInfo}</p>
            <div style="text-align:center;">
                <p style="font-size:1.1rem; margin-bottom:10px;">Forma la frase en Ch'ol para:</p>
                <h3 style="color:var(--accent); margin-top:0;">"${roundData.es}"</h3>
                <div class="audio-btn-big" style="width:50px; height:50px; font-size:1.5rem; margin:0 auto 20px; border:2px solid #ccc; border-radius:50%; display:flex; align-items:center; justify-content:center; cursor:pointer;" 
                     onclick="playAudio('${roundData.audio}', '${roundData.ch}')">🔊</div>
            </div>

            <div class="sentence-builder-container">
                <div class="answer-area" id="answerArea"></div>
                <div class="word-bank" id="wordBank"></div>
            </div>
        `;

        const answerArea = document.getElementById('answerArea');
        const wordBank = document.getElementById('wordBank');
        const shuffledWords = shuffleArray([...roundData.words]);

        shuffledWords.forEach(word => {
            const chip = document.createElement('div');
            chip.className = 'word-chip';
            chip.textContent = word;
            chip.onclick = () => moveWord(chip, answerArea, wordBank);
            wordBank.appendChild(chip);
        });

        window.moveWord = function(chip, target, source) {
            if(window.soundSystem) soundSystem.play('click');
            if(chip.classList.contains('disabled')) return;
            
            if (chip.parentElement === source) {
                target.appendChild(chip);
                chip.classList.add('in-sentence');
            } else {
                source.appendChild(chip);
                chip.classList.remove('in-sentence');
            }
        };

        window.checkSentence = function() {
            const currentSentence = Array.from(answerArea.children).map(c => c.textContent).join(' ');
            
            if (currentSentence.trim() === "") {
                setFeedback("Arrastra las palabras arriba primero.", 'bad');
                handleIncorrectAnswer(answerArea);
                return;
            }

            if (currentSentence === roundData.ch) {
                setFeedback('¡Excelente! Frase correcta.', 'ok');
                if(window.soundSystem) soundSystem.play('success');
                disableOptions('.word-chip');
                document.getElementById('checkBtn').disabled = true;
                
                stage3Attempts = 0;
                currentRound3++;
                setTimeout(() => {
                    renderStage3(document.getElementById('stageArea'));
                }, 1500);
            } else {
                stage3Attempts++;
                if (stage3Attempts < stage3MaxAttempts) {
                    setFeedback(`Orden incorrecto. Intentos: ${stage3MaxAttempts - stage3Attempts}`, 'bad');
                    if(window.soundSystem) soundSystem.play('error');
                    handleIncorrectAnswer(answerArea);
                } else {
                    setFeedback(`Incorrecto. La frase es: <br><strong>${roundData.ch}</strong>`, 'bad');
                    if(window.soundSystem) soundSystem.play('error');
                    disableOptions('.word-chip');
                    
                    answerArea.innerHTML = '';
                    roundData.ch.split(' ').forEach(w => {
                        const c = document.createElement('div'); c.className = 'word-chip in-sentence disabled'; c.textContent = w;
                        answerArea.appendChild(c);
                    });
                    
                    stage3Attempts = 0;
                    currentRound3++;
                    setTimeout(() => {
                        renderStage3(document.getElementById('stageArea'));
                    }, 3500);
                }
            }
        };
        
        setStageComplete(false);
    }

    function renderStageFinal(container) {
        container.innerHTML = `
            <div style="text-align: center; padding: 40px; border: 5px dashed var(--ok, green); border-radius: 20px; background-color: rgba(255,255,255,0.9);">
                <h2 style="color: var(--ok, green); font-size: 2.5rem; margin-bottom: 20px;">🎉 ¡Unidad Completada! 🎉</h2>
                <p style="font-size: 1.5rem; font-weight: bold;">Puntuación total: ${userScore} / ${TOTAL_ACTIVITY_POINTS}</p>
                <p style="margin-top: 15px;">Has aprendido sobre Enfermedades, Dolores y Frases en Ch'ol.</p>
                <p>Presiona Siguiente para volver al menú principal.</p>
            </div>
        `;
        
        renderControls(); 

        try {
            if (window.visualEffects && typeof window.visualEffects.confetti === 'function') {
                window.visualEffects.confetti();
            } else if (typeof celebrateLevelComplete === 'function') {
                celebrateLevelComplete();
            }
        } catch (e) {
            console.log("Efectos visuales no disponibles");
        }

        guardarProgresoEnBD();
        setStageComplete(true);
    }

    function guardarProgresoEnBD() {
        fetch('../../backend/api/progress.php', { 
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                tema_id: TEMA_ID,
                completado: true
            })
        })
        .then(response => response.json())
        .then(data => {
            console.log("Progreso guardado:", data);
            if(data.success && window.collectCoin) {
                collectCoin();
            }
        })
        .catch(error => console.log('Simulación (sin backend):', error));
    }

    document.addEventListener('DOMContentLoaded', () => {
        render();
    });
</script>
</body>
</html>
