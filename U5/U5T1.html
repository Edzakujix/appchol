<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Tema 1: Mi Cuerpo</title>

    <link rel="stylesheet" href="../assets/css/styles.css">

    <style>
        button.primary {
            opacity: 0.5;
            pointer-events: none;
        }
        button.primary.active {
            opacity: 1;
            pointer-events: auto;
        }
        button.primary.active:active {
            transform: translateY(5px);
            box-shadow: 0 0px 0 0 #0288D1;
        }

        .opt, .img-option {
            min-width: 140px; 
            padding: 20px; 
            border-radius: 20px; 
            background: #fff;
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.1); 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            gap: 10px; 
            cursor: pointer;
            border: 4px solid #E0E0E0; 
            font-size: 1.1rem; 
            font-weight: 600; 
            transition: all .2s;
        }
        
        .opt:not(.disabled):hover, .img-option:not(.disabled):hover {
            transform: translateY(-5px) scale(1.05); 
            box-shadow: 0 12px 25px rgba(0, 0, 0, 0.15);
        }

        .opt.disabled, .img-option.disabled { pointer-events: none; opacity: 0.6; filter: grayscale(0.4); }
        .opt.ok, .img-option.ok { border-color: var(--ok); box-shadow: 0 8px 20px rgba(76,175,80,0.3); background: #E8F5E9; filter: none; opacity: 1;}
        .opt.bad, .img-option.bad { border-color: var(--bad); box-shadow: 0 8px 20px rgba(229,57,53,0.3); background: #FFEBEE; }

        .matching-click-container {
            display: flex; 
            flex-direction: column; 
            gap: 15px; 
            width: 100%; 
            max-width: 700px;
            padding: 20px; 
            background-color: var(--matching-bg); 
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        .matching-card {
            background-color: var(--matching-card-bg); 
            border-radius: 12px; 
            padding: 10px 15px;
            font-weight: 700; 
            font-size: 1.2rem; 
            cursor: pointer; 
            transition: all 0.2s;
            box-shadow: 0 4px 0 0 rgba(0,0,0,0.1); 
            border: 3px solid transparent;
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 60px;
        }
        .matching-card:hover:not(.matched):not(.selected) {
            transform: translateY(-2px); 
            box-shadow: 0 6px 0 0 rgba(0,0,0,0.15);
        }
        .matching-card.selected {
            border-color: var(--select-highlight); 
            box-shadow: 0 0 0 4px var(--select-highlight);
            background-color: #F8E3DD;
        }
        .matching-card.matched {
            background-color: var(--ok); 
            color: white; 
            pointer-events: none; 
            cursor: default;
            box-shadow: none; 
            border-color: var(--ok);
        }
        .matching-card.shaking {
            animation: shake 0.5s; 
            animation-iteration-count: 2; 
            border-color: var(--bad) !important;
            box-shadow: 0 0 0 4px var(--bad) !important; 
            background-color: #FFEBEE !important; 
            color: var(--bad);
        }
        .questions-stack, .answers-stack {
            display: flex; 
            flex-direction: column; 
            gap: 10px; 
            padding: 10px;
            border-radius: 15px; 
            background: rgba(255, 255, 255, 0.5);
        }
        .stack-title {
            font-weight: 800; 
            font-size: 1.1rem; 
            color: var(--color-texto);
            margin-bottom: 5px; 
            text-align: left; 
            padding-left: 10px;
        }

        .audio-btn-big {
            width: 70px; 
            height: 70px; 
            border-radius: 50%; 
            background: var(--accent);
            color: white; 
            font-size: 2rem; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            box-shadow: 0 4px #bf360c; 
            cursor: pointer; 
            margin-bottom: 20px; 
            transition: transform 0.1s;
        }
        .audio-btn-big:active { 
            transform: translateY(4px); 
            box-shadow: none; 
        }

        @media (min-width: 601px) {
            .matching-click-container { 
                flex-direction: row; 
                justify-content: space-around; 
            }
            .questions-stack, .answers-stack { 
                flex-basis: 48%; 
            }
        }
        @media (max-width: 600px) {
            .app { padding-right: 0; }
            button.primary, button.ghost { padding: 8px 15px; font-size: 0.9rem; }
            .controls { flex-direction: column; gap: 10px; align-items: stretch; }
        }
    </style>
</head>
<body>
    <div class="app">
        <header>
            <h1 id="title">U5 - Tema 1: Mi Cuerpo</h1>
            <div style="display: flex; gap: 10px;">
                <button class="ghost" onclick="goHome()" style="font-weight: 500; padding: 10px;">🏠 Inicio</button>
            </div>
        </header>

        <main class="stage-area" id="stageArea"></main>

        <div class="controls" id="controlsArea">
            <div id="feedback" class="feedback"></div>
            </div>
        
        <footer>Prototipo educativo · Unidad 5</footer>
    </div>
    <div class="ground-sim"></div>

    <script>
        const TEMA_ID = 14;
        const MAIN_SCREEN_URL = './U5MICU.html'; 
        const TOTAL_ACTIVITY_POINTS = 100;

        function goHome() { window.location.href = MAIN_SCREEN_URL; }

        const DATA = {
            stages: [
                { 
                    type: 'video', 
                    title: 'Introducción: Mi Cuerpo', 
                    videoUrl: 'https://www.youtube.com/embed/RUTAS_PENDIENTES?rel=0' 
                },
                {
                    type: 'select_image_audio',
                    title: 'Actividad 1: Escucha y Encuentra',
                    rounds: [
                        { word: 'Jol', es: 'Cabeza', img: 'cabeza.png', audio: 'cabeza.mp3' },
                        { word: 'Wuty', es: 'Ojos', img: 'ojo.png', audio: 'ojo.mp3' },
                        { word: 'Ni’', es: 'Nariz', img: 'nariz.png', audio: 'nariz.mp3' },
                        { word: 'Tyi’', es: 'Boca', img: 'boca.png', audio: 'boca.mp3' },
                        { word: 'Chikiñ', es: 'Orejas', img: 'oreja.png', audio: 'oreja.mp3' },
                        { word: 'K’ä’', es: 'Manos', img: 'mano.png', audio: 'mano.mp3' },
                        { word: 'Yalo’ k’ä’', es: 'Dedos', img: 'dedo.png', audio: 'dedo.mp3' },
                        { word: 'Ya’', es: 'Piernas', img: 'pierna.png', audio: 'piernas.mp3' },
                        { word: 'Ok', es: 'Pie', img: 'pie.png', audio: 'pie.mp3' }
                    ]
                },
                {
                    type: 'matching_click',
                    title: 'Actividad 2: Emociones y Adjetivos',
                    rounds: [
                        { ch: 'Bi’bi’', es: 'Feo' },
                        { ch: 'Lekax', es: 'Bonito / Guapo' },
                        { ch: 'Tyijikña', es: 'Feliz' },
                        { ch: 'Ch’äjyem', es: 'Triste' },
                        { ch: 'Bo’yem', es: 'Cansado' },
                        { ch: 'Mich’', es: 'Enojado' }
                    ]
                },
                {
                    type: 'select_image_audio',
                    title: 'Actividad 3: Sensaciones',
                    rounds: [
                        { word: 'Wi’ñal', es: 'Con hambre', img: 'hambre.png', audio: 'hambre.mp3' },
                        { word: 'Tyäkiñ tyi’', es: 'Con sed', img: 'sed.png', audio: 'sed.mp3' },
                        { word: 'Bo’yem', es: 'Cansado', img: 'cansado.png', audio: 'cansado.mp3' },
                        { word: 'Tyijikña', es: 'Feliz', img: 'feliz.png', audio: 'feliz.mp3' },
                        { word: 'Ch’äjyem', es: 'Triste', img: 'triste.png', audio: 'triste.mp3' }
                    ]
                },
                { type: 'final' }
            ]
        };

        const stages = [renderStage0, renderStage1_SelectImage, renderStage2_Matching, renderStage3_SelectImage, renderStageFinal];
        let currentStage = 0;
        let currentActivityRound = 0;
        let userScore = 0;
        let stageProgress = new Array(stages.length).fill(false);
        
        let feedbackEl = null;
        const titleEl = document.getElementById('title');
        let nextBtn = null;
        const controlsArea = document.getElementById('controlsArea');
        const stageArea = document.getElementById('stageArea');

        let selectedQuestion = null;
        let matchedPairsCount = 0;

        function setStageComplete(isComplete = true) {
            stageProgress[currentStage] = isComplete;
            if(nextBtn) nextBtn.classList.toggle('active', isComplete);
        }

        function clearFeedback(){ if(feedbackEl) feedbackEl.textContent = ""; }

        function setFeedback(text, kind){
            if(!feedbackEl) return;
            feedbackEl.textContent = text;
            if(kind === 'ok'){ feedbackEl.style.color = 'var(--ok)' }
            else if(kind === 'bad'){ feedbackEl.style.color = 'var(--bad)' }
            else { feedbackEl.style.color = 'var(--color-texto)' }
        }

        function disableAllOptions() {
            document.querySelectorAll('.opt, .img-option, .matching-card').forEach(el => {
                el.classList.add('disabled');
                el.onclick = null;
            });
        }

        function renderControls(html = '') {
            controlsArea.innerHTML = `<div id="feedback" class="feedback"></div>
                                      <button class="primary" id="nextBtn" onclick="next()">Siguiente ➡</button>${html}`;
            feedbackEl = document.getElementById('feedback');
            nextBtn = document.getElementById('nextBtn');
            
            if (stageProgress[currentStage]) {
                nextBtn.classList.add('active');
            }
        }

        function addPoints(points = 10) { userScore += points; }

        function speakText(text, lang='es-ES'){
            if(!window.speechSynthesis) return;
            const u = new SpeechSynthesisUtterance(text);
            u.lang = lang;
            window.speechSynthesis.cancel();
            window.speechSynthesis.speak(u);
        }

        function playAudio(audioFilename, text = 'Audio', lang = 'cho') {
            const audioUrl = `../assets/audio/${audioFilename}`; 
            const audio = new Audio(audioUrl);
            audio.play()
                .then(() => { setFeedback(`🔊 Escuchando...`, 'neutral'); })
                .catch(e => {
                    console.error(`❌ Error audio: ${e.message}`);
                    speakText(text, lang); 
                    setFeedback(`🔊 "${text}"`, 'neutral');
                });
        }

        function shuffleArray(array) {
            return array.sort(() => Math.random() - 0.5);
        }

        function next() {
            if (!nextBtn.classList.contains('active')) {
                setFeedback("¡Completa la actividad para avanzar!", 'bad');
                return;
            }
            if (currentStage === stages.length - 1) {
                alert(`✅ Unidad Completada. Puntos: ${userScore}.`);
                goHome();
                return; 
            }
            currentStage++;
            currentActivityRound = 0;
            render();
        }

        function render() {
            clearFeedback();
            setStageComplete(false);
            stageArea.innerHTML = '';

            const currentData = DATA.stages[currentStage];
            if(currentData.title) titleEl.textContent = currentData.title;
            else if(currentStage === stages.length -1) titleEl.textContent = "¡Módulo Completado!";

            stages[currentStage](stageArea, currentData);

            if (currentData.type === 'video' || currentData.type === 'final') {
                setStageComplete(true);
            }
        }

        function showActivitySuccessScreen(activityTitle) {
            stageArea.innerHTML = `
                <div style="text-align: center; padding: 40px; background-color: var(--card); border-radius: 20px; border: 3px solid var(--ok); max-width: 400px; margin: 50px auto;">
                    <h2 style="color: var(--ok); font-size: 2rem;">¡Excelente!</h2>
                    <p style="font-size: 1.1rem;">Has completado: <br><strong>${activityTitle}</strong>.</p>
                    <p style="margin-top: 20px;">Presiona <strong>Siguiente</strong> para continuar.</p>
                </div>
            `;
            setStageComplete(true);
        }

        function renderStage0(container, currentData) {
            renderControls();
            container.innerHTML = `
                <div class="video-wrapper">
                    <iframe src="${currentData.videoUrl}" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
                </div>
                <p style="text-align:center; max-width: 600px; margin-top: 20px;">
                    ¡Mira el video para aprender las partes del cuerpo!
                </p>
            `;
            setStageComplete(true);
        }

        function renderStage1_SelectImage(container, currentData) {
            if(currentActivityRound === 0) {
                 currentData._shuffledRounds = shuffleArray([...currentData.rounds]);
            }

            const totalRounds = currentData._shuffledRounds.length;
            const roundItem = currentData._shuffledRounds[currentActivityRound];

            renderControls();

            container.innerHTML = `
                <p class="question-stage-info" style="color: #777; margin-bottom:10px;">Ronda ${currentActivityRound + 1} / ${totalRounds}</p>
                
                <div style="display:flex; flex-direction:column; align-items:center; margin-bottom:20px;">
                    <div class="audio-btn-big" onclick="playAudio('${roundItem.audio}', '${roundItem.word}')">🔊</div>
                    <p style="font-size: 1.2rem;">¿Qué escuchaste?</p>
                </div>
                
                <div class="options-row" id="imageOptionsRow"></div>
            `;

            const row = document.getElementById('imageOptionsRow');
            
            let pool = currentData.rounds.filter(i => i.word !== roundItem.word);
            pool = shuffleArray(pool).slice(0, 2);
            let options = shuffleArray([roundItem, ...pool]);

            options.forEach(opt => {
                const div = document.createElement('div');
                div.className = 'img-option';
                div.innerHTML = `<img src="../assets/img/${opt.img}" alt="${opt.es}"><p>${opt.es}</p>`;
                
                div.onclick = () => {
                    if(div.classList.contains('disabled')) return;

                    if(opt.word === roundItem.word) {
                        div.classList.add('ok');
                        setFeedback(`¡Correcto! Es ${opt.word}`, 'ok');
                        addPoints(10);
                        
                        disableAllOptions();

                        setTimeout(() => {
                            currentActivityRound++;
                            if (currentActivityRound < totalRounds) {
                                renderStage1_SelectImage(container, currentData);
                            } else {
                                showActivitySuccessScreen(currentData.title);
                            }
                        }, 1500);

                    } else {
                        div.classList.add('bad');
                        div.classList.add('disabled'); 
                        setFeedback(`Esa no es. ¡Intenta de nuevo!`, 'bad');
                    }
                };
                row.appendChild(div);
            });
            
            setStageComplete(false);
        }

        function renderStage3_SelectImage(container, currentData) {
            renderStage1_SelectImage(container, currentData);
        }

        function renderStage2_Matching(container, currentData) {
            matchedPairsCount = 0;
            selectedQuestion = null;
            
            renderControls();
            setFeedback('Selecciona la palabra en Ch\'ol y luego su significado.', 'neutral');

            container.innerHTML = `
                <p style="margin-bottom: 20px;">Empareja las emociones.</p>
                <div class="matching-click-container">
                    <div id="colChol" class="questions-stack">
                        <p class="stack-title">Ch'ol</p>
                    </div>
                    <div id="colEs" class="answers-stack">
                        <p class="stack-title">Español</p>
                    </div>
                </div>
            `;

            const colChol = document.getElementById('colChol');
            const colEs = document.getElementById('colEs');

            const listChol = shuffleArray([...currentData.rounds]);
            const listEs = shuffleArray([...currentData.rounds]);

            listChol.forEach(item => {
                const card = document.createElement('div');
                card.className = 'matching-card';
                card.textContent = item.ch;
                card.dataset.id = item.ch;
                card.onclick = () => handleMatchingClick(card, item, 'question');
                colChol.appendChild(card);
            });

            listEs.forEach(item => {
                const card = document.createElement('div');
                card.className = 'matching-card';
                card.textContent = item.es;
                card.dataset.matchId = item.ch;
                card.onclick = () => handleMatchingClick(card, item, 'answer');
                colEs.appendChild(card);
            });

            setStageComplete(false);
        }

        function handleMatchingClick(cardEl, itemData, type) {
            if (cardEl.classList.contains('matched') || cardEl.classList.contains('disabled')) return;

            if (type === 'question') {
                document.querySelectorAll('.questions-stack .matching-card.selected').forEach(c => c.classList.remove('selected'));
                cardEl.classList.add('selected');
                selectedQuestion = itemData;
                setFeedback(`Seleccionaste: **${itemData.ch}**. Busca su pareja.`, 'neutral');
            } else {
                if (!selectedQuestion) {
                    setFeedback('Primero selecciona una palabra de la columna izquierda (Ch\'ol).', 'bad');
                    cardEl.classList.add('shaking');
                    setTimeout(() => cardEl.classList.remove('shaking'), 500);
                    return;
                }

                if (selectedQuestion.ch === itemData.ch) {
                    setFeedback('¡Correcto!', 'ok');
                    cardEl.classList.add('matched');
                    const questionCard = document.querySelector(`.questions-stack .matching-card[data-id="${selectedQuestion.ch}"]`);
                    if(questionCard) {
                        questionCard.classList.remove('selected');
                        questionCard.classList.add('matched');
                    }
                    matchedPairsCount++;
                    addPoints(10);
                    selectedQuestion = null;

                    if (matchedPairsCount >= DATA.stages[2].rounds.length) {
                        showActivitySuccessScreen(DATA.stages[2].title);
                    }
                } else {
                    setFeedback('No coinciden. Intenta de nuevo.', 'bad');
                    cardEl.classList.add('shaking');
                    const questionCard = document.querySelector(`.questions-stack .matching-card.selected`);
                    if(questionCard) questionCard.classList.add('shaking');
                    setTimeout(() => {
                        cardEl.classList.remove('shaking');
                        if(questionCard) questionCard.classList.remove('shaking');
                    }, 500);
                }
            }
        }

        function renderStageFinal(container) {
            guardarProgresoEnBD();
            renderControls();
            container.innerHTML = `
                <div style="text-align: center; padding: 40px; border: 5px dashed var(--ok); border-radius: 20px;">
                    <h1 style="font-size: 4rem;">🎉</h1>
                    <h2 style="color: var(--ok); font-size: 2.5rem;">¡Tema Completado!</h2>
                    <p style="font-size: 1.2rem;">Puntuación total: <strong>${userScore}</strong></p>
                    <p>Presiona el botón Siguiente para volver al menú de la unidad.</p>
                </div>
            `;
            if(nextBtn) {
                nextBtn.textContent = "Volver al Menú";
                nextBtn.classList.add('active');
            }
        }

function guardarProgresoEnBD() {
    fetch('../../backend/api/progress.php', { 
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
            tema_id: TEMA_ID,
            completado: true
        })
    })
    .then(response => response.json())
    .then(data => {
        console.log("Progreso guardado:", data);
        if(data.success) {
        }
    })
    .catch(error => console.error('Error al guardar:', error));
}

        document.addEventListener('DOMContentLoaded', () => {
            render();
        });

    </script>
</body>
</html>
