<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Ch'ol App - Tema 3: Vestimenta</title>
    
    <link rel="stylesheet" href="../css/styles.css">

</head>
<body>
    <div class="app">
        <header>
            <h1 id="title">U5 - Tema 3: Vestimenta</h1>
            <div style="display: flex; gap: 10px;">
                <button class="ghost" onclick="goHome()">🏠 Inicio</button>
            </div>
        </header>

        <main class="stage-area" id="stageArea"></main>

        <div class="controls" id="controlsArea">
            <div id="feedback" class="feedback"></div>
            </div>
        
        <footer>Prototipo educativo · Módulo 5</footer>
    </div>
    <div class="ground-sim"></div>

<script>
    // --- CONFIGURACIÓN ---
    const MAIN_SCREEN_URL = './U5MICU.html'; 
    
    function goHome() { window.location.href = MAIN_SCREEN_URL; }

    // --- DATOS DEL TEMA 3: VESTIMENTA ---
    
    // Actividad 1: Vocabulario (Audio -> Imagen)
    const VOCAB_CLOTHES = [
        { word: 'Pislel', es: 'Ropa', img: 'RUTAS_PENDIENTES/ropa.png', audio: 'RUTAS_PENDIENTES/pislel.mp3' },
        { word: 'Bujk', es: 'Playera/Camisa', img: 'RUTAS_PENDIENTES/playera.png', audio: 'RUTAS_PENDIENTES/bujk.mp3' },
        { word: 'P’o’', es: 'Vestido', img: 'RUTAS_PENDIENTES/vestido.png', audio: 'RUTAS_PENDIENTES/po.mp3' },
        { word: 'Xäñä’', es: 'Zapatos', img: 'RUTAS_PENDIENTES/zapatos.png', audio: 'RUTAS_PENDIENTES/xana.mp3' }
    ];

    // Actividad 2: Matching Frases
    const PAIRS_PHRASES = [
        { ch: '¿chuki yes chonkol a xoje’?', es: '¿Qué estás vistiendo?' },
        { ch: '¿chuki yes chonkol ixoje’ jiñi?', es: '¿Qué está vistiendo él/ella?' },
        { ch: 'Ixä xojol icha’añ jump’ojch p’o’', es: 'Ella viste un vestido' }, // Acortada para matching
        { ch: 'I-ik li kxäñä’', es: 'Mis zapatos son negros' }
    ];

    // Actividad 3: Ordenar Frases (Sintaxis)
    const SENTENCES = [
        { es: 'Mis zapatos son negros', ch: 'I-ik li kxäñä’', words: ['I-ik', 'li', 'kxäñä’'], audio: 'RUTAS_PENDIENTES/zapatos_negros.mp3' },
        { es: '¿Qué estás vistiendo?', ch: '¿chuki yes chonkol a xoje’?', words: ['¿chuki', 'yes', 'chonkol', 'a', 'xoje’?'], audio: 'RUTAS_PENDIENTES/que_vistes.mp3' },
        { es: 'Vestido amarillo', ch: 'p’o’ xk’äñk’äñbä', words: ['p’o’', 'xk’äñk’äñbä'], audio: 'RUTAS_PENDIENTES/vestido_amarillo.mp3' }
    ];

    // --- VARIABLES DE ESTADO ---
    const stages = [renderVideo, renderActivity1, renderActivity2, renderActivity3, renderFinal];
    let currentStage = 0;
    let round = 0;
    let matchedCount = 0;
    let selectedMatch = null;
    let currentSentenceBuilder = [];

    const titleEl = document.getElementById('title');
    const stageArea = document.getElementById('stageArea');
    const feedbackEl = document.getElementById('feedback');
    const controlsArea = document.getElementById('controlsArea');

    // --- FUNCIONES UTILITARIAS ---
    function playAudio(path) {
        const audio = new Audio(path);
        audio.play().catch(e => console.log("Audio simulado:", path));
    }

    function setFeedback(msg, type) {
        feedbackEl.textContent = msg;
        feedbackEl.style.color = type === 'ok' ? 'var(--ok)' : (type === 'bad' ? 'var(--bad)' : '#333');
    }

    function createNextBtn() {
        const btn = document.createElement('button');
        btn.className = 'primary';
        btn.textContent = 'Siguiente ➡';
        btn.onclick = nextStage;
        btn.id = 'nextBtn';
        btn.style.display = 'none'; 
        return btn;
    }

    function nextStage() {
        currentStage++;
        round = 0;
        if(currentStage >= stages.length) return; // Fin
        render();
    }

    function render() {
        stageArea.innerHTML = '';
        feedbackEl.textContent = '';
        
        const oldBtn = document.getElementById('nextBtn');
        if(oldBtn) oldBtn.remove();
        
        const nextBtn = createNextBtn();
        controlsArea.appendChild(nextBtn);

        stages[currentStage](nextBtn);
    }

    // --- 0. VIDEO ---
    function renderVideo(nextBtn) {
        titleEl.textContent = "Introducción: Vestimenta";
        stageArea.innerHTML = `
            <div class="video-wrapper">
                <iframe src="https://www.youtube.com/embed/RUTAS_PENDIENTES" allowfullscreen></iframe>
            </div>
            <p>¡Descubre cómo nombrar tu ropa en Ch'ol!</p>
        `;
        nextBtn.style.display = 'block';
    }

    // --- 1. ACTIVIDAD: VOCABULARIO ROPA ---
    function renderActivity1(nextBtn) {
        // Como son pocos ítems (4), haremos 4 rondas fijas
        if(round >= VOCAB_CLOTHES.length) {
            stageArea.innerHTML = `<h2>¡Muy bien! Ya conoces la ropa básica.</h2>`;
            nextBtn.style.display = 'block';
            return;
        }

        // Si es primera ronda, mezclar orden
        if(round === 0) VOCAB_CLOTHES.sort(() => 0.5 - Math.random());
        const currentItem = VOCAB_CLOTHES[round];
        
        titleEl.textContent = `Actividad 1: Escucha la prenda (${round + 1}/${VOCAB_CLOTHES.length})`;

        stageArea.innerHTML = `
            <div class="audio-btn-big" onclick="playAudio('${currentItem.audio}')">🔊</div>
            <p style="font-size: 1.2rem;">¿Qué palabra escuchaste?</p>
        `;

        const optionsRow = document.createElement('div');
        optionsRow.className = 'options-row';

        // Usar todas las opciones disponibles ya que son pocas
        let options = [...VOCAB_CLOTHES];
        options.sort(() => 0.5 - Math.random());

        options.forEach(opt => {
            const div = document.createElement('div');
            div.className = 'img-option';
            div.innerHTML = `<img src="${opt.img}" alt="${opt.es}"><p>${opt.es}</p>`;
            
            div.onclick = () => {
                if(div.classList.contains('disabled')) return;
                document.querySelectorAll('.img-option').forEach(el => el.classList.add('disabled'));

                if(opt === currentItem) {
                    div.classList.add('ok');
                    setFeedback("¡Correcto! " + opt.word, 'ok');
                    setTimeout(() => { round++; renderActivity1(nextBtn); }, 1500);
                } else {
                    div.classList.add('bad');
                    setFeedback("Incorrecto", 'bad');
                    setTimeout(() => {
                        document.querySelectorAll('.img-option').forEach(el => el.classList.remove('disabled', 'bad'));
                        setFeedback("", 'neutral');
                    }, 1000);
                }
            };
            optionsRow.appendChild(div);
        });
        stageArea.appendChild(optionsRow);
    }

    // --- 2. ACTIVIDAD: MATCHING FRASES ---
    function renderActivity2(nextBtn) {
        titleEl.textContent = "Actividad 2: Preguntas y Respuestas";
        
        if (matchedCount === 0) {
            stageArea.innerHTML = `
                <p>Relaciona la frase en **Ch'ol** con su significado.</p>
                <div class="matching-container">
                    <div class="col-stack" id="col-chol"><div class="stack-title">Ch'ol</div></div>
                    <div class="col-stack" id="col-es"><div class="stack-title">Español</div></div>
                </div>
            `;
            
            const listCh = [...PAIRS_PHRASES].sort(() => 0.5 - Math.random());
            const listEs = [...PAIRS_PHRASES].sort(() => 0.5 - Math.random());

            listCh.forEach(item => createCard(item.ch, 'ch', item, 'col-chol', nextBtn));
            listEs.forEach(item => createCard(item.es, 'es', item, 'col-es', nextBtn));
        }
    }

    function createCard(text, type, dataObj, containerId, nextBtn) {
        const card = document.createElement('div');
        card.className = 'match-card';
        card.textContent = text;
        card.onclick = () => handleMatch(card, type, dataObj, nextBtn);
        document.getElementById(containerId).appendChild(card);
    }

    function handleMatch(card, type, dataObj, nextBtn) {
        if(card.classList.contains('matched') || card.classList.contains('selected')) return;
        card.classList.add('selected');

        if(!selectedMatch) {
            selectedMatch = { card, type, dataObj };
        } else {
            const first = selectedMatch;
            if(first.type !== type && first.dataObj === dataObj) {
                setFeedback("¡Correcto!", 'ok');
                first.card.classList.remove('selected'); card.classList.remove('selected');
                first.card.classList.add('matched'); card.classList.add('matched');
                matchedCount++;
                if(matchedCount >= PAIRS_PHRASES.length) {
                    setFeedback("¡Excelente!", 'ok');
                    nextBtn.style.display = 'block';
                }
            } else {
                setFeedback("No coinciden...", 'bad');
                setTimeout(() => {
                    first.card.classList.remove('selected');
                    card.classList.remove('selected');
                    setFeedback("", 'neutral');
                }, 800);
            }
            selectedMatch = null;
        }
    }

    // --- 3. ACTIVIDAD: ORDENAR FRASE ---
    function renderActivity3(nextBtn) {
        if(round >= SENTENCES.length) {
            stageArea.innerHTML = `<h2>¡Terminaste todas las frases!</h2>`;
            nextBtn.style.display = 'block';
            return;
        }

        const currentItem = SENTENCES[round];
        currentSentenceBuilder = [];
        
        titleEl.textContent = `Actividad 3: Ordena (${round + 1}/${SENTENCES.length})`;

        stageArea.innerHTML = `
            <div style="margin-bottom:15px; font-style:italic;">"${currentItem.es}"</div>
            <div class="audio-btn-big" style="width:50px; height:50px; font-size:1.5rem;" onclick="playAudio('${currentItem.audio}')">🔊</div>
            
            <div class="sentence-area" id="dropZone"></div>
            <div class="word-bank" id="wordBank"></div>
            <button class="ghost" style="margin-top:15px;" onclick="resetSentence()">Reintentar</button>
        `;

        const bank = document.getElementById('wordBank');
        const shuffledWords = [...currentItem.words].sort(() => 0.5 - Math.random());

        shuffledWords.forEach(word => {
            const tile = document.createElement('div');
            tile.className = 'word-tile';
            tile.textContent = word;
            tile.onclick = () => addWord(tile, word, currentItem, nextBtn);
            bank.appendChild(tile);
        });
    }

    function addWord(tileEl, word, targetItem, nextBtn) {
        if(tileEl.classList.contains('used')) return;
        
        const dropZone = document.getElementById('dropZone');
        const newTile = document.createElement('div');
        newTile.className = 'word-tile';
        newTile.textContent = word;
        newTile.style.cursor = 'default';
        dropZone.appendChild(newTile);

        tileEl.classList.add('used');
        currentSentenceBuilder.push(word);

        if(currentSentenceBuilder.length === targetItem.words.length) {
            const attempt = currentSentenceBuilder.join(' ');
            if(attempt === targetItem.ch) {
                setFeedback("¡Perfecto!", 'ok');
                setTimeout(() => {
                    round++;
                    renderActivity3(nextBtn);
                }, 1500);
            } else {
                setFeedback("Incorrecto. Intenta de nuevo.", 'bad');
                setTimeout(() => resetSentence(), 1500);
            }
        }
    }

    function resetSentence() {
        document.getElementById('dropZone').innerHTML = '';
        currentSentenceBuilder = [];
        setFeedback("", 'neutral');
        document.querySelectorAll('.word-tile.used').forEach(el => el.classList.remove('used'));
    }

    // --- FINAL ---
    function renderFinal(nextBtn) {
        titleEl.textContent = "¡Módulo 5 Completado!";
        stageArea.innerHTML = `
            <div style="padding:40px; border: 3px dashed var(--ok); border-radius: 20px;">
                <h1 style="font-size: 4rem;">🏆</h1>
                <h2>¡Felicidades!</h2>
                <p>Has completado todo el Módulo 5: Mi Cuerpo.</p>
                <p>¡Eres un experto!</p>
            </div>
        `;
        nextBtn.textContent = "Volver al Menú";
        nextBtn.style.display = 'block';
        nextBtn.onclick = goHome;
    }

    // Inicio
    render();

</script>
</body>
</html>
