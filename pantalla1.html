<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lecciones - Aprendiendo Ch'ol</title>
    <style>
        /* Estilos Base */
        body {
            font-family: 'Comic Sans MS', 'Comic Sans', cursive; 
            margin: 0;
            /* Aumentamos el padding superior para compensar la barra de módulos Y el botón */
            padding-top: 110px; 
            background-color: #75b4c7; 
            color: #333;
            text-align: center;
            position: relative; /* Base para el contenido no fijo */
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        /* ------------------ BARRA DE MÓDULOS (FIJA y MÁS GRANDE) ------------------ */
        .module-bar {
            position: fixed; 
            top: 0; /* Arriba del todo */
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 15px;
            padding: 15px 0;
            background-color: #71a947; 
            border-bottom: 5px solid #486b2a; 
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            z-index: 10;
        }

        .module-bar button {
            background-color: #fff;
            color: #333;
            border: none;
            padding: 12px 20px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            flex-grow: 1; 
            max-width: 180px;
        }

        .module-bar button:hover {
            transform: translateY(-3px); 
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.2);
        }

        /* ------------------ BOTÓN DE PERFIL (FIJO DEBAJO DE LA BARRA) ------------------ */
        .profile-button {
            position: fixed; /* Posicionamiento Fijo */
            top: 75px; /* Calculado para quedar justo debajo de la barra (~60px de alto) */
            right: 20px; /* Esquina derecha */
            
            display: inline-block;
            padding: 8px 15px;
            background-color: #fff;
            border-radius: 20px;
            text-decoration: none;
            color: #555;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.15); 
            font-weight: bold;
            transition: transform 0.2s;
            z-index: 9; /* Debe estar debajo de la barra si se superponen ligeramente */
        }

        .profile-button:hover {
            transform: scale(1.05);
        }


        /* ------------------ CONTENIDO PRINCIPAL Y LECCIONES ------------------ */
        .main-content {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-top: 20px; /* Reducimos el margen superior */
            flex-wrap: nowrap;
            align-items: flex-start;
        }

        .character-area {
            background-color: #fff;
            border: 5px solid #2A9D8F; 
            border-radius: 20px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
            padding: 10px;
            width: 300px; 
            flex-shrink: 0; 
        }

        .character-area img {
            max-width: 100%;
            height: auto;
            border-radius: 15px;
        }

        .lessons-and-games {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 50%;
            max-width: 600px;
        }

        .lesson-card {
            background-color: #fff;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 20px;
            text-align: left;
            text-decoration: none; 
        }
        
        .lesson-card:hover {
            transform: scale(1.02); 
        }

        .lesson-card .icon {
            font-size: 2.5rem; 
            color: #2A9D8F;
            flex-shrink: 0;
            font-weight: bold;
        }

        .lesson-card h3 {
            margin: 0;
            font-size: 1.5rem;
            color: #333;
        }

        .game-buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }

        .game-buttons button {
            background-color: #FFD166; 
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            transition: background-color 0.2s;
            flex-grow: 1; 
        }

        .game-buttons button:hover {
            background-color: #FFC04C;
        }

        /* ============================================== */
        /* === MEDIA QUERIES PARA RESPONSIVIDAD MÓVIL === */
        /* ============================================== */
        @media (max-width: 768px) {
            
            /* Ajuste de Botón de Perfil en móvil */
            .profile-button {
                top: 55px; /* Lo mantenemos debajo de la barra fija (~40px de alto en móvil) */
                right: 10px;
                padding: 7px 12px;
                font-size: 0.8rem;
            }
            
            /* Ajuste de Barra de Módulos en móvil */
            .module-bar {
                padding: 8px; 
            }

            .module-bar button {
                flex-basis: calc(33.33% - 10px); 
                font-size: 0.85rem;
                padding: 6px 8px;
            }
            
            body {
                /* Padding superior en móvil para compensar ambos elementos fijos */
                padding-top: 100px; 
            }

            /* El resto del contenido mantiene la lógica de apilamiento vertical */
            .main-content {
                flex-direction: column; 
                align-items: center;
                gap: 30px;
            }

            .character-area {
                width: 90%; 
                max-width: 400px;
            }

            .lessons-and-games {
                width: 100%; 
                padding: 0 10px;
            }

            .game-buttons {
                flex-direction: column;
                gap: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="module-bar">
            <button>Familia</button>
            <button>Donde vivo</button>
            <button>Escuela</button>
            <button>Cuerpo</button>
            <button>Pasatiempos</button>
        </div>

        <a href="user.html" class="profile-button">Mi Perfil</a>

        <div class="main-content">
            <div class="character-area">
                <img src="img/img1.png" alt="Personaje principal">
            </div>

            <div class="lessons-and-games">
                <a class="lesson-card" href="U1T1.html">
                    <span class="icon">1</span> 
                    <h3>Saludos</h3>
                </a>
                <a class="lesson-card" href="U1T2.html">
                    <span class="icon">2</span> 
                    <h3>Presentación</h3>
                </a>
                <a href="U1T3.html" class="lesson-card">
                    <span class="icon">3</span> 
                    <h3>Familia</h3>
                </a>
                
                <h1>Mini Juegos</h1>
                <div class="game-buttons">
                    <button>Juego 1</button>
                    <button>Juego 2</button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
