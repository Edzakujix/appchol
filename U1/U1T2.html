<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Tema 2: Presentación Personal</title>

        <link rel="stylesheet" href="../assets/css/styles.css">

    <style>
.demo-image-card {
    width: 150px; 
    height: 150px;
    border-radius: 50%;
    background-color: #E0E0E0;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    border: 5px solid transparent;
    transition: all 0.3s;
}

.demo-image-card:hover {
    transform: scale(1.05);
    border-color: var(--next);
}

.demo-image-card img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 50%;
}

.translation-container {
    width: 100%;
    max-width: 650px;
    text-align: center;
    padding: 20px;
    background-color: #e3f2fd;
    border-radius: 20px;
    border: 3px solid #90caf9;
    margin-bottom: 20px;
}

.translation-prompt {
    font-size: clamp(1.3rem, 4vw, 1.8rem);
    font-weight: 800;
    color: var(--accent);
    margin-bottom: 15px;
    text-shadow: 1px 1px #fff;
}

.translation-options-row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
}

.translation-option {
    background-color: #fff;
    border: 3px solid #FFCA28;
    border-radius: 15px;
    padding: 15px 20px;
    font-weight: 700;
    font-size: 1.1rem;
    cursor: pointer;
    transition: all 0.2s;
}

.translation-option:hover:not(.disabled) {
    transform: translateY(-3px);
    box-shadow: 0 5px 10px rgba(0, 0, 0, 0.1);
}

.translation-option.ok {
    border-color: var(--ok);
    background: #E8F5E9;
}

.translation-option.bad {
    border-color: var(--bad);
    background: #FFEBEE;
}

@media (max-width: 600px){
    .translation-prompt { font-size: 1.3rem; }
    .translation-option { font-size: 1rem; }
}
    </style>
</head>
<body>
    <div class="app" role="application" aria-label="Prototipo actividades para primaria">
        <header>
            <h1 id="title">Mini-Clase: Presentación Personal</h1>
            <div style="display: flex; gap: 10px;">
                <button class="ghost" onclick="goHome()" style="font-weight: 500; padding: 10px;">🏠 Inicio</button> 
                <button class="primary" id="nextBtn" onclick="next()">Siguiente</button>
            </div>
        </header>

        <main class="stage-area" id="stageArea"></main>

        <div class="controls" id="controlsArea">
             </div>

        <footer>Prototipo educativo · Tema 2: Presentación Personal</footer>
    </div>
        <div class="ground-sim"></div>


<script>
    const TEMA_ID = 2;
    const MAIN_SCREEN_URL = '../U1/U1FAM.html'; 
    
    function goHome() {
        window.location.href = MAIN_SCREEN_URL;
    }

    const stages = [renderStage0, renderStage1, renderStage2, renderStage3, renderStage4, renderStage5];
    let currentStage = 0;
    let feedbackEl = null; 
    const titleEl = document.getElementById('title');
    const nextBtn = document.getElementById('nextBtn');
    const controlsArea = document.getElementById('controlsArea');
    
    let stageProgress = new Array(stages.length).fill(false); 
    let userScore = 0;
    const TOTAL_ACTIVITY_POINTS = 40; 


    function setStageComplete(isComplete = true) {
        if (isComplete && !stageProgress[currentStage]) {
             if(currentStage >= 2 && currentStage <= 4) { 
                 userScore += 10; 
             }
        }
        stageProgress[currentStage] = isComplete;
        nextBtn.classList.toggle('active', isComplete);
    }

    function clearFeedback(){ 
        if(feedbackEl) feedbackEl.textContent = ""; 
    }
    function setFeedback(text, kind){
        if(!feedbackEl) return;
        feedbackEl.textContent = text;
        if(kind === 'ok'){ feedbackEl.style.color = 'var(--ok)' }
        else if(kind === 'bad'){ feedbackEl.style.color = 'var(--bad)' }
        else { feedbackEl.style.color = 'var(--text-color)' }
    }

    function renderControls(html = '') {
        controlsArea.innerHTML = `<div id="feedback" class="feedback"></div>${html}`;
        feedbackEl = document.getElementById('feedback');
    }

    function next(){ 
        if (!stageProgress[currentStage]) {
            setFeedback("¡Termina esta parte antes de continuar!", 'bad');
            return;
        }

        if (currentStage === 5) {
            alert(`✅ Tema Terminado. Puntuación simulada: ${userScore}/${TOTAL_ACTIVITY_POINTS}. Volviendo a la pantalla principal...`);
            window.location.href = MAIN_SCREEN_URL; 
            return; 
        }

        currentStage++;
        if (currentStage >= stages.length) {
            currentStage = stages.length - 1; 
        }
        render(); 
    }

    function render(){ 
        clearFeedback(); 
        setStageComplete(false);
        const container = document.getElementById('stageArea'); 
        container.innerHTML=''; 

        const titles = [
            'Mini-Clase: Presentación Personal', 
            'Actividad 1: Demostración (Niño/Niña)', 
            'Actividad 2: Identificar Familia/Objetos (6 rondas)', 
            'Actividad 3: Conteo Visual (4 rondas)',
            'Actividad 4: Traducción de Preguntas (5 rondas)',
            '¡Tema Terminado!' 
        ];
        titleEl.textContent = titles[currentStage];

        stages[currentStage](container);
        
        if (currentStage === 0 || currentStage === 5) { 
            setStageComplete(true);
        }
    }

    function speakText(text, lang='es-ES'){
        if(!window.speechSynthesis) return;
        const u = new SpeechSynthesisUtterance(text);
        u.lang = lang;
        window.speechSynthesis.cancel();
        window.speechSynthesis.speak(u);
    }
    
    function playAudio(audioFilename, text, lang = 'cho') {
        const audioUrl = `../assets/audio/${audioFilename}`; 
        
        const audio = new Audio(audioUrl);
        
        audio.play()
            .then(() => {
                setFeedback(`🔊 Reproduciendo: "${text}"`, 'neutral');
            })
            .catch(e => {
                console.error(`❌ Error al cargar o reproducir "${audioUrl}": ${e.message}`);
                
                speakText(text, lang); 
                setFeedback(`[TTS] No se encontró el audio real. Reproduciendo: "${text}"`, 'neutral');
            });
    }

    function createAudioButton(text, audioFilename, lang = 'cho') {
        const btn = document.createElement('button');
        btn.className = 'ghost';
        btn.innerHTML = '🔊 Reproducir Audio';
        btn.onclick = () => { playAudio(audioFilename, text, lang); };
        return btn;
    }

    function renderStage0(container){
          const videoHtml = `
            <div class="video-wrapper">
                <iframe src="https://www.youtube.com/embed/z4fR0S2T-R0?rel=0" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
            </div>
            <p style="text-align:center; max-width: 600px; margin-top: 20px;">
                ¡Mira el video para aprender las frases de presentación! Presiona "Siguiente" para la demostración.
            </p>
        `;
        container.innerHTML = videoHtml;
        setStageComplete(true);
        renderControls();
    }

    function renderStage1(container) {
        container.innerHTML = `<p class="stage0-info">Toca una figura para escuchar cómo se presenta un niño o una niña en Ch'ol.</p>`;

        const demoData = [
            { type: 'niño', chool: "Yo soy un niño.", translation: "Mi nombre es Octavio", filename: "yo_soy_un_niño.mp3" }, 
            { type: 'niña', chool: "Yo soy una niña.", translation: "Mi nombre es María", filename: "yo_soy_una_niña.mp3" }
        ];

        const row = document.createElement('div');
        row.className = 'options-row';

        demoData.forEach(data => {
            const b = document.createElement('div');
            b.className = 'demo-image-card';
            b.dataset.type = data.type;
            
            const img = document.createElement('img');
            img.setAttribute('src', `../assets/img/${data.type === 'niña' ? 'niña.png' : 'niño.png'}`); 

            b.onclick = () => {
                playAudio(data.filename, data.chool, 'cho');
                setFeedback(`Ch'ol: "${data.chool}" (Español: ${data.translation})`, 'neutral');
            };
            
            b.appendChild(img);
            row.appendChild(b);
        });

        container.appendChild(row);
        setStageComplete(true);
        renderControls();
    }

    const stage2Data = [
        { audio: "Ella es mi mamá.", filename: "ella_es_mi_mama.mp3", correct: "mama.png", options: ["mama.png", "abuelo.png", "abuela.png"], text: "Mi mamá" },
        { audio: "el es mi papá.", filename: "el_es_mi_papa.mp3", correct: "papa.png", options: ["papa.png", "hermano.png", "tia.png"], text: "Mi papá" },
        { audio: "Mi perro es pequeño.", filename: "mi_perro_es_pequeño.mp3", correct: "chihuahua.png", options: ["chihuahua.png", "vaca.png", "gallo.png"], text: "Mi perro es pequeño" },
        { audio: "Mi casa es amarilla.", filename: "mi_casa_es_amarilla.mp3", correct: "casa_amarilla.png", options: ["casa_amarilla.png", "tarde.png", "noche.png"], text: "Mi casa es amarilla" },
        { audio: "El es mi abuelo.", filename: "el_es_mi_abuelo.mp3", correct: "abuelo.png", options: ["abuelo.png", "tio.png", "hermano.png"], text: "Mi abuelo" },
        { audio: "Yo soy un niño.", filename: "yo_soy_un_niño.mp3", correct: "niño.png", options: ["niño.png", "papa.png", "niña.png"], text: "Yo soy un niño" },
    ];
    let currentRound2 = 0; 

    function checkAnswer2(selectedImage, currentData, allOptionsElements) {
        if (selectedImage === currentData.correct) {
            setFeedback('¡Muy bien! ¡Correcto!', 'ok');
            currentRound2++;
            setTimeout(() => {
                renderStage2(document.getElementById('stageArea'));
            }, 1200);
        } else {
            setFeedback('Incorrecto. ¡La imagen correcta representa: ' + currentData.text + '!', 'bad');
            allOptionsElements.forEach(el => {
                if (el.dataset.img === currentData.correct) {
                    el.classList.add('ok');
                }
            });
            currentRound2++;
            setTimeout(() => {
                renderStage2(document.getElementById('stageArea'));
            }, 2500);
        }
    }

    function renderStage2(container) {
        if (currentRound2 >= stage2Data.length) {
            container.innerHTML = `<h2 style="color: var(--ok);">¡Felicidades! Completaste las 6 rondas.</h2>`;
            setStageComplete(true);
            renderControls();
            return;
        }

        const currentData = stage2Data[currentRound2];
        container.innerHTML = `<p class="stage0-info">Ronda ${currentRound2 + 1} de ${stage2Data.length}: Escucha la frase en Ch'ol y selecciona la imagen correcta.</p>`;

        renderControls(); 
        
        const audioBtn = createAudioButton(currentData.audio, currentData.filename, 'cho'); 
        
        const buttonWrapper = document.createElement('div');
        buttonWrapper.style.cssText = "display: flex; gap: 15px; justify-content: center; margin-bottom: 20px;";
        buttonWrapper.appendChild(audioBtn);
        
        const feedbackEl = document.getElementById('feedback');
        if (controlsArea) {
            controlsArea.insertBefore(buttonWrapper, feedbackEl.nextSibling); 
        }

        const row = document.createElement('div');
        row.className = 'options-row';
        currentData.options.sort(() => Math.random() - 0.5); 

        currentData.options.forEach(opt => {
            const b = document.createElement('div');
            b.className = 'opt';
            b.dataset.img = opt; 
            
            b.innerHTML = `<img src="../assets/img/${opt}" alt="Opción" style="width: 100px; height: 100px; border-radius: 10px;"/>`;

            b.onclick = (e) => {
                const allOptions = document.querySelectorAll('.opt');
                allOptions.forEach(el => el.classList.add('disabled'));
                
                if (opt === currentData.correct) {
                    b.classList.add('ok');
                } else {
                    b.classList.add('bad');
                }
                
                checkAnswer2(opt, currentData, allOptions);
            };
            row.appendChild(b);
        });

        container.appendChild(row);
        setStageComplete(false); 
    }
    
    const choolNumbers = [
        { num: 1, word: "Jump´ej", filename: "uno.mp3" },
        { num: 2, word: "Chap´ej", filename: "dos.mp3" },
        { num: 3, word: "Uxp´ej", filename: "tres.mp3" },
        { num: 4, word: "Chämp´ej", filename: "cuatro.mp3" },
        { num: 5, word: "Jop´ej", filename: "cinco.mp3" },
        { num: 6, word: "Wäkp´ej", filename: "seis.mp3" },
        { num: 7, word: "Wukp´ej", filename: "siete.mp3" },
        { num: 8, word: "Waxäkp´ej", filename: "ocho.mp3" },
        { num: 9, word: "Bolomp´ej", filename: "nueve.mp3" },
        { num: 10, word: "Lujump´ej", filename: "diez.mp3" }
    ];

    const stage3Data = [
        { count: 3, wordChool: "Uxp´ej", filename: "tres.mp3", image: "tres.png" },
        { count: 5, wordChool: "Jop´ej", filename: "cinco.mp3", image: "cinco.png" },
        { count: 7, wordChool: "Wukp´ej", filename: "siete.mp3", image: "siete.png" },
        { count: 10, wordChool: "Lujump´ej", filename: "diez.mp3", image: "diez.png" },
    ];
    let currentRound3 = 0;

    function getAudioOptions(correctWordChool) {
        const correctOpt = choolNumbers.find(n => n.word === correctWordChool);
        let options = [correctOpt];
        
        const allOther = choolNumbers.filter(n => n.word !== correctWordChool);
        while (options.length < 4 && allOther.length > 0) {
            const randomIndex = Math.floor(Math.random() * allOther.length);
            options.push(allOther[randomIndex]);
            allOther.splice(randomIndex, 1); 
        }
        return options.sort(() => Math.random() - 0.5);
    }


    function checkAnswer3(selectedWord, currentData, allOptionsElements) {
        if (selectedWord === currentData.wordChool) {
            setFeedback('¡Correcto! El número ' + currentData.wordChool + ' coincide.', 'ok');
            currentRound3++;
            setTimeout(() => {
                renderStage3(document.getElementById('stageArea'));
            }, 1200);
        } else {
            setFeedback('Incorrecto. El número correcto es: ' + currentData.wordChool + ' (' + currentData.count + ')', 'bad');
            
            allOptionsElements.forEach(el => {
                if (el.dataset.word === currentData.wordChool) {
                    el.classList.add('ok');
                }
            });
            
            currentRound3++;
            
            setTimeout(() => {
                renderStage3(document.getElementById('stageArea'));
            }, 2500);
        }
    }

    function renderStage3(container) {
        if (currentRound3 >= stage3Data.length) {
            container.innerHTML = `<h2 style="color: var(--ok);">¡Muy bien! ¡Contaste ${stage3Data.length} veces correctamente!</h2>`;
            setStageComplete(true);
            renderControls();
            return;
        }

        const currentData = stage3Data[currentRound3];
        const options = getAudioOptions(currentData.wordChool);

        container.innerHTML = `
            <p class="stage0-info">Ronda ${currentRound3 + 1} de ${stage3Data.length}: Mira la imagen y selecciona apretando dos veces el número en Ch'ol que corresponde al conteo.</p>
            <img src="../assets/img/${currentData.image}" alt="Elementos a contar" style="width: 200px; height: 200px; border-radius: 15px; margin-bottom: 20px; border: 3px solid var(--accent);"/>
        `;
        
        const audioBtn = createAudioButton(currentData.wordChool, currentData.filename, 'cho'); 
        
        renderControls(); 
        
        const buttonWrapper = document.createElement('div');
        buttonWrapper.style.cssText = "display: flex; gap: 15px; justify-content: center; margin-bottom: 20px; margin-top: 10px;";
        buttonWrapper.appendChild(audioBtn);
        
        const feedbackEl = document.getElementById('feedback');
        if (controlsArea) {
            controlsArea.insertBefore(buttonWrapper, feedbackEl.nextSibling); 
        }
        
        const row = document.createElement('div');
        row.className = 'options-row';

        options.forEach(opt => {
            const b = document.createElement('div');
            b.className = 'word-option translation-option'; 
            b.dataset.word = opt.word;
            b.dataset.filename = opt.filename;
            b.textContent = opt.word + ' (🔊)'; 
            
            b.onclick = (e) => {
                const allOptions = document.querySelectorAll('.translation-option');
                
                if (!b.classList.contains('clicked-once') && !b.classList.contains('disabled')) {
                    playAudio(opt.filename, opt.word, 'cho'); 
                    b.classList.add('clicked-once');
                    setTimeout(() => b.classList.remove('clicked-once'), 1500);
                    setFeedback(`Escuchaste: **${opt.word}**. Toca de nuevo para seleccionar.`, 'neutral');
                    return;
                }
                
                allOptions.forEach(el => el.classList.add('disabled'));
                b.classList.remove('clicked-once');
                
                if (opt.word !== currentData.wordChool) {
                    b.classList.add('bad');
                }

                checkAnswer3(opt.word, currentData, allOptions);
            };
            row.appendChild(b);
        });

        container.appendChild(row);
        setStageComplete(false);
    }


    const stage4Data = [
        { question: "¿Cómo te llamas?", correct: "¿Bajche´ ak´aba´?", options: ["¿Ba´ki chumulety?", "¿Bajche´ ak´aba´?", "Jiñi ili kpap"] },
        { question: "Mi nombre es Octavio", correct: "Jk´aba´ aj Octavio", options: ["Jk´aba´ aj Octavio", "Joñoñ wukp´ej ka´bilel", "Jiñi ili kña´"] },
        { question: "¿Cuántos años tienes?", correct: "¿Bajche´aja´bilel?", options: ["¿Bajche´aja´bilel?", "¿Ba´ki tyälemety?", "¿Ba´ki ch´oyolety?"] },
        { question: "Yo tengo 7 años", correct: "Joñoñ wukp´ej ka´bilel", options: ["Jiñi ili kyum", "Joñoñ wukp´ej ka´bilel", "Joñoñ chuty wiñikoñ"] },
        { question: "¿Dónde vives?", correct: "¿Ba´ki chumulety?", options: ["¿Ba´ki chumulety?", "Jk´aba´ aj María", "Jiñi ili chuty wiñik"] },
    ];
    let currentRound4 = 0;

    function checkAnswer4(selectedOption, currentData, allOptionsElements) {
        if (selectedOption === currentData.correct) {
            setFeedback('¡Correcto! Es la traducción correcta.', 'ok');
            currentRound4++;
            setTimeout(() => {
                renderStage4(document.getElementById('stageArea'));
            }, 1200);
        } else {
            setFeedback('Incorrecto. La traducción correcta es: ' + currentData.correct, 'bad');
            
            allOptionsElements.forEach(el => {
                if (el.textContent === currentData.correct) {
                    el.classList.add('ok');
                }
            });

            currentRound4++; 
            
            setTimeout(() => {
                renderStage4(document.getElementById('stageArea'));
            }, 2500);
        }
    }

    function renderStage4(container) {
        if (currentRound4 >= stage4Data.length) {
            container.innerHTML = `<h2 style="color: var(--ok);">¡Felicidades! Terminaste las 5 preguntas.</h2>`;
            setStageComplete(true);
            renderControls();
            return;
        }

        const currentData = stage4Data[currentRound4];
        container.innerHTML = `<p class="stage0-info">Ronda ${currentRound4 + 1} de ${stage4Data.length}: Selecciona la traducción correcta a Ch'ol para la siguiente frase en Español:</p>`;
        
        const translationContainer = document.createElement('div');
        translationContainer.className = 'translation-container';
        translationContainer.innerHTML = `<div class="translation-prompt">${currentData.question}</div>`;
        container.appendChild(translationContainer);

        const optionsContainer = document.createElement('div');
        optionsContainer.className = 'translation-options-row';
        currentData.options.sort(() => Math.random() - 0.5); 

        currentData.options.forEach(opt => {
            const b = document.createElement('div');
            b.className = 'translation-option';
            b.textContent = opt;
            
            b.onclick = () => {
                const allOptions = document.querySelectorAll('.translation-option');
                allOptions.forEach(el => el.classList.add('disabled'));

                if (opt === currentData.correct) {
                    b.classList.add('ok');
                } else {
                    b.classList.add('bad');
                }
                
                checkAnswer4(opt, currentData, allOptions);
            };
            optionsContainer.appendChild(b);
        });

        container.appendChild(optionsContainer);
        setStageComplete(false); 
        renderControls();
    }

    function renderStage5(container) {
        container.innerHTML = `
            <div style="text-align: center; padding: 40px; border: 5px dashed var(--ok); border-radius: 20px;">
                <h2 style="color: var(--ok); font-size: 2.5rem;">🎉 ¡Tema 2 Completado! 🎉</h2>
                <p style="font-size: 1.2rem;">Puntuación simulada: ${userScore}/${TOTAL_ACTIVITY_POINTS}</p>
                <p>Has terminado todas las actividades de Presentación Personal.</p>
                <p>Presiona Siguiente para volver a la pantalla principal.</p>
            </div>
        `;
        guardarProgresoEnBD();
        setStageComplete(true);
        renderControls();
    }

    function guardarProgresoEnBD() {
    fetch('../../backend/api/progress.php', { 
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
            tema_id: TEMA_ID,
            completado: true
        })
    })
    .then(response => response.json())
    .then(data => {
        console.log("Progreso guardado:", data);
        if(data.success) {
        }
    })
    .catch(error => console.error('Error al guardar:', error));
}

    document.addEventListener('DOMContentLoaded', () => {
        render();
    });
</script>
</body>
</html>
