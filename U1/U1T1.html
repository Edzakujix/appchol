<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Ch'ol App - Tema 1: Saludos</title>

    <link rel="stylesheet" href="../assets/css/styles.css">

    <style>
                button.primary, button.ghost{
            padding:12px 20px;
            border-radius: 15px;
            font-weight:700; cursor:pointer;
            transition: all .1s ease;
        }
        button.primary{
            background:var(--next); color:white; border:none; 
            box-shadow: 0 5px 0 0 #0288D1;
            opacity: 0.5;
            pointer-events: none;
        }
        button.primary.active{
            opacity: 1;
            pointer-events: auto;
        }
        button.primary.active:active{
            transform: translateY(5px);
            box-shadow: 0 0px 0 0 #0288D1;
        }
        button.ghost{
            background:#e0f7fa;
            border: 3px solid #00BCD4;
            color: #00BCD4;
            font-weight: 600;
        }
        
        .options-row{
            display:flex; 
            gap:20px; 
            flex-wrap:wrap; 
            justify-content:center
        }
        
        .opt{
            min-width:140px; 
            padding:20px; 
            border-radius: 20px;
            background:#fff;
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.1);
            display:flex;
            flex-direction:column;
            align-items:center;
            gap:10px; 
            cursor:pointer;
            border: 4px solid #E0E0E0;
            font-size: 1.1rem;
            font-weight: 600;
            transition: all .2s;
        }
        .opt:not(.disabled):hover{
            transform:translateY(-5px) scale(1.05);
            box-shadow: 0 12px 25px rgba(0, 0, 0, 0.15);
        }
        .opt.disabled{pointer-events: none; opacity: 0.7;}
        .opt.ok{border-color:var(--ok); box-shadow:0 8px 20px rgba(76,175,80,0.3); background:#E8F5E9;}
        .opt.bad{border-color:var(--bad); box-shadow:0 8px 20px rgba(229,57,53,0.3); background:#FFEBEE;}
        
        .feedback{ font-weight:800; font-size: 1.4rem; }

        .day-image-option img {
        width: 100px; 
        height: 100px;
        border-radius: 10px;
        object-fit: cover;
    }

    .matching-click-container {
        display: flex;
        flex-direction: column;
        gap: 15px;
        width: 100%;
        max-width: 600px;
        padding: 20px;
        background-color: var(--matching-bg, #8AC257); 
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }
    .matching-card {
        background-color: var(--matching-card-bg, #E7F6E1);
        border-radius: 12px;
        padding: 15px 20px;
        font-weight: 700;
        font-size: 1.2rem;
        cursor: pointer;
        transition: all 0.2s;
        box-shadow: 0 4px 0 0 rgba(0,0,0,0.1);
        border: 2px solid transparent;
        display: flex;
        justify-content: center;
        align-items: center;
    }
    .matching-card:hover:not(.matched):not(.selected) {
        transform: translateY(-2px);
        box-shadow: 0 6px 0 0 rgba(0,0,0,0.15);
    }
    .matching-card.selected {
        border-color: var(--select-highlight, #FF7043);
        box-shadow: 0 0 0 4px var(--select-highlight, #FF7043);
        background-color: #F8E3DD;
    }
    .matching-card.matched {
        background-color: var(--ok);
        color: white;
        pointer-events: none;
        cursor: default;
        box-shadow: none;
        border-color: var(--ok);
    }
    .matching-card.shaking {
        animation: shake 0.5s;
        animation-iteration-count: 2;
        border-color: var(--bad) !important;
        box-shadow: 0 0 0 4px var(--bad) !important;
        background-color: #FFEBEE !important;
        color: var(--bad);
    }
    @keyframes shake {
        0%, 100% {transform: translateX(0);}
        20%, 60% {transform: translateX(-5px);}
        40%, 80% {transform: translateX(5px);}
    }
    
    .questions-stack, .answers-stack {
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 10px;
        border-radius: 15px;
        background: rgba(255, 255, 255, 0.5);
    }
    .stack-title {
        font-weight: 800;
        font-size: 1.1rem;
        color: var(--text-color, #333);
        margin-bottom: 5px;
        text-align: left;
        padding-left: 10px;
    }
    
    @media (min-width: 601px) {
        .matching-click-container {
            flex-direction: row;
            justify-content: space-around;
        }
        .questions-stack, .answers-stack {
            flex-basis: 48%;
        }
    }
    </style>

</head>
<body>
    <div class="app" role="application" aria-label="Prototipo actividades para primaria">
        <header>
            <h1 id="title">Mini-Clase: Saludos Ch'ol</h1>
            <div style="display: flex; gap: 10px;">
                <button class="ghost" onclick="goHome()" style="font-weight: 500; padding: 10px;">🏠 Inicio</button>
                <button class="primary" id="nextBtn" onclick="next()">Siguiente</button>
            </div>
        </header>

        <main class="stage-area" id="stageArea"></main>

        <div class="controls" id="controlsArea">
            </div>

        <footer>Prototipo educativo · Tema 1: Saludos</footer>
    </div>

    <div class="ground-sim"></div>


<script>
    const MAIN_SCREEN_URL = '../U1/U1FAM.html'; 
    const USER_GOOGLE_ID = 'ID_DEL_USUARIO_AUTENTICADO'; 
    const TOTAL_ACTIVITY_POINTS = 30; 
    
    function goHome() {
        window.location.href = MAIN_SCREEN_URL;
    }

    const stages = [renderStage0, renderStage1, renderStage2, renderStage3, renderStage4];
    let currentStage = 0;
    let feedbackEl = null; 
    const titleEl = document.getElementById('title');
    const nextBtn = document.getElementById('nextBtn');
    const controlsArea = document.getElementById('controlsArea');
    
    let stageProgress = new Array(stages.length).fill(false); 
    let userScore = 0; 

    function setStageComplete(isComplete = true) {
        if (isComplete && !stageProgress[currentStage]) {
            if(currentStage >= 1 && currentStage <= 3) { 
                userScore += 10; 
            }
        }
        stageProgress[currentStage] = isComplete;
        nextBtn.classList.toggle('active', isComplete);
    }

    function clearFeedback(){ 
        if(feedbackEl) feedbackEl.textContent = ""; 
    }
    
    function setFeedback(text, kind){
        if(!feedbackEl) return;
        feedbackEl.textContent = text;
        if(kind === 'ok'){ feedbackEl.style.color = 'var(--ok)' }
        else if(kind === 'bad'){ feedbackEl.style.color = 'var(--bad)' }
        else { feedbackEl.style.color = 'var(--color-texto)' }
    }
    
    function disableOptions() {
        document.querySelectorAll('.opt').forEach(el => el.classList.add('disabled'));
    }

    function renderControls(html = '') {
        controlsArea.innerHTML = `<div id="feedback" class="feedback"></div>${html}`;
        feedbackEl = document.getElementById('feedback');
    }

    function next(){ 
        if (!stageProgress[currentStage]) {
            setFeedback("¡Termina esta parte antes de continuar!", 'bad');
            return;
        }

        if (currentStage === 4) {
             alert(`✅ Tema Terminado. Puntuación simulada: ${userScore}/${TOTAL_ACTIVITY_POINTS}. Volviendo a la pantalla principal...`);
             window.location.href = MAIN_SCREEN_URL; 
             return; 
        }

        currentStage++;
        if (currentStage >= stages.length) {
            currentStage = stages.length - 1; 
        }
        render(); 
    }

    function speakText(text, lang='es-ES'){
        if(!window.speechSynthesis) return;
        const u = new SpeechSynthesisUtterance(text);
        u.lang = lang;
        window.speechSynthesis.cancel();
        window.speechSynthesis.speak(u);
    }
    
    function render(){ 
        clearFeedback(); 
        setStageComplete(false);
        const container = document.getElementById('stageArea'); 
        container.innerHTML=''; 

        const titles = ['Mini-Clase: Saludos Ch\'ol', 'Actividad 1: Escucha y Selecciona', 'Actividad 2: Partes del Día', 'Actividad 3: Empareja la Palabra', '¡Tema Terminado!'];
        titleEl.textContent = titles[currentStage];

        stages[currentStage](container);
        
        if (currentStage === 0 || currentStage === 4) {
            setStageComplete(true);
        }
    }


    function playAudio(audioFilename, text, lang = 'cho') {
        const audioUrl = `../assets/audio/${audioFilename}`; 
        
        const audio = new Audio(audioUrl);
        
        audio.play()
            .then(() => {
                setFeedback(`🔊 Reproduciendo: "${text}"`, 'neutral');
            })
            .catch(e => {
                console.error(`❌ Error al cargar o reproducir "${audioUrl}": ${e.message}`);
                speakText(text, lang); 
                setFeedback(`[TTS] No se encontró el audio real. Reproduciendo: "${text}"`, 'neutral');
            });
    }

    function createAudioButton(text, audioFilename, lang = 'cho') {
        const btn = document.createElement('button');
        btn.className = 'ghost';
        btn.innerHTML = '🔊 Reproducir Audio';
        btn.onclick = () => { playAudio(audioFilename, text, lang); };
        return btn;
    }

    function renderStage0(container){
        const videoHtml = `
            <div class="video-wrapper">
                <iframe src="https://www.youtube.com/embed/z4fR0S2T-R0?rel=0" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
            </div>
            <p style="text-align:center; max-width: 600px; margin-top: 20px;">
                ¡Mira el video para aprender los saludos básicos en Ch'ol! Luego, presiona **Siguiente** para comenzar las actividades.
            </p>
        `;
        container.innerHTML = videoHtml;
        setStageComplete(true);
        renderControls();
    }

    const stage1Data = [
        { audio: "Adiós", filename: "adios_incolectivo.mp3", correct: "Adiós", options: ["Adiós", "Bueno", "Pasale", "Ven"] },
        { audio: "Bueno", filename: "bueno.mp3", correct: "Bueno", options: ["Bueno", "Voy llegando", "Mañana", "Adiós"] },
        { audio: "Voy llegando", filename: "buenas_hay_vengo_voy_llegando.mp3", correct: "Voy llegando", options: ["Voy llegando", "Tarde", "Noche", "Ven"] },
        { audio: "Pasale", filename: "pasale_ven.mp3", correct: "Pasale", options: ["Pasale", "Voy llegando", "Mañana", "Adiós"] },
        { audio: "Ven", filename: "pasale_ven.mp3", correct: "Ven", options: ["Ven", "Bueno", "Pasale", "Adiós"] },
        { audio: "Ahí vengo", filename: "buenas_hay_vengo_voy_llegando.mp3", correct: "Ahí vengo", options: ["Ahí vengo", "Voy llegando", "Mañana", "Bueno"] },

    ];
    let currentRound1 = 0; 

    function checkAnswer1(selectedOption, currentData, allOptionsElements) {
        if (selectedOption === currentData.correct) {
            setFeedback('¡Muy bien! ¡Correcto!', 'ok');
            currentRound1++;
            setTimeout(() => {
                renderStage1(document.getElementById('stageArea'));
            }, 1200);
        } else {
            setFeedback('Incorrecto. ¡La respuesta correcta es: ' + currentData.correct + '!', 'bad');
            allOptionsElements.forEach(el => {
                if (el.textContent === currentData.correct) {
                    el.classList.add('ok');
                }
            });
            currentRound1++;
            setTimeout(() => {
                renderStage1(document.getElementById('stageArea'));
            }, 2500);
        }
    }

    function renderStage1(container) {
        if (currentRound1 >= stage1Data.length) {
            container.innerHTML = `<h2 style="color: var(--ok);">¡Felicidades! Completaste las 6 rondas.</h2>`;
            setStageComplete(true);
            renderControls();
            return;
        }
        const currentData = stage1Data[currentRound1];
        container.innerHTML = `<p class="stage0-info">Ronda ${currentRound1 + 1} de ${stage1Data.length}: Escucha el audio y selecciona la **traducción** correcta.</p>`;

        const audioBtn = createAudioButton(currentData.audio, currentData.filename, 'cho'); 
        
        renderControls();
        
        const buttonWrapper = document.createElement('div');
        buttonWrapper.style.cssText = "display: flex; gap: 15px; justify-content: center; margin-bottom: 20px;";
        buttonWrapper.appendChild(audioBtn);

        const feedbackEl = document.getElementById('feedback');
        if (controlsArea) {
            controlsArea.insertBefore(buttonWrapper, feedbackEl.nextSibling); 
        }

        const row = document.createElement('div');
        row.className = 'options-row';
        currentData.options.sort(() => Math.random() - 0.5); 

        currentData.options.forEach(opt => {
            const b = document.createElement('div');
            b.className = 'opt';
            b.textContent = opt;
            
            b.onclick = (e) => {
                const allOptions = document.querySelectorAll('.opt');
                disableOptions(); 
                
                if (opt === currentData.correct) {
                    b.classList.add('ok');
                } else {
                    b.classList.add('bad');
                }
                
                checkAnswer1(opt, currentData, allOptions);
            };
            row.appendChild(b);
        });

        container.appendChild(row);
        setStageComplete(false); 
    }

    const stage2Questions = [
        { audio: "Mañana", filename: "manana.mp3", correct: "escenario_dia.jpg", word: "Día" },
        { audio: "Tarde", filename: "tarde.mp3", correct: "escenario_tarde.jpg", word: "Tarde" }, 
        { audio: "Noche", filename: "noche.mp3", correct: "escenario_noche.jpg", word: "Noche" },
    ];
    let currentRound2 = 0; 

    const stage2AllOptions = [
        { filename: "escenario_dia.jpg", word: "Día" },
        { filename: "escenario_tarde.jpg", word: "Tarde" },
        { filename: "escenario_noche.jpg", word: "Noche" },
        { filename: "rio.png", word: "rio" }, 
        { filename: "escenario_selva.jpg", word: "Nublado" }
    ];

    function checkAnswer2(selectedImage, currentData, allOptionsElements) {
        if (selectedImage === currentData.correct) {
            setFeedback(`¡Correcto! Es la ${currentData.word}.`, 'ok');
            currentRound2++;
            setTimeout(() => {
                renderStage2(document.getElementById('stageArea'));
            }, 1200);
        } else {
            setFeedback('Incorrecto. ¡La figura correcta representa ' + currentData.word + '!', 'bad');
            allOptionsElements.forEach(el => {
                if (el.dataset.img === currentData.correct) {
                    el.classList.add('ok');
                }
            });
            currentRound2++;
            setTimeout(() => {
                renderStage2(document.getElementById('stageArea'));
            }, 2500);
        }
    }
    
    function renderStage2(container) {
        if (currentRound2 >= stage2Questions.length) {
            container.innerHTML = `<h2 style="color: var(--ok);">¡Genial! Terminaste las 3 rondas del día.</h2>`;
            setStageComplete(true);
            renderControls();
            return; 
        }

        const currentData = stage2Questions[currentRound2];
        container.innerHTML = `<p class="stage0-info">Ronda ${currentRound2 + 1} de 3. Escucha el saludo y selecciona la figura que representa: **${currentData.word}**.</p>`;
        
        const audioBtn = createAudioButton(currentData.audio, currentData.filename, 'cho');
        
        renderControls();

        const buttonWrapper = document.createElement('div');
        buttonWrapper.style.cssText = "display: flex; gap: 15px; justify-content: center; margin-bottom: 20px;";
        buttonWrapper.appendChild(audioBtn);

        const feedbackEl = document.getElementById('feedback');
        if (controlsArea) {
            controlsArea.insertBefore(buttonWrapper, feedbackEl.nextSibling); 
        }

        const row = document.createElement('div');
        row.className = 'options-row';
        
        stage2AllOptions.sort(() => Math.random() - 0.5);

        stage2AllOptions.forEach(it => {
            const b = document.createElement('div');
            b.className = 'opt day-image-option'; 
            b.dataset.img = it.filename;
            
            b.innerHTML = `<img src="../assets/img/${it.filename}" alt="${it.word}"/>`;
            
            b.onclick = ()=>{
                const allOptions = document.querySelectorAll('.opt');
                disableOptions();
                
                if (it.filename === currentData.correct) {
                    b.classList.add('ok');
                } else {
                    b.classList.add('bad');
                }
                
                checkAnswer2(it.filename, currentData, allOptions); 
            };
            row.appendChild(b);
        });

        container.appendChild(row);
        setStageComplete(false);
    }
    
    const stage3Data = [
        { ch: 'Bäktye’', es: 'Buenos días' },
        { ch: 'Mältye’', es: 'Buenas tardes' },
        { ch: 'Ac’äntyel', es: 'Buenas noches (al llegar)' },
        { ch: 'C’otäyel', es: 'Buenas noches (al irse)' },
        { ch: 'Täle c’ajk', es: 'Hola' },
    ];

    let selectedQuestion = null;
    let matchedPairsCount = 0;

    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    function handleQuestionClick(cardEl, question) {
        if (cardEl.classList.contains('selected')) {
            cardEl.classList.remove('selected');
            selectedQuestion = null;
            setFeedback('Selecciona un saludo en Ch\'ol y luego su significado en español.', 'neutral');
            return;
        }

        document.querySelectorAll('.questions-stack .matching-card.selected').forEach(el => {
            el.classList.remove('selected');
        });

        cardEl.classList.add('selected');
        selectedQuestion = question;
        setFeedback(`Seleccionaste **${question.ch}**. ¡Ahora elige su traducción!`, 'neutral');
    }

    function handleAnswerClick(cardEl, answer) {
        if (!selectedQuestion) {
            setFeedback('Selecciona primero una palabra Ch\'ol de la columna izquierda.', 'bad');
            cardEl.classList.add('shaking');
            setTimeout(() => cardEl.classList.remove('shaking'), 500);
            return;
        }

        const questionCardEl = document.querySelector(`.questions-stack .matching-card[data-chol="${selectedQuestion.ch}"]`);

        if (selectedQuestion.es === answer.es) {
            setFeedback('¡Emparejamiento Correcto!', 'ok');
            
            cardEl.classList.add('matched');
            questionCardEl.classList.add('matched');
            cardEl.classList.remove('shaking'); 
            questionCardEl.classList.remove('shaking', 'selected');

            selectedQuestion = null;
            
            matchedPairsCount++;

            if (matchedPairsCount === stage3Data.length) {
                setFeedback('¡Actividad 3 Completada! Todo es correcto.', 'ok');
                setStageComplete(true);
            }

        } else {
            setFeedback('Incorrecto. Intenta de nuevo.', 'bad');

            cardEl.classList.add('shaking');
            questionCardEl.classList.add('shaking');
            
            setTimeout(() => {
                cardEl.classList.remove('shaking');
                questionCardEl.classList.remove('shaking');
            }, 500);
        }
    }

    function renderStage3(container) {
        renderControls();
        matchedPairsCount = 0;
        selectedQuestion = null;

        const questions = stage3Data.map(d => ({ ch: d.ch, es: d.es }));
        const answers = stage3Data.map(d => ({ ch: d.ch, es: d.es }));
        
        shuffleArray(questions);
        shuffleArray(answers);

        container.innerHTML = `<p class="stage0-info">Haz clic en el **Saludo en Ch'ol** (Izquierda) y luego en su **Traducción en Español** (Derecha) para formar el par.</p>`;

        const matchingContainer = document.createElement('div');
        matchingContainer.className = 'matching-click-container';

        const questionsStack = document.createElement('div');
        questionsStack.className = 'questions-stack';
        questionsStack.innerHTML = `<p class="stack-title">Ch'ol:</p>`;
        
        questions.forEach(q => {
            const cardEl = document.createElement('div');
            cardEl.className = 'matching-card';
            cardEl.textContent = q.ch;
            cardEl.dataset.chol = q.ch; 
            cardEl.dataset.es = q.es;
            cardEl.onclick = () => handleQuestionClick(cardEl, q);
            questionsStack.appendChild(cardEl);
        });

        const answersStack = document.createElement('div');
        answersStack.className = 'answers-stack';
        answersStack.innerHTML = `<p class="stack-title">Español:</p>`;

        answers.forEach(a => {
            const cardEl = document.createElement('div');
            cardEl.className = 'matching-card';
            cardEl.textContent = a.es;
            cardEl.dataset.es = a.es; 
            cardEl.onclick = () => handleAnswerClick(cardEl, a);
            answersStack.appendChild(cardEl);
        });

        matchingContainer.appendChild(questionsStack);
        matchingContainer.appendChild(answersStack);
        container.appendChild(matchingContainer);
        
        setFeedback('Selecciona un saludo en Ch\'ol y luego su significado en español.', 'neutral');
        setStageComplete(false);
    }
    
    function renderStage4(container) {
        container.innerHTML = `
            <div style="text-align: center; padding: 40px; border: 5px dashed var(--ok); border-radius: 20px;">
                <h2 style="color: var(--ok); font-size: 2.5rem;">🎉 ¡Tema 1 Completado! 🎉</h2>
                <p style="font-size: 1.2rem;">Puntuación simulada: **${userScore}/${TOTAL_ACTIVITY_POINTS}**</p>
                <p>Presiona **Siguiente** para volver a la pantalla principal.</p>
            </div>
        `;
        setStageComplete(true);
        renderControls();
    }


    document.addEventListener('DOMContentLoaded', () => {
        render();
    });
</script>
</body>
</html>
