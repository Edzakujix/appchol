<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Ch'ol App - Tema 3: Familia</title>

        <link rel="stylesheet" href="../assets/css/styles.css">

</head>
<body>
    <div class="app" role="application" aria-label="Prototipo actividades para primaria">
        <header>
            <h1 id="title">Mini-Clase: Familia</h1>
            <div style="display: flex; gap: 10px;">
                <button class="ghost" onclick="goHome()" style="font-weight: 500; padding: 10px;">🏠 Inicio</button> 
                <button class="primary" id="nextBtn" onclick="next()">Siguiente</button>
            </div>
        </header>

        <main class="stage-area" id="stageArea"></main>

        <div class="controls" id="controlsArea">
             </div>

        <footer>Prototipo educativo · Tema 3: Familia</footer>
    </div>
    
    <div class="ground-sim"></div>


<script>
    // ************************************************************************
    // CONFIGURACIÓN DE LA PANTALLA PRINCIPAL
    const MAIN_SCREEN_URL = '../U1/U1FAM.html'; // MANTENEMOS: pantalla1.html
    // ************************************************************************
    
    // Función de redirección para el botón de Inicio
    function goHome() {
        window.location.href = MAIN_SCREEN_URL;
    }

    // VARIABLES CRÍTICAS
    const stages = [renderStage0, renderStage1, renderStage2, renderStage3_word_builder, renderStage4_matching, renderStage5_final]; 
    let currentStage = 0;
    let feedbackEl = null; 
    const titleEl = document.getElementById('title');
    const nextBtn = document.getElementById('nextBtn');
    const controlsArea = document.getElementById('controlsArea');
    
    // Variables de Progreso (Solo se usa la estructura, los valores no son visibles)
    let stageProgress = new Array(stages.length).fill(false); 
    let userScore = 0;
    const TOTAL_ACTIVITY_POINTS = 40; 

    // Funciones de Control de Etapa y Puntuación
    function setStageComplete(isComplete = true) {
        if (isComplete && !stageProgress[currentStage]) {
            // Se mantiene la lógica de puntuación, aunque no se usa visiblemente.
             if(currentStage >= 1 && currentStage <= 4) { 
                 userScore += 10; 
             }
        }
        stageProgress[currentStage] = isComplete;
        nextBtn.classList.toggle('active', isComplete);
    }

    function clearFeedback(){ 
        if(feedbackEl) feedbackEl.textContent = ""; 
    }
    
    function setFeedback(text, kind){
        if(!feedbackEl) return;
        feedbackEl.textContent = text;
        if(kind === 'ok'){ feedbackEl.style.color = 'var(--ok)' }
        else if(kind === 'bad'){ feedbackEl.style.color = 'var(--bad)' }
        else { feedbackEl.style.color = 'var(--text-color)' }
    }

    function renderControls(html = '') {
        controlsArea.innerHTML = `<div id="feedback" class="feedback"></div>${html}`;
        // Inicialización de feedbackEl
        feedbackEl = document.getElementById('feedback');
    }

    function next(){ 
        if (!stageProgress[currentStage]) {
            setFeedback("¡Termina esta parte antes de continuar!", 'bad');
            return;
        }

        if (currentStage === 5) {
            // COMENTARIO: Redirección final.
            alert(`Tema Terminado. Volviendo a la pantalla principal...`);
            window.location.href = MAIN_SCREEN_URL; 
            return; 
        }

        currentStage++;
        if (currentStage >= stages.length) {
            currentStage = stages.length - 1; 
        }
        render(); 
    }

    function speakText(text, lang='es-ES'){
        if(!window.speechSynthesis) return;
        const u = new SpeechSynthesisUtterance(text);
        u.lang = lang;
        window.speechSynthesis.cancel();
        window.speechSynthesis.speak(u);
    }
    
    // COMENTARIO: FUNCIÓN DE AUDIO MEJORADA (Manejo de Promise para diagnóstico)
    function playAudio(audioFilename, text, lang = 'cho') {
        // COMENTARIO: Se corrige la ruta a la ruta relativa correcta (../assets/audio)
        // ASUMIENDO que este archivo está dentro de una carpeta de tema (Ej: U3/T3.html)
        const audioUrl = `../assets/audio/${audioFilename}`; 
        
        const audio = new Audio(audioUrl);
        
        audio.play()
            .then(() => {
                setFeedback(`🔊 Reproduciendo: "${text}"`, 'neutral');
            })
            .catch(e => {
                // COMENTARIO: Si el archivo no carga (404 o formato), este error aparecerá en la Consola.
                console.error(`❌ Error al cargar o reproducir "${audioUrl}": ${e.message}`);
                speakText(text, lang); 
                setFeedback(`[TTS] No se encontró el audio real. Reproduciendo: "${text}"`, 'neutral');
            });
    }

    // COMENTARIO: createAudioButton se coloca en el ámbito global (aquí) para evitar ReferenceError.
    function createAudioButton(text, audioFilename, lang = 'cho') {
        const btn = document.createElement('button');
        btn.className = 'ghost';
        btn.innerHTML = '🔊 Reproducir Audio';
        // COMENTARIO: El evento onclick se adjunta al objeto DOM.
        btn.onclick = () => { playAudio(audioFilename, text, lang); };
        return btn;
    }

    function render(){ 
        clearFeedback(); 
        setStageComplete(false);
        const container = document.getElementById('stageArea'); 
        container.innerHTML=''; 

        const titles = [
            'Mini-Clase: La Familia', 
            'Actividad 1: Escucha y Selecciona (Miembro)', 
            'Actividad 2: Lee y Selecciona (Frase)', 
            'Actividad 3: Forma la Palabra (Construcción)',
            'Actividad 4: Unir Preguntas y Respuestas',
            '¡Tema Terminado!' 
        ];
        titleEl.textContent = titles[currentStage];

        stages[currentStage](container);
        
        if (currentStage === 0 || currentStage === 5) { 
            setStageComplete(true);
        }
    }


    // =======================================================================
    // 0 - MINI-CLASE (VIDEO) - AHORA RESPONSIVO
    // =======================================================================
    function renderStage0(container){
        const videoHtml = `
            <div class="video-wrapper">
                <iframe src="https://www.youtube.com/embed/g3d1K4z5q6c?rel=0" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
            </div>
            <p style="text-align:center; max-width: 600px; margin-top: 20px;">
                ¡Mira el video para aprender sobre la familia en Ch'ol! Presiona **Siguiente** para empezar.
            </p>
        `;
        container.innerHTML = videoHtml;
        setStageComplete(true);
        renderControls();
    }

    // =======================================================================
    // 1 - ACTIVIDAD 1: SELECCIONAR MIEMBRO (5 rondas - Audio a Imagen)
    // =======================================================================
    const stage1Data = [
        // COMENTARIO: NOMBRES DE AUDIO ESTANDARIZADOS A MINÚSCULAS (ej: "nana.mp3")
        { audio: "Nana' ", filename: "nana.mp3", correct: "mama.png", options: ["mama.png", "hermano.png", "abuelo.png"] },
        { audio: "Tat", filename: "tat.mp3", correct: "papa.png", options: ["papa.png", "tia.png", "primo.png"] },
        { audio: "Wäy", filename: "way.mp3", correct: "hermano.png", options: ["papa.png", "hermano.png", "mama.png"] },
        { audio: "Ch'uch'", filename: "chuch.mp3", correct: "abuela.png", options: ["abuela.png", "abuelo.png", "tio.png"] },
        { audio: "Mam", filename: "mam.mp3", correct: "abuelo.png", options: ["hermano.png", "abuelo.png", "tia.png"] },
    ];
    let currentRound1 = 0; 

    function checkAnswer1(selectedImage, currentData, allOptionsElements) {
        if (selectedImage === currentData.correct) {
            setFeedback('¡Muy bien! ¡Correcto!', 'ok');
            currentRound1++;
            setTimeout(() => {
                renderStage1(document.getElementById('stageArea'));
            }, 1200);
        } else {
            setFeedback('Incorrecto. ¡La imagen correcta es: ' + currentData.correct + '!', 'bad');
            allOptionsElements.forEach(el => {
                if (el.dataset.img === currentData.correct) {
                    el.classList.add('ok');
                }
            });
            currentRound1++;
            setTimeout(() => {
                renderStage1(document.getElementById('stageArea'));
            }, 2500);
        }
    }

    function renderStage1(container) {
        if (currentRound1 >= stage1Data.length) {
            container.innerHTML = `<h2 style="color: var(--ok);">¡Felicidades! Completaste las 5 rondas.</h2>`;
            setStageComplete(true);
            renderControls();
            return;
        }

        const currentData = stage1Data[currentRound1];
        container.innerHTML = `<p class="stage0-info">Ronda ${currentRound1 + 1} de ${stage1Data.length}: Escucha el audio y selecciona la imagen del miembro de la familia.</p>`;

        // 1. Crear el botón como objeto DOM
        const audioBtn = createAudioButton(currentData.audio, currentData.filename, 'cho'); 
        
        // 2. Inicializar el controlsArea (solo con el feedback)
        renderControls();

        // 3. Crear contenedor de centrado para el botón
        const buttonWrapper = document.createElement('div');
        buttonWrapper.style.cssText = "display: flex; gap: 15px; justify-content: center; margin-bottom: 20px;";
        buttonWrapper.appendChild(audioBtn);

        // COMENTARIO: CORRECCIÓN DE DOM. Se inserta el objeto DOM (buttonWrapper) directamente en controlsArea, 
        // eliminando el uso de outerHTML para mantener el evento onclick.
        const feedbackEl = document.getElementById('feedback');
        if (controlsArea) {
            controlsArea.insertBefore(buttonWrapper, feedbackEl.nextSibling); 
        }
        
        const row = document.createElement('div');
        row.className = 'options-row';
        currentData.options.sort(() => Math.random() - 0.5); 

        currentData.options.forEach(opt => {
            const b = document.createElement('div');
            b.className = 'opt';
            b.dataset.img = opt; 
            
            // COMENTARIO: Se corrige la ruta de la imagen para usar la ruta relativa (../assets/img)
            // ASUMIENDO que la carpeta assets está un nivel arriba.
            b.innerHTML = `<img src="../assets/img/${opt}" alt="Opción" style="width: 100px; height: 100px; border-radius: 10px;"/>`;

            b.onclick = (e) => {
                const allOptions = document.querySelectorAll('.opt');
                allOptions.forEach(el => el.classList.add('disabled'));
                
                if (opt === currentData.correct) {
                    b.classList.add('ok');
                } else {
                    b.classList.add('bad');
                }
                
                checkAnswer1(opt, currentData, allOptions);
            };
            row.appendChild(b);
        });

        container.appendChild(row);
        setStageComplete(false); 
    }

    // =======================================================================
    // 2 - ACTIVIDAD 2: LEE Y SELECCIONA (5 rondas - Frase a Imagen)
    // =======================================================================
    const stage2Data = [
        // COMENTARIO: NOMBRES DE IMAGEN ESTANDARIZADOS (si aplica)
        { phrase: "Mi papá es alto.", correct: "papa.png", options: ["papa.png", "mama.png", "nino.png"] },
        { phrase: "Tengo un hermano mayor.", correct: "hermano_mayor.png", options: ["hermano_mayor.png", "hermana_menor.png", "primo_amigo.png"] },
        { phrase: "Mi abuela cocina.", correct: "abuela_cocinando.png", options: ["abuela_cocinando.png", "abuelo_leyendo.png", "nino_jugando.png"] },
        { phrase: "Mi familia vive aquí.", correct: "familia_casa.png", options: ["familia_casa.png", "amigos_parque.png", "animales_granja.png"] },
        { phrase: "Mi mamá me quiere.", correct: "mama_abrazando.png", options: ["mama_abrazando.png", "papa_leyendo.png", "abuela_dormida.png"] },
    ];
    let currentRound2 = 0;

    function checkAnswer2(selectedImage, currentData, allOptionsElements) {
        if (selectedImage === currentData.correct) {
            setFeedback('¡Muy bien! ¡Correcto!', 'ok');
            currentRound2++;
            setTimeout(() => {
                renderStage2(document.getElementById('stageArea'));
            }, 1200);
        } else {
            setFeedback('Incorrecto. ¡La imagen correcta es: ' + currentData.correct + '!', 'bad');
            allOptionsElements.forEach(el => {
                if (el.dataset.img === currentData.correct) {
                    el.classList.add('ok');
                }
            });
            currentRound2++;
            setTimeout(() => {
                renderStage2(document.getElementById('stageArea'));
            }, 2500);
        }
    }

    function renderStage2(container) {
        if (currentRound2 >= stage2Data.length) {
            container.innerHTML = `<h2 style="color: var(--ok);">¡Felicidades! Completaste las 5 rondas.</h2>`;
            setStageComplete(true);
            renderControls();
            return;
        }

        const currentData = stage2Data[currentRound2];
        container.innerHTML = `
            <p class="stage0-info">Ronda ${currentRound2 + 1} de ${stage2Data.length}: Lee la frase y selecciona la imagen que la representa.</p>
            <div style="font-size: 1.5rem; font-weight: bold; color: var(--text-color); margin-bottom: 20px;">
                "${currentData.phrase}"
            </div>
        `;
        
        renderControls(); 
        
        const row = document.createElement('div');
        row.className = 'options-row';
        currentData.options.sort(() => Math.random() - 0.5); 

        currentData.options.forEach(opt => {
            const b = document.createElement('div');
            b.className = 'opt';
            b.dataset.img = opt; 
            
            // COMENTARIO: Se corrige la ruta de la imagen
            b.innerHTML = `<img src="../assets/img/${opt}" alt="Opción" style="width: 120px; height: 120px; border-radius: 10px;"/>`;

            b.onclick = (e) => {
                const allOptions = document.querySelectorAll('.opt');
                allOptions.forEach(el => el.classList.add('disabled'));
                
                if (opt === currentData.correct) {
                    b.classList.add('ok');
                } else {
                    b.classList.add('bad');
                }
                
                checkAnswer2(opt, currentData, allOptions);
            };
            row.appendChild(b);
        });

        container.appendChild(row);
        setStageComplete(false); 
    }

    // =======================================================================
    // 3 - ACTIVIDAD 3: FORMAR LA PALABRA (5 rondas - Construcción de Letras)
    // =======================================================================
    const stage3Data = [
        // COMENTARIO: NOMBRES DE IMAGEN ESTANDARIZADOS (si aplica)
        { word: "ABUELO", image: "abuelo.png", letters: "KOCLAPBZUNE" },
        { word: "MAMA", image: "mama.png", letters: "OMSMSAEA" }, 
        { word: "HIJO", image: "nino.png", letters: "HIFJGOE" }, 
        { word: "PRIMA", image: "nina.png", letters: "PRXIMAY" }, 
        { word: "TIA", image: "tia.png", letters: "TPITAZO" },
    ];
    let currentRound3 = 0;
    let currentAttempt3 = ""; 

    function checkBuilderComplete(correctWord, container) {
        if (currentAttempt3 === correctWord) {
            setFeedback('¡Palabra Correcta!', 'ok');
            currentRound3++;
            
            document.querySelectorAll('.letter-button').forEach(el => el.classList.add('disabled'));

            setTimeout(() => {
                currentAttempt3 = ""; 
                renderStage3_word_builder(container);
            }, 1500);
        } else if (currentAttempt3.length === correctWord.length) {
            setFeedback('Incorrecto. Intenta de nuevo.', 'bad');
            
            setTimeout(() => {
                currentAttempt3 = ""; 
                renderStage3_word_builder(container); 
            }, 1000);
        }
    }

    function handleLetterClick(letter, correctWord, container) {
        const letterButtons = document.querySelectorAll('.letter-button');
        let clickedButton = null;
        
        // Encontrar el botón que fue clickeado para deshabilitarlo (solo si no está ya deshabilitado)
        // Se busca el primer botón con ese contenido que no esté deshabilitado.
        for(const btn of letterButtons) {
            if (btn.textContent === letter && !btn.classList.contains('disabled')) {
                clickedButton = btn;
                break;
            }
        }

        if (currentAttempt3.length < correctWord.length && clickedButton) {
            currentAttempt3 += letter;
            document.getElementById('currentWord').textContent = currentAttempt3;
            
            clickedButton.classList.add('disabled'); 
            
            if (currentAttempt3.length === correctWord.length) {
                checkBuilderComplete(correctWord, container);
            }
        }
    }

    function renderStage3_word_builder(container) {
        if (currentRound3 >= stage3Data.length) {
            container.innerHTML = `<h2 style="color: var(--ok);">¡Felicidades! Formaste ${stage3Data.length} palabras.</h2>`;
            setStageComplete(true);
            renderControls();
            return;
        }

        const currentData = stage3Data[currentRound3];
        currentAttempt3 = ""; // Aseguramos que la palabra se reinicie
        
        container.innerHTML = `
            <p class="stage0-info">Ronda ${currentRound3 + 1} de ${stage3Data.length}: Forma la palabra **"${currentData.word}"**.</p>
            <img src="../assets/img/${currentData.image}" alt="Palabra a formar" style="width: 150px; height: 150px; border-radius: 10px; margin-bottom: 20px; border: 3px solid var(--accent);"/>
            
            <div style="text-align: center; width: 100%;">
                <div class="word-to-build-display">Palabra Objetivo: ${currentData.word}</div>
                <div id="currentWord" class="current-word-display"></div>
            </div>
            
            <div id="letterTray" class="letter-tray options-row">
                 </div>
        `;
        
        renderControls();
        
        const letterTray = document.getElementById('letterTray');
        const letterArray = currentData.letters.split('');
        
        letterArray.sort(() => Math.random() - 0.5); 
        
        letterArray.forEach(letter => {
            const btn = document.createElement('button');
            btn.className = 'letter-button';
            btn.textContent = letter;
            btn.onclick = (e) => handleLetterClick(letter, currentData.word, container); 
            letterTray.appendChild(btn);
        });
        
        setStageComplete(false); 
    }

    // =======================================================================
    // 4 - ACTIVIDAD 4: UNIR PREGUNTAS/RESPUESTAS (7 pares) - Matching
    // =======================================================================
    // El HTML y CSS para esta sección usa el patrón de arrastrar/soltar de Códigos anteriores
    
    const stage4Pairs = [
        ['¿Quién es tu mamá?', 'Mi mamá es Nana\''], 
        ['¿Dónde vive tu familia?', 'Vive en casa.'],
        ['¿Es tu papá fuerte?', 'Sí, es muy fuerte.'],
        ['¿Tienes hermanos?', 'Sí, tengo 3.'],
        ['¿Qué hace tu abuela?', 'Ella cocina la comida.'],
        ['¿Qué hace tu hermano?', 'Él juega con la pelota.'],
        ['¿Cómo se llama tu tío?', 'Se llama Pedro.'],
    ];

    function checkAllMatches4() {
        const dropzones = document.querySelectorAll('.answer-dropzone');
        let allCorrect = true;
        const questionsList = document.getElementById('questionsList');

        dropzones.forEach(dz => {
            dz.classList.remove('ok', 'bad'); 
            const droppedCard = dz.querySelector('.question-card');
            const answerText = dz.dataset.answer;
            
            if (droppedCard) {
                const questionText = droppedCard.dataset.question;
                const correctPair = stage4Pairs.find(p => p[0] === questionText);
                
                if (correctPair && correctPair[1] === answerText) {
                    dz.classList.add('ok');
                    droppedCard.classList.add('matched-correct'); 
                } else {
                    dz.classList.add('bad');
                    allCorrect = false;
                    
                    // COMENTARIO: Devolver la tarjeta a la columna de preguntas si es incorrecta
                    droppedCard.classList.remove('matched-correct', 'dragging');
                    questionsList.appendChild(droppedCard); 
                    
                    dz.classList.remove('filled');
                    const placeholder = dz.querySelector('.placeholder-text');
                    if (placeholder) placeholder.style.display = 'block';
                }
            } else {
                dz.classList.add('bad'); 
                allCorrect = false;
            }
        });

        if (allCorrect) {
            setFeedback('¡Felicidades! Todos los pares son correctos.', 'ok');
            setStageComplete(true);
            document.querySelectorAll('.question-card').forEach(card => {
                card.draggable = false;
                card.classList.add('matched-correct'); 
            });
            controlsArea.querySelector('button.ghost').style.pointerEvents = 'none';
        } else {
            setFeedback('¡Revisa los rojos! Las tarjetas incorrectas regresaron para que intentes de nuevo.', 'bad');
            // Se elimina la llamada a speakText para no interrumpir el flujo del usuario
        }
    }


    function renderStage4_matching(container){
        container.innerHTML = `<p class="stage0-info">Arrastra cada **pregunta** (amarillo) a su **respuesta** correcta (azul).</p>`;
        
        renderControls(`<button class="ghost" onclick="checkAllMatches4()">Comprobar Mis Respuestas</button>`);
        
        const matchingContainer = document.createElement('div');
        matchingContainer.className = 'matching-container';
        
        const questionsCol = document.createElement('div');
        questionsCol.className = 'matching-column';
        questionsCol.innerHTML = '<h3>Preguntas</h3><div id="questionsList" class="questions-list"></div>';

        const answersCol = document.createElement('div');
        answersCol.className = 'matching-column';
        answersCol.innerHTML = '<h3>Respuestas</h3><div id="answersList"></div>';
        
        const shuffledQuestions = [...stage4Pairs].sort(() => Math.random() - 0.5);
        const shuffledAnswers = [...stage4Pairs].map(p=>p[1]).sort(() => Math.random() - 0.5);

        // Crear tarjetas de preguntas (arrastrables)
        const questionsList = questionsCol.querySelector('#questionsList');
        shuffledQuestions.forEach((pair, index) => {
            const questionCard = document.createElement('div');
            questionCard.className = 'question-card';
            questionCard.id = `q-card-${index}`;
            questionCard.draggable = true;
            questionCard.dataset.question = pair[0]; 
            questionCard.textContent = pair[0];

            questionCard.addEventListener('dragstart', (e) => {
                e.dataTransfer.setData('text/plain', e.target.id);
                e.target.classList.add('dragging');
            });
            questionCard.addEventListener('dragend', (e) => {
                e.target.classList.remove('dragging');
            });
            questionsList.appendChild(questionCard);
        });

        // Crear zonas de respuesta (dropzones)
        const answersList = answersCol.querySelector('#answersList');
        shuffledAnswers.forEach((answer, index) => {
            const dropzone = document.createElement('div');
            dropzone.className = 'answer-dropzone';
            dropzone.id = `ans-dropzone-${index}`;
            dropzone.dataset.answer = answer; 

            const placeholder = document.createElement('span');
            placeholder.className = 'placeholder-text';
            placeholder.textContent = answer; 
            dropzone.appendChild(placeholder);


            dropzone.addEventListener('dragover', (e) => {
                e.preventDefault(); 
                dropzone.classList.add('hovered');
            });
            dropzone.addEventListener('dragleave', () => {
                dropzone.classList.remove('hovered');
            });
            dropzone.addEventListener('drop', (e) => {
                e.preventDefault();
                dropzone.classList.remove('hovered');

                const cardId = e.dataTransfer.getData('text/plain');
                const draggedCard = document.getElementById(cardId);
                
                // Si ya hay una tarjeta en este dropzone, devolverla a la lista original
                if (dropzone.children.length > 0 && dropzone.children[0].classList.contains('question-card')) {
                    questionsList.appendChild(dropzone.children[0]);
                    dropzone.classList.remove('filled');
                    dropzone.querySelector('.placeholder-text').style.display = 'block'; 
                }
                
                // Mover la nueva tarjeta al dropzone
                dropzone.appendChild(draggedCard);
                dropzone.classList.add('filled');
                dropzone.querySelector('.placeholder-text').style.display = 'none'; 

                dropzone.classList.remove('ok', 'bad');
                setStageComplete(false); 
            });
            answersList.appendChild(dropzone);
        });

        matchingContainer.appendChild(questionsCol);
        matchingContainer.appendChild(answersCol);
        container.appendChild(matchingContainer);
        setStageComplete(false);
    }
    
    // =======================================================================
    // 5 - FINAL DE TEMA (Stage 5)
    // =======================================================================
    function renderStage5_final(container) {
        container.innerHTML = `
            <div style="text-align: center; padding: 40px; border: 5px dashed var(--ok); border-radius: 20px;">
                <h2 style="color: var(--ok); font-size: 2.5rem;">🎉 ¡Tema 3 Completado! 🎉</h2>
                <p style="font-size: 1.2rem;">¡Has terminado todas las actividades de Familia! ¡Excelente trabajo!</p>
                <p>Presiona **Siguiente** para volver a la pantalla principal.</p>
            </div>
        `;
        setStageComplete(true);
        renderControls();
    }


    // --- Inicialización ---
    document.addEventListener('DOMContentLoaded', () => {
        render();
    });
</script>
</body>
</html>
