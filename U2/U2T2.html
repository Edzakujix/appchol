<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Ch'ol App - Tema 2: Adjetivos</title>

        <link rel="stylesheet" href="../assets/css/styles.css">

</head>
<body>
    <div class="app" role="application" aria-label="Prototipo actividades para primaria">
        <header>
            <h1 id="title">M2 - Tema 2: Adjetivos</h1>
            <div style="display: flex; gap: 10px;">
                <button class="ghost" onclick="goHome()" style="font-weight: 500; padding: 10px;">🏠 Inicio</button>
                <button class="primary" id="nextBtn" onclick="next()">Siguiente</button>
            </div>
        </header>

        <main class="stage-area" id="stageArea"></main>

        <div class="controls" id="controlsArea">
             </div>

        <footer>Prototipo educativo · Módulo 2: Donde Vivo</footer>
    </div>
    
    <div class="ground-sim"></div>

<script>
    // ************************************************************************
    // CONFIGURACIÓN (RUTAS MÓDULO 2)
    const MAIN_SCREEN_URL = '../U2/U2DOVI.html'; // Sube de U2/ y va al mapa de módulos
    const USER_GOOGLE_ID = 'ID_DEL_USUARIO_AUTENTICADO';
    const TOTAL_ACTIVITY_POINTS = 30; // 3 actividades * 10 puntos 
    // ************************************************************************
    
    function goHome() { window.location.href = MAIN_SCREEN_URL; }

    // VARIABLES y FLUJO
    const stages = [renderStage0, renderStage1, renderStage2, renderStage3, renderStage4]; 
    let currentStage = 0;
    let feedbackEl = null; 
    const titleEl = document.getElementById('title');
    const nextBtn = document.getElementById('nextBtn');
    const controlsArea = document.getElementById('controlsArea');
    let stageProgress = new Array(stages.length).fill(false); 
    let userScore = 0;

    // Lógica de Puntuación y Flujo (Unificada)
    function setStageComplete(isComplete = true) {
        if (isComplete && !stageProgress[currentStage]) {
            if(currentStage >= 1 && currentStage <= 3) { userScore += 10; }
        }
        stageProgress[currentStage] = isComplete;
        nextBtn.classList.toggle('active', isComplete);
    }
    
    // FUNCIÓN CRÍTICA DE RENDER CONTROL
    function renderControls(html = '') {
        controlsArea.innerHTML = `<div id="feedback" class="feedback"></div>${html}`;
        feedbackEl = document.getElementById('feedback');
    }
    
    function clearFeedback(){ if(feedbackEl) feedbackEl.textContent = ""; }
    function setFeedback(text, kind){ 
        if(!feedbackEl) return;
        feedbackEl.textContent = text;
        if(kind === 'ok'){ feedbackEl.style.color = 'var(--ok)' }
        else if(kind === 'bad'){ feedbackEl.style.color = 'var(--bad)' }
        else { feedbackEl.style.color = 'var(--text-color)' }
    }
    function disableOptions() { document.querySelectorAll('.opt, .word-option').forEach(el => el.classList.add('disabled')); }
    
    function next(){ 
        if (!stageProgress[currentStage]) {
            setFeedback("¡Termina esta parte antes de continuar!", 'bad');
            return;
        }
        if (currentStage === 4) {
             alert(`✅ Tema Terminado. Puntuación simulada: ${userScore}/${TOTAL_ACTIVITY_POINTS}. Volviendo al Módulo 2...`);
             window.location.href = MAIN_SCREEN_URL; 
             return; 
        }
        currentStage++;
        if (currentStage >= stages.length) { currentStage = stages.length - 1; }
        render(); 
    }

    function speakText(text, lang='es-ES'){ 
        if(!window.speechSynthesis) return;
        const u = new SpeechSynthesisUtterance(text);
        u.lang = lang;
        window.speechSynthesis.cancel();
        window.speechSynthesis.speak(u);
    }
    
    // COMENTARIO: FUNCIÓN DE AUDIO MEJORADA (Manejo de Promise para diagnóstico)
    function playAudio(audioFilename, text, lang = 'cho') {
        // COMENTARIO: Se corrige la ruta a la ruta relativa correcta (../assets/audio)
        const audioUrl = `../assets/audio/${audioFilename}`; 
        
        const audio = new Audio(audioUrl);
        
        audio.play()
            .then(() => {
                setFeedback(`🔊 Reproduciendo: "${text}"`, 'neutral');
            })
            .catch(e => {
                // COMENTARIO: Si el archivo no carga (404 o formato), este error aparecerá en la Consola.
                console.error(`❌ Error al cargar o reproducir "${audioUrl}": ${e.message}`);
                speakText(text, lang); 
                setFeedback(`[TTS] No se encontró el audio real. Reproduciendo: "${text}"`, 'neutral');
            });
    }

    // COMENTARIO: createAudioButton se mueve al ámbito global para evitar ReferenceError.
    function createAudioButton(text, audioFilename, lang = 'cho') {
        const btn = document.createElement('button');
        btn.className = 'ghost';
        btn.innerHTML = '🔊 Reproducir Audio';
        btn.onclick = () => { playAudio(audioFilename, text, lang); };
        return btn;
    }

    function render(){ 
        clearFeedback(); 
        setStageComplete(false);
        const container = document.getElementById('stageArea'); 
        container.innerHTML=''; 

        const titles = ['M2 - Tema 2: Adjetivos', 'Actividad 1: Escucha y Traduce', 'Actividad 2: Identificar Opuestos', 'Actividad 3: Completar Oración', '¡Tema Terminado!'];
        titleEl.textContent = titles[currentStage];

        stages[currentStage](container);
        
        if (currentStage === 0 || currentStage === 4) { setStageComplete(true); }
    }

    // =======================================================================
    // 0 - MINI-CLASE (VIDEO INTRO)
    // =======================================================================
    function renderStage0(container){
        const videoHtml = `
            <div class="video-wrapper">
                <iframe src="https://www.youtube.com/embed/dQw4w9WgXcQ?rel=0" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
            </div>
            <p style="text-align:center; max-width: 600px; margin-top: 20px;">
                ¡Aprende a describir! Mira el video para conocer los adjetivos básicos en Ch'ol.
            </p>
        `;
        container.innerHTML = videoHtml;
        setStageComplete(true);
        renderControls();
    }

    // =======================================================================
    // 1 - ACTIVIDAD 1: ESCUCHA Y TRADUCE (Adjetivos)
    // =======================================================================
    const stage1Data = [
        // COMENTARIO: NOMBRES DE ARCHIVO ESTANDARIZADOS A MINÚSCULAS
        { audio: "Chañ", filename: "chan.mp3", correct: "Alto", options: ["Alto", "Chaparro", "Flaco", "Gordo"] },
        { audio: "Jujp´eñ", filename: "jupen.mp3", correct: "Gordo", options: ["Largo", "Corto", "Pequeño", "Gordo"] },
        { audio: "Kolem", filename: "kolem.mp3", correct: "Grande", options: ["Pequeño", "Grande", "Flaco", "Alto"] },
        { audio: "Tyäkiñ", filename: "tyakin.mp3", correct: "Flaco", options: ["Flaco", "Gordo", "Alto", "Chaparro"] },
    ];
    let currentRound1 = 0; 

    function checkAnswer1(selectedOption, currentData, allOptionsElements) {
        if (selectedOption === currentData.correct) {
            setFeedback('¡Muy bien! ¡Correcto!', 'ok');
        } else {
            setFeedback('Incorrecto. ¡La respuesta correcta es: ' + currentData.correct + '!', 'bad');
            allOptionsElements.forEach(el => { if (el.textContent === currentData.correct) { el.classList.add('ok'); } });
        }
        currentRound1++;
        setTimeout(() => renderStage1(document.getElementById('stageArea')), selectedOption === currentData.correct ? 1200 : 2500);
    }

    function renderStage1(container) {
        if (currentRound1 >= stage1Data.length) {
            container.innerHTML = `<h2 style="color: var(--ok);">¡Felicidades! Completaste las ${stage1Data.length} rondas.</h2>`;
            setStageComplete(true);
            renderControls();
            return;
        }
        const currentData = stage1Data[currentRound1];
        container.innerHTML = `<p class="stage0-info">Ronda ${currentRound1 + 1} de ${stage1Data.length}: Escucha el adjetivo y selecciona su **traducción**.</p>`;

        // 1. Crear el botón como objeto DOM
        const audioBtn = createAudioButton(currentData.audio, currentData.filename, 'cho'); 
        
        // 2. Inicializar el controlsArea (solo con el feedback)
        renderControls();
        
        // 3. Crear contenedor de centrado para el botón
        const buttonWrapper = document.createElement('div');
        buttonWrapper.style.cssText = "display: flex; gap: 15px; justify-content: center; margin-bottom: 20px;";
        buttonWrapper.appendChild(audioBtn);

        // COMENTARIO: CORRECCIÓN DE DOM. Se inserta el objeto DOM (buttonWrapper) directamente,
        // eliminando el uso de outerHTML.
        const feedbackEl = document.getElementById('feedback');
        if (controlsArea) {
            controlsArea.insertBefore(buttonWrapper, feedbackEl.nextSibling); 
        }
        
        const row = document.createElement('div');
        row.className = 'options-row';
        currentData.options.sort(() => Math.random() - 0.5); 

        currentData.options.forEach(opt => {
            const b = document.createElement('div');
            b.className = 'opt';
            b.textContent = opt;
            
            b.onclick = () => {
                disableOptions(); 
                if (opt !== currentData.correct) { b.classList.add('bad'); }
                checkAnswer1(opt, currentData, document.querySelectorAll('.opt'));
            };
            row.appendChild(b);
        });

        container.appendChild(row);
        setStageComplete(false); 
    }

    // =======================================================================
    // 2 - ACTIVIDAD 2: IDENTIFICAR POR IMAGEN (Opuestos)
    // =======================================================================
    const stage2Questions = [
        // COMENTARIO: NOMBRES DE ARCHIVO ESTANDARIZADOS A MINÚSCULAS
        { audio: "Chaparro", filename: "chaparro.mp3", correct: "chaparro.png", word: "Chaparro" },
        { audio: "Kolem", filename: "kolem.mp3", correct: "gigante.png", word: "Grande" }, 
        { audio: "Tyäkiñ", filename: "flaco.mp3", correct: "flaco.png", word: "Flaco" },
    ];
    let currentRound2 = 0; 

    function checkAnswer2(selectedImage, currentData) {
        if (selectedImage === currentData.correct) {
             setFeedback(`¡Correcto! Es la imagen de ${currentData.word}.`, 'ok');
        } else {
             setFeedback('Incorrecto. La figura correcta representa ' + currentData.word + '!', 'bad');
             document.querySelectorAll('.img-option').forEach(el => { if (el.dataset.img === currentData.correct) { el.classList.add('ok'); } el.classList.add('disabled'); });
        }
        currentRound2++;
        setTimeout(() => renderStage2(document.getElementById('stageArea')), selectedImage === currentData.correct ? 1200 : 2500);
    }
    
    function renderStage2(container) {
        if (currentRound2 >= stage2Questions.length) {
            container.innerHTML = `<h2 style="color: var(--ok);">¡Genial! Terminaste la identificación de imágenes.</h2>`;
            setStageComplete(true);
            renderControls();
            return; 
        }

        const currentData = stage2Questions[currentRound2];
        container.innerHTML = `<p class="stage0-info">Ronda ${currentRound2 + 1} de 3. Escucha el adjetivo y selecciona la imagen correcta.</p>`;
        
        // 1. Crear el botón como objeto DOM
        const audioBtn = createAudioButton(currentData.audio, currentData.filename, 'cho');
        
        // 2. Inicializar el controlsArea (solo con el feedback)
        renderControls();

        // 3. Crear contenedor de centrado para el botón
        const buttonWrapper = document.createElement('div');
        buttonWrapper.style.cssText = "display: flex; gap: 15px; justify-content: center; margin-bottom: 20px;";
        buttonWrapper.appendChild(audioBtn);

        // COMENTARIO: CORRECCIÓN DE DOM. Se inserta el objeto DOM (buttonWrapper) directamente.
        const feedbackEl = document.getElementById('feedback');
        if (controlsArea) {
            controlsArea.insertBefore(buttonWrapper, feedbackEl.nextSibling); 
        }
        
        // Simulación de opciones de imagen (DEBES LLENAR CON TUS RUTAS REALES)
        const allOptions = [
             { filename: currentData.correct, word: currentData.word },
             { filename: 'contrario_1.png', word: 'Gordo/Bajo' },
             { filename: 'contrario_2.png', word: 'Otro Objeto' }
        ];

        const row = document.createElement('div');
        row.className = 'options-row';
        allOptions.sort(() => Math.random() - 0.5);

        allOptions.forEach(it => {
            const b = document.createElement('div');
            b.className = 'opt img-option'; 
            b.dataset.img = it.filename;
            
            // COMENTARIO: RUTA DE IMAGEN CORREGIDA
            b.innerHTML = `<img src="../assets/img/${it.filename}" alt="${it.word}"/>`; 
            
            b.onclick = ()=>{
                disableOptions();
                if (it.filename !== currentData.correct) { b.classList.add('bad'); }
                checkAnswer2(it.filename, currentData);
            };
            row.appendChild(b);
        });

        container.appendChild(row);
        setStageComplete(false);
    }
    
    // =======================================================================
    // 3 - ACTIVIDAD 3: COMPLETAR ORACIÓN (Contexto de la Casa/Lugar)
    // =======================================================================
    const stage3Data = [
        { sentence: "Mi patio es ____.", correct: "Kolem", options: ["Kolem", "Chañ", "Pek´"], hint: "Grande o Pequeño" },
        { sentence: "El camino es ____.", correct: "Tyam", options: ["Tyam", "Kom", "Chañ"], hint: "Largo o Corto" },
        { sentence: "El perro es ____.", correct: "Jujp´eñ", options: ["Tyäkiñ", "Jujp´eñ", "Chuty"], hint: "Flaco o Gordo" },
    ];
    let currentRound3 = 0;

    function checkAnswer3(selectedWord, currentData) {
        if (selectedWord === currentData.correct) {
             setFeedback('¡Correcto! El adjetivo es adecuado.', 'ok');
        } else {
             setFeedback('Incorrecto. El adjetivo correcto era: ' + currentData.correct, 'bad');
             document.querySelectorAll('.word-option').forEach(el => { if (el.textContent === currentData.correct) { el.classList.add('ok'); } el.classList.add('disabled'); });
        }
        currentRound3++;
        setTimeout(() => renderStage3(document.getElementById('stageArea')), selectedWord === currentData.correct ? 1200 : 2500);
    }

    function renderStage3(container) {
        if (currentRound3 >= stage3Data.length) {
            container.innerHTML = `<h2 style="color: var(--ok);">¡Felicidades! Completaste las frases.</h2>`;
            setStageComplete(true);
            renderControls();
            return;
        }

        const currentData = stage3Data[currentRound3];
        container.innerHTML = `<p class="stage0-info">Ronda ${currentRound3 + 1} de ${stage3Data.length}: Selecciona el adjetivo que mejor completa la frase:</p>`;
        
        const sentenceArea = document.createElement('div');
        sentenceArea.className = 'sentence-input-area';
        const displayedSentence = currentData.sentence.replace('____', `<span id="wordSlot" class="word-slot">?</span>`);
        sentenceArea.innerHTML = displayedSentence;
        container.appendChild(sentenceArea);

        const optionsContainer = document.createElement('div');
        optionsContainer.className = 'options-row';
        currentData.options.sort(() => Math.random() - 0.5); 

        currentData.options.forEach(opt => {
            const b = document.createElement('div');
            b.className = 'word-option';
            b.textContent = opt;
            
            b.onclick = () => {
                document.getElementById('wordSlot').textContent = opt;
                disableOptions();
                if (opt !== currentData.correct) { b.classList.add('bad'); }
                checkAnswer3(opt, currentData);
            };

            optionsContainer.appendChild(b);
        });

        container.appendChild(optionsContainer);
        setStageComplete(false); 
        renderControls();
    }
    
    // =======================================================================
    // 4 - FINAL DE TEMA
    // =======================================================================
    function renderStage4(container) {
        container.innerHTML = `
            <div style="text-align: center; padding: 40px; border: 5px dashed var(--ok); border-radius: 20px;">
                <h2 style="color: var(--ok); font-size: 2.5rem;">🎉 ¡Tema 2 Completado! 🎉</h2>
                <p style="font-size: 1.2rem;">Puntuación simulada: **${userScore}/${TOTAL_ACTIVITY_POINTS}**</p>
                <p>Presiona **Siguiente** para volver al Módulo 2: Donde Vivo.</p>
            </div>
        `;
        setStageComplete(true);
        renderControls();
    }

    // --- Inicialización ---
    document.addEventListener('DOMContentLoaded', () => {
        render();
    });
</script>
</body>
</html>
