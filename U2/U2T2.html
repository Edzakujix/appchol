<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Tema 2: Adjetivos</title>

    <link rel="stylesheet" href="../assets/css/styles.css">
    <link rel="stylesheet" href="../assets/css/enhanced-styles.css">

    <style>

        button.primary {
            opacity: 0.5;
            pointer-events: none;
        }
        button.primary.active {
            opacity: 1;
            pointer-events: auto;
        }

        .opt {
            min-width: 140px; 
            padding: 15px; 
            border-radius: 20px; 
            background: #fff; 
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px; 
            cursor: pointer; 
            border: 4px solid #E0E0E0;
            font-size: 1.1rem; 
            font-weight: 600; 
            transition: all .2s;
            text-align: center;
        }

        .opt:hover:not(.disabled) {
            transform: translateY(-5px); 
            border-color: var(--accent);
        }

        .opt.disabled { 
            pointer-events: none; 
            opacity: 0.7; 
            cursor: default;
        }

        .sentence-input-area { 
            font-size: clamp(1.2rem, 4vw, 1.6rem); 
            font-weight: bold; 
            text-align: center; 
            margin-bottom: 25px; 
            padding: 20px;
            background-color: #fff;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .word-slot { 
            display: inline-block; 
            min-width: 100px; 
            padding: 0 10px;
            border-bottom: 3px solid var(--accent); 
            color: var(--accent); 
            margin: 0 5px; 
            text-align: center; 
            font-weight: 800;
        }

        .word-option { 
            background-color: #fff; 
            border: 3px solid #FFCA28; 
            border-radius: 15px; 
            padding: 12px 20px; 
            margin: 5px; 
            cursor: pointer; 
            transition: all 0.2s; 
            font-weight: 700; 
            font-size: clamp(1rem, 3vw, 1.2rem); 
            box-shadow: 0 4px 0 rgba(0,0,0,0.1);
        }
        
        .word-option:hover:not(.disabled) {
            transform: translateY(-3px);
            box-shadow: 0 6px 0 rgba(0,0,0,0.1);
        }
        
        .word-option.disabled {
            opacity: 0.6;
            pointer-events: none;
        }

        .img-option img {
            width: 120px; 
            height: 120px;
            border-radius: 12px;
            object-fit: cover;
        }
    </style>
</head>
<body>
    <div class="app" role="application" aria-label="Prototipo actividades para primaria">
        <header>
            <h1 id="title">M2 - Tema 2: Adjetivos</h1>
            <div style="display: flex; gap: 10px;">
                <button class="ghost" onclick="goHome()" style="font-weight: 500; padding: 10px;">🏠 Inicio</button>
                <button class="primary" id="nextBtn" onclick="next()">Siguiente</button>
            </div>
        </header>

        <main class="stage-area" id="stageArea"></main>

        <div class="controls" id="controlsArea"></div>

        <footer>Prototipo educativo · Módulo 2: Donde Vivo</footer>
    </div>
    
    <div class="ground-sim"></div>

    <script src="../assets/js/sound-effects.js"></script>

<script>
    const TEMA_ID = 5;
    const MAIN_SCREEN_URL = '../U2/U2DOVI.html'; 
    const USER_GOOGLE_ID = 'ID_DEL_USUARIO_AUTENTICADO';
    const TOTAL_ACTIVITY_POINTS = 30; 
    
    let stage1Attempts = 0;
    const stage1MaxAttempts = 2;

    let stage2Attempts = 0;
    const stage2MaxAttempts = 2;
    
    let stage3Attempts = 0;
    const stage3MaxAttempts = 2;

    function goHome() {
        soundSystem.play('whoosh');
        setTimeout(() => {
            window.location.href = MAIN_SCREEN_URL;
        }, 200);
    }

    const stages = [renderStage0, renderStage1, renderStage2, renderStage3, renderStage4]; 
    let currentStage = 0;
    let feedbackEl = null; 
    const titleEl = document.getElementById('title');
    const nextBtn = document.getElementById('nextBtn');
    const controlsArea = document.getElementById('controlsArea');
    let stageProgress = new Array(stages.length).fill(false); 
    let userScore = 0;

    function setStageComplete(isComplete = true) {
        if (isComplete && !stageProgress[currentStage]) {
            if(currentStage >= 1 && currentStage <= 3) { userScore += 10; }
        }
        stageProgress[currentStage] = isComplete;
        nextBtn.classList.toggle('active', isComplete);
    }
    
    function renderControls(html = '') {
        controlsArea.innerHTML = `<div id="feedback" class="feedback"></div>${html}`;
        feedbackEl = document.getElementById('feedback');
    }
    
    function clearFeedback(){ if(feedbackEl) feedbackEl.textContent = ""; }
    
    function setFeedback(text, kind){ 
        if(!feedbackEl) return;
        feedbackEl.textContent = text;
        if(kind === 'ok'){ feedbackEl.style.color = 'var(--ok)' }
        else if(kind === 'bad'){ feedbackEl.style.color = 'var(--bad)' }
        else { feedbackEl.style.color = 'var(--text-color)' }
    }

    function disableOptions(selector) { 
        document.querySelectorAll(selector).forEach(el => el.classList.add('disabled')); 
    }
    
    function next(){ 
        if (!stageProgress[currentStage]) {
            setFeedback("¡Termina esta parte antes de continuar!", 'bad');
            soundSystem.play('error');
            return;
        }

        soundSystem.play('whoosh');

        if (currentStage === 4) {
             setTimeout(() => {
                 alert(`✅ Tema Terminado. Volviendo al Módulo 2...`);
                 window.location.href = MAIN_SCREEN_URL; 
             }, 300);
             return; 
        }
        currentStage++;
        if (currentStage >= stages.length) { currentStage = stages.length - 1; }
        render(); 
    }

    function speakText(text, lang='es-ES'){ 
        if(!window.speechSynthesis) return;
        const u = new SpeechSynthesisUtterance(text);
        u.lang = lang;
        window.speechSynthesis.cancel();
        window.speechSynthesis.speak(u);
    }
    
    function playAudio(audioFilename, text, lang = 'cho') {
        const audioUrl = `../assets/audio/${audioFilename}`; 
        const audio = new Audio(audioUrl);
        
        audio.play()
            .then(() => {
                setFeedback(`🔊 Reproduciendo: "${text}"`, 'neutral');
            })
            .catch(e => {
                console.error(`❌ Error al cargar o reproducir "${audioUrl}": ${e.message}`);
                speakText(text, lang); 
                setFeedback(`[TTS] No se encontró el audio real. Reproduciendo: "${text}"`, 'neutral');
            });
    }

    function createAudioButton(text, audioFilename, lang = 'cho') {
        const btn = document.createElement('button');
        btn.className = 'ghost audio-btn';
        btn.innerHTML = '🔊 Reproducir Audio';
        btn.onclick = () => { playAudio(audioFilename, text, lang); };
        return btn;
    }

    function render(){ 
        clearFeedback(); 
        setStageComplete(false);
        const container = document.getElementById('stageArea'); 
        container.innerHTML=''; 

        const titles = ['M2 - Tema 2: Adjetivos', 'Actividad 1: Escucha y Traduce', 'Actividad 2: Identificar Opuestos', 'Actividad 3: Completar Oración', '¡Tema Terminado!'];
        titleEl.textContent = titles[currentStage];

        stages[currentStage](container);
        
        if (currentStage === 0 || currentStage === 4) { setStageComplete(true); }
    }

    function renderStage0(container){
        const videoHtml = `
            <div class="video-wrapper">
                <iframe src="https://www.youtube.com/embed/RUTAS_PENDIENTES?rel=0" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
            </div>
            <p style="text-align:center; max-width: 600px; margin-top: 20px;">
                ¡Aprende a describir! Mira el video para conocer los adjetivos básicos en Ch'ol.
            </p>
        `;
        container.innerHTML = videoHtml;
        setStageComplete(true);
        renderControls();
    }

    const stage1Data = [
        { audio: "Chañ", filename: "Alto.mp3", correct: "Alto", options: ["Alto", "Chaparro", "Flaco", "Gordo"] },
        { audio: "Jujp´eñ", filename: "Gordo.mp3", correct: "Gordo", options: ["Largo", "Corto", "Pequeño", "Gordo"] },
        { audio: "Kolem", filename: "Grande.mp3", correct: "Grande", options: ["Pequeño", "Grande", "Flaco", "Alto"] },
        { audio: "Tyäkiñ", filename: "Flaco.mp3", correct: "Flaco", options: ["Flaco", "Gordo", "Alto", "Chaparro"] },
    ];
    let currentRound1 = 0; 

    function checkAnswer1(selectedOption, currentData, allOptionsElements, selectedElement) {
        if (selectedOption === currentData.correct) {
            setFeedback('¡Muy bien! ¡Correcto!', 'ok');
            handleCorrectAnswer(selectedElement);
            
            stage1Attempts = 0;
            currentRound1++;
            setTimeout(() => {
                renderStage1(document.getElementById('stageArea'));
            }, 1500);
        } else {
            stage1Attempts++;
            if (stage1Attempts < stage1MaxAttempts) {
                handleIncorrectAnswer(selectedElement);
                setFeedback(`Incorrecto. Te quedan ${stage1MaxAttempts - stage1Attempts} intentos.`, 'bad');
                
                setTimeout(() => {
                    allOptionsElements.forEach(el => {
                        el.classList.remove('disabled', 'bad');
                        el.style.pointerEvents = 'auto';
                    });
                    setFeedback('Escucha y prueba otra vez...', 'neutral');
                }, 1500);
            } else {
                handleIncorrectAnswer(selectedElement);
                setFeedback('Incorrecto. ¡La respuesta correcta es: ' + currentData.correct + '!', 'bad');
                
                allOptionsElements.forEach(el => { 
                    if (el.textContent === currentData.correct) { 
                        el.classList.add('ok'); 
                    } 
                });
                
                stage1Attempts = 0;
                currentRound1++;
                setTimeout(() => {
                    renderStage1(document.getElementById('stageArea'));
                }, 2500);
            }
        }
    }

    function renderStage1(container) {
        if (currentRound1 >= stage1Data.length) {
            container.innerHTML = `<h2 style="color: var(--ok);">¡Felicidades! Completaste las ${stage1Data.length} rondas.</h2>`;
            setStageComplete(true);
            renderControls();
            earnStar(container);
            return;
        }
        const currentData = stage1Data[currentRound1];
        const attemptsInfo = stage1MaxAttempts > 1 ? `(Tienes ${stage1MaxAttempts} intentos)` : '';

        container.innerHTML = `<p class="stage0-info">Ronda ${currentRound1 + 1} de ${stage1Data.length}: Escucha el adjetivo y selecciona su traducción. ${attemptsInfo}</p>`;

        const audioBtn = createAudioButton(currentData.audio, currentData.filename, 'cho'); 
        
        renderControls();
        
        const buttonWrapper = document.createElement('div');
        buttonWrapper.style.cssText = "display: flex; gap: 15px; justify-content: center; margin-bottom: 20px;";
        buttonWrapper.appendChild(audioBtn);

        const feedbackEl = document.getElementById('feedback');
        if (controlsArea) {
            controlsArea.insertBefore(buttonWrapper, feedbackEl.nextSibling); 
        }
        
        const row = document.createElement('div');
        row.className = 'options-row';
        currentData.options.sort(() => Math.random() - 0.5); 

        currentData.options.forEach(opt => {
            const b = document.createElement('div');
            b.className = 'opt';
            b.textContent = opt;
            
            b.onclick = () => {
                const allOptions = document.querySelectorAll('.opt');
                disableOptions('.opt'); 
                
                if (opt === currentData.correct) {
                    b.classList.add('ok');
                } else {
                    b.classList.add('bad');
                }
                
                checkAnswer1(opt, currentData, allOptions, b);
            };
            row.appendChild(b);
        });

        container.appendChild(row);
        setStageComplete(false); 
    }

    const stage2Questions = [
        { audio: "Chaparro", filename: "Chaparro.mp3", correct: "niño.png", word: "Chaparro" },
        { audio: "Kolem", filename: "Grande.mp3", correct: "hermano_mayor.png", word: "Grande" }, 
        { audio: "Tyäkiñ", filename: "Flaco.mp3", correct: "hermano.png", word: "Flaco" },
    ];
    let currentRound2 = 0; 

    function checkAnswer2(selectedImage, currentData, allOptionsElements, selectedElement) {
        if (selectedImage === currentData.correct) {
             setFeedback(`¡Correcto! Es la imagen de ${currentData.word}.`, 'ok');
             handleCorrectAnswer(selectedElement);
             
             stage2Attempts = 0;
             currentRound2++;
             setTimeout(() => {
                 renderStage2(document.getElementById('stageArea'));
             }, 1500);
        } else {
             stage2Attempts++;
             if (stage2Attempts < stage2MaxAttempts) {
                 handleIncorrectAnswer(selectedElement);
                 setFeedback(`Incorrecto. Te quedan ${stage2MaxAttempts - stage2Attempts} intentos.`, 'bad');
                 
                 setTimeout(() => {
                    allOptionsElements.forEach(el => {
                        el.classList.remove('disabled', 'bad');
                        el.style.pointerEvents = 'auto';
                    });
                    setFeedback('Intenta de nuevo...', 'neutral');
                }, 1500);
             } else {
                 handleIncorrectAnswer(selectedElement);
                 setFeedback('Incorrecto. La figura correcta representa ' + currentData.word + '!', 'bad');
                 
                 allOptionsElements.forEach(el => { 
                     if (el.dataset.img === currentData.correct) { 
                         el.classList.add('ok'); 
                     } 
                 });
                 
                 stage2Attempts = 0;
                 currentRound2++;
                 setTimeout(() => {
                     renderStage2(document.getElementById('stageArea'));
                 }, 2500);
             }
        }
    }
    
    function renderStage2(container) {
        if (currentRound2 >= stage2Questions.length) {
            container.innerHTML = `<h2 style="color: var(--ok);">¡Genial! Terminaste la identificación de imágenes.</h2>`;
            setStageComplete(true);
            renderControls();
            earnStar(container);
            return; 
        }

        const currentData = stage2Questions[currentRound2];
        const attemptsInfo = stage2MaxAttempts > 1 ? `(Tienes ${stage2MaxAttempts} intentos)` : '';

        container.innerHTML = `<p class="stage0-info">Ronda ${currentRound2 + 1} de 3. Escucha el adjetivo y selecciona la imagen correcta. ${attemptsInfo}</p>`;
        
        const audioBtn = createAudioButton(currentData.audio, currentData.filename, 'cho');
        
        renderControls();

        const buttonWrapper = document.createElement('div');
        buttonWrapper.style.cssText = "display: flex; gap: 15px; justify-content: center; margin-bottom: 20px;";
        buttonWrapper.appendChild(audioBtn);

        const feedbackEl = document.getElementById('feedback');
        if (controlsArea) {
            controlsArea.insertBefore(buttonWrapper, feedbackEl.nextSibling); 
        }
        
        const allOptions = [
             { filename: currentData.correct, word: currentData.word },
             { filename: 'niña.png', word: 'otro' },
             { filename: 'mama.png', word: 'Otro' }
        ];

        const row = document.createElement('div');
        row.className = 'options-row';
        allOptions.sort(() => Math.random() - 0.5);

        allOptions.forEach(it => {
            const b = document.createElement('div');
            b.className = 'opt img-option'; 
            b.dataset.img = it.filename;
            
            b.innerHTML = `<img src="../assets/img/${it.filename}" alt="${it.word}"/>`; 
            
            b.onclick = ()=>{
                const allOptions = document.querySelectorAll('.img-option');
                disableOptions('.img-option');
                
                if (it.filename === currentData.correct) {
                    b.classList.add('ok');
                } else {
                    b.classList.add('bad');
                }
                
                checkAnswer2(it.filename, currentData, allOptions, b);
            };
            row.appendChild(b);
        });

        container.appendChild(row);
        setStageComplete(false);
    }

    const stage3Data = [
        { sentence: "Mi patio es ____.", correct: "Kolem", options: ["Kolem", "Chañ", "Pek´"], hint: "Grande" },
        { sentence: "El camino es ____.", correct: "Tyam", options: ["Tyam", "Kom", "Chañ"], hint: "Largo" },
        { sentence: "El perro es ____.", correct: "Chuty", options: ["Tyäkiñ", "Jujp´eñ", "Chuty"], hint: "Pequeño" },
    ];
    let currentRound3 = 0;

    function checkAnswer3(selectedWord, currentData, allOptionsElements, selectedElement) {
        if (selectedWord === currentData.correct) {
             setFeedback('¡Correcto! El adjetivo es adecuado.', 'ok');
             handleCorrectAnswer(selectedElement);
             
             stage3Attempts = 0;
             currentRound3++;
             setTimeout(() => {
                 renderStage3(document.getElementById('stageArea'));
             }, 1500);
        } else {
             stage3Attempts++;
             if (stage3Attempts < stage3MaxAttempts) {
                 handleIncorrectAnswer(selectedElement);
                 setFeedback(`Incorrecto. Te quedan ${stage3MaxAttempts - stage3Attempts} intentos.`, 'bad');
                 
                 setTimeout(() => {
                     allOptionsElements.forEach(el => {
                         el.classList.remove('disabled', 'bad');
                         el.style.pointerEvents = 'auto';
                     });
                     setFeedback('Intenta de nuevo...', 'neutral');
                 }, 1500);
             } else {
                 handleIncorrectAnswer(selectedElement);
                 setFeedback('Incorrecto. El adjetivo correcto era: ' + currentData.correct, 'bad');
                 
                 document.getElementById('wordSlot').textContent = currentData.correct;
                 document.getElementById('wordSlot').style.color = 'var(--ok)';
                 
                 allOptionsElements.forEach(el => { 
                     if (el.textContent === currentData.correct) { 
                         el.classList.add('ok'); 
                     } 
                 });
                 
                 stage3Attempts = 0;
                 currentRound3++;
                 setTimeout(() => {
                     renderStage3(document.getElementById('stageArea'));
                 }, 2500);
             }
        }
    }

    function renderStage3(container) {
        if (currentRound3 >= stage3Data.length) {
            container.innerHTML = `<h2 style="color: var(--ok);">¡Felicidades! Completaste las frases.</h2>`;
            setStageComplete(true);
            renderControls();
            earnStar(container);
            return;
        }

        const currentData = stage3Data[currentRound3];
        const attemptsInfo = stage3MaxAttempts > 1 ? `(Tienes ${stage3MaxAttempts} intentos)` : '';

        container.innerHTML = `<p class="stage0-info">Ronda ${currentRound3 + 1} de ${stage3Data.length}: Selecciona el adjetivo que mejor completa la frase. ${attemptsInfo}</p>`;
        
        const sentenceArea = document.createElement('div');
        sentenceArea.className = 'sentence-input-area';
        const displayedSentence = currentData.sentence.replace('____', `<span id="wordSlot" class="word-slot">?</span>`);
        sentenceArea.innerHTML = displayedSentence;
        container.appendChild(sentenceArea);

        const optionsContainer = document.createElement('div');
        optionsContainer.className = 'options-row';
        currentData.options.sort(() => Math.random() - 0.5); 

        currentData.options.forEach(opt => {
            const b = document.createElement('div');
            b.className = 'word-option';
            b.textContent = opt;
            
            b.onclick = () => {
                const allOptions = document.querySelectorAll('.word-option');
                disableOptions('.word-option');
                
                document.getElementById('wordSlot').textContent = opt;
                
                if (opt === currentData.correct) {
                    b.classList.add('ok');
                } else {
                    b.classList.add('bad');
                }
                
                checkAnswer3(opt, currentData, allOptions, b);
            };

            optionsContainer.appendChild(b);
        });

        container.appendChild(optionsContainer);
        setStageComplete(false); 
        renderControls();
    }
    
    function renderStage4(container) {
        container.innerHTML = `
            <div style="text-align: center; padding: 40px; border: 5px dashed var(--ok); border-radius: 20px; background-color: rgba(255,255,255,0.9);">
                <h2 style="color: var(--ok); font-size: 2.5rem; margin-bottom: 20px;">🎉 ¡Tema 2 Completado! 🎉</h2>
                <p style="font-size: 1.5rem; font-weight: bold;">Puntuación simulada: ${userScore}/${TOTAL_ACTIVITY_POINTS}</p>
                <p style="margin-top: 15px;">Has aprendido los adjetivos en Ch'ol.</p>
                <p>Presiona Siguiente para volver al Módulo 2.</p>
            </div>
        `;
        
        try {
            if (window.visualEffects && typeof window.visualEffects.confetti === 'function') {
                window.visualEffects.confetti();
            } else if (typeof celebrateLevelComplete === 'function') {
                celebrateLevelComplete();
            }
        } catch (e) {
            console.log("Efectos visuales no disponibles");
        }

        guardarProgresoEnBD();
        setStageComplete(true);
        renderControls();
    }

    function guardarProgresoEnBD() {
        fetch('../../backend/api/progress.php', { 
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                tema_id: TEMA_ID,
                completado: true
            })
        })
        .then(response => response.json())
        .then(data => {
            console.log("Progreso guardado:", data);
            if(data.success && window.collectCoin) {
                collectCoin();
            }
        })
        .catch(error => console.error('Error al guardar:', error));
    }

    document.addEventListener('DOMContentLoaded', () => {
        render();
    });
</script>
</body>
</html>
