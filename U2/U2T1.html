<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Tema 1: Mi Casa</title>

    <link rel="stylesheet" href="../assets/css/styles.css">

    <style>
button.primary {
    opacity: 0.5;
    pointer-events: none;
}

button.primary.active {
    opacity: 1;
    pointer-events: auto;
}

button.primary.active:active {
    transform: translateY(5px);
    box-shadow: 0 0px 0 0 #0288D1;
}

.opt {
    min-width: 140px; 
    padding: 20px; 
    border-radius: 20px; 
    background: #fff; 
    box-shadow: 0 8px 18px rgba(0, 0, 0, 0.1);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px; 
    cursor: pointer; 
    border: 4px solid #E0E0E0;
    font-size: 1.1rem; 
    font-weight: 600; 
    transition: all .2s;
}

.opt:not(.disabled):hover {
    transform: translateY(-5px) scale(1.05); 
    box-shadow: 0 12px 25px rgba(0, 0, 0, 0.15);
}

.opt.disabled { pointer-events: none; opacity: 0.7; }
.opt.ok { border-color: var(--ok); box-shadow: 0 8px 20px rgba(76,175,80,0.3); background: #E8F5E9; }
.opt.bad { border-color: var(--bad); box-shadow: 0 8px 20px rgba(229,57,53,0.3); background: #FFEBEE; }

.sentence-input-area { 
    font-size: clamp(1.2rem, 4vw, 1.6rem); 
    font-weight: bold; 
    text-align: center; 
    margin-bottom: 25px; 
}

.word-slot { 
    display: inline-block; 
    min-width: 25vw; 
    max-width: 150px; 
    height: 35px; 
    border-bottom: 3px solid var(--accent); 
    color: var(--accent); 
    margin: 0 5px; 
    text-align: center; 
}

.word-option { 
    background-color: #f0f0f0; 
    border: 3px solid #ccc; 
    border-radius: 10px; 
    padding: 8px 15px; 
    margin: 5px; 
    cursor: pointer; 
    transition: all 0.2s; 
    font-weight: 600; 
    font-size: clamp(1rem, 3vw, 1.2rem); 
}

.matching-click-container {
    display: flex;
    flex-direction: column;
    gap: 15px;
    width: 100%;
    max-width: 700px; 
    padding: 20px;
    background-color: var(--matching-bg); 
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.1);
}

.matching-card {
    background-color: var(--matching-card-bg);
    border-radius: 12px;
    padding: 10px 15px;
    font-weight: 700;
    font-size: 1.2rem;
    cursor: pointer;
    transition: all 0.2s;
    box-shadow: 0 4px 0 0 rgba(0,0,0,0.1);
    border: 3px solid transparent;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 60px;
}

.matching-card:hover:not(.matched):not(.selected) {
    transform: translateY(-2px);
    box-shadow: 0 6px 0 0 rgba(0,0,0,0.15);
}

.matching-card.selected {
    border-color: var(--select-highlight);
    box-shadow: 0 0 0 4px var(--select-highlight);
    background-color: #F8E3DD;
}

.matching-card.matched {
    background-color: var(--ok);
    color: white;
    pointer-events: none;
    cursor: default;
    box-shadow: none;
    border-color: var(--ok);
}

.matching-card.shaking {
    animation: shake 0.5s;
    animation-iteration-count: 2;
    border-color: var(--bad) !important;
    box-shadow: 0 0 0 4px var(--bad) !important;
    background-color: #FFEBEE !important;
    color: var(--bad);
}

.questions-stack, .answers-stack {
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 10px;
    border-radius: 15px;
    background: rgba(255, 255, 255, 0.5);
}

.stack-title {
    font-weight: 800;
    font-size: 1.1rem;
    color: var(--text-color);
    margin-bottom: 5px;
    text-align: left;
    padding-left: 10px;
}

@media (min-width: 601px) {
    .matching-click-container {
        flex-direction: row;
        justify-content: space-around;
    }
    .questions-stack, .answers-stack {
        flex-basis: 48%;
    }
}</style>
</head>
<body>
    <div class="app" role="application" aria-label="Prototipo actividades para primaria">
        <header>
            <h1 id="title">M2 - Tema 1: Mi Casa</h1>
            <div style="display: flex; gap: 10px;">
                <button class="ghost" onclick="goHome()" style="font-weight: 500; padding: 10px;">🏠 Inicio</button>
                <button class="primary" id="nextBtn" onclick="next()">Siguiente</button>
            </div>
        </header>

        <main class="stage-area" id="stageArea"></main>

        <div class="controls" id="controlsArea">
             </div>

        <footer>Prototipo educativo · Módulo 2: Donde Vivo</footer>
    </div>
    
    <div class="ground-sim"></div>

<script>
    const MAIN_SCREEN_URL = '../U2/U2DOVI.html'; 
    const USER_GOOGLE_ID = 'ID_DEL_USUARIO_AUTENTICADO';
    const TOTAL_ACTIVITY_POINTS = 30; 
    
    function goHome() {
        window.location.href = MAIN_SCREEN_URL;
    }

    const stages = [renderStage0, renderStage1, renderStage2, renderStage3, renderStage4]; 
    let currentStage = 0;
    let feedbackEl = null; 
    const titleEl = document.getElementById('title');
    const nextBtn = document.getElementById('nextBtn');
    const controlsArea = document.getElementById('controlsArea');
    let stageProgress = new Array(stages.length).fill(false); 
    let userScore = 0;

    function setStageComplete(isComplete = true) {
        if (isComplete && !stageProgress[currentStage]) {
            if(currentStage >= 1 && currentStage <= 3) { userScore += 10; }
        }
        stageProgress[currentStage] = isComplete;
        nextBtn.classList.toggle('active', isComplete);
    }
    
    function renderControls(html = '') {
        controlsArea.innerHTML = `<div id="feedback" class="feedback"></div>${html}`;
        feedbackEl = document.getElementById('feedback'); // Inicializa feedbackEl
    }
    
    function clearFeedback(){ if(feedbackEl) feedbackEl.textContent = ""; }
    function setFeedback(text, kind){ 
        if(!feedbackEl) return;
        feedbackEl.textContent = text;
        if(kind === 'ok'){ feedbackEl.style.color = 'var(--ok)' }
        else if(kind === 'bad'){ feedbackEl.style.color = 'var(--bad)' }
        else { feedbackEl.style.color = 'var(--text-color)' }
    }
    function disableOptions() { document.querySelectorAll('.opt, .word-option, .img-option').forEach(el => el.classList.add('disabled')); }
    
    function next(){ 
        if (!stageProgress[currentStage]) {
            setFeedback("¡Termina esta parte antes de continuar!", 'bad');
            return;
        }
        if (currentStage === 4) {
             alert(`✅ Tema Terminado. Puntuación simulada: ${userScore}/${TOTAL_ACTIVITY_POINTS}. Volviendo al Módulo 2...`);
             window.location.href = MAIN_SCREEN_URL; 
             return; 
        }
        currentStage++;
        if (currentStage >= stages.length) { currentStage = stages.length - 1; }
        render(); 
    }

    function speakText(text, lang='es-ES'){ 
        if(!window.speechSynthesis) return;
        const u = new SpeechSynthesisUtterance(text);
        u.lang = lang;
        window.speechSynthesis.cancel();
        window.speechSynthesis.speak(u);
    }
    
    function playAudio(audioFilename, text, lang = 'cho') {
        const audioUrl = `../assets/audio/${audioFilename}`; 
        
        const audio = new Audio(audioUrl);
        
        audio.play()
            .then(() => {
                setFeedback(`🔊 Reproduciendo: "${text}"`, 'neutral');
            })
            .catch(e => {
                console.error(`❌ Error al cargar o reproducir "${audioUrl}": ${e.message}`);
                speakText(text, lang); 
                setFeedback(`[TTS] No se encontró el audio real. Reproduciendo: "${text}"`, 'neutral');
            });
    }

    function createAudioButton(text, audioFilename, lang = 'cho') {
        const btn = document.createElement('button');
        btn.className = 'ghost';
        btn.innerHTML = '🔊 Reproducir Audio';
        btn.onclick = () => { playAudio(audioFilename, text, lang); };
        return btn;
    }

    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    function render(){ 
        clearFeedback(); 
        setStageComplete(false);
        const container = document.getElementById('stageArea'); 
        container.innerHTML=''; 

        const titles = ['M2 - Tema 1: Mi Casa', 'Actividad 1: Unir Palabra con Significado', 
        'Actividad 2: Oraciones Lógicas', 'Actividad 3: Escucha y Selecciona', '¡Tema Terminado!'];
        titleEl.textContent = titles[currentStage];

        stages[currentStage](container);
        
        if (currentStage === 0 || currentStage === 4) { setStageComplete(true); }
    }

    function renderStage0(container){
        const videoHtml = `
            <div class="video-wrapper">
                <iframe src="https://www.youtube.com/embed/dQw4w9WgXcQ?rel=0" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
            </div>
            <p style="text-align:center; max-width: 600px; margin-top: 20px;">
                ¡Bienvenido a Mi Casa! Mira el video para conocer los lugares que te rodean.
            </p>
        `;
        container.innerHTML = videoHtml;
        setStageComplete(true);
        renderControls();
    }

    const stage1Data = [
        { chol: 'Otyoty', es: 'Casa' },
        { chol: 'Mal', es: 'Sala' },
        { chol: 'Wätyi´bäl', es: 'Cuarto' },
        { chol: 'Paty otyoty', es: 'Patio' }
    ];

    let selectedQuestionStage1 = null;
    let matchedPairsCountStage1 = 0;

    function handleStage1QuestionClick(cardEl, itemData) {
        if (cardEl.classList.contains('selected')) {
            cardEl.classList.remove('selected');
            selectedQuestionStage1 = null;
            setFeedback('Selecciona una palabra en Ch\'ol y luego su significado en español.', 'neutral');
            return;
        }

        document.querySelectorAll('.questions-stack .matching-card.selected').forEach(el => {
            el.classList.remove('selected');
        });

        cardEl.classList.add('selected');
        selectedQuestionStage1 = itemData;
        setFeedback(`Seleccionaste **${itemData.chol}**. ¡Ahora elige su traducción!`, 'neutral');
    }

    function handleStage1AnswerClick(cardEl, itemData) {
        if (!selectedQuestionStage1) {
            setFeedback('Selecciona primero una palabra Ch\'ol de la columna izquierda.', 'bad');
            cardEl.classList.add('shaking');
            setTimeout(() => cardEl.classList.remove('shaking'), 500);
            return;
        }

        const questionCardEl = document.querySelector(`.questions-stack .matching-card[data-chol="${selectedQuestionStage1.chol}"]`);

        if (selectedQuestionStage1.es === itemData.es) {
            setFeedback('¡Emparejamiento Correcto!', 'ok');
            
            cardEl.classList.add('matched');
            questionCardEl.classList.add('matched');
            
            cardEl.classList.remove('shaking'); 
            questionCardEl.classList.remove('shaking', 'selected');

            selectedQuestionStage1 = null;
            matchedPairsCountStage1++;

            if (matchedPairsCountStage1 === stage1Data.length) {
                setFeedback('¡Actividad 1 Completada! Todo es correcto.', 'ok');
                setStageComplete(true);
            }

        } else {
            setFeedback('Incorrecto. Intenta de nuevo.', 'bad');

            cardEl.classList.add('shaking');
            questionCardEl.classList.add('shaking');
            
            setTimeout(() => {
                cardEl.classList.remove('shaking');
                questionCardEl.classList.remove('shaking');
            }, 500);
        }
    }

    function renderStage1(container){
        renderControls();
        matchedPairsCountStage1 = 0;
        selectedQuestionStage1 = null;

        const questions = stage1Data.map(d => ({ chol: d.chol, es: d.es }));
        const answers = stage1Data.map(d => ({ chol: d.chol, es: d.es }));
        
        shuffleArray(questions);
        shuffleArray(answers);

        container.innerHTML = `<p class="stage0-info">Haz clic en la palabra en **Ch'ol** (Izquierda) y luego en su **Significado** (Derecha) para unirlas.</p>`;

        const matchingContainer = document.createElement('div');
        matchingContainer.className = 'matching-click-container';

        const questionsStack = document.createElement('div');
        questionsStack.className = 'questions-stack';
        questionsStack.innerHTML = `<p class="stack-title">Ch'ol:</p>`;
        
        questions.forEach(q => {
            const cardEl = document.createElement('div');
            cardEl.className = 'matching-card';
            cardEl.textContent = q.chol;
            cardEl.dataset.chol = q.chol; 
            cardEl.onclick = () => handleStage1QuestionClick(cardEl, q);
            questionsStack.appendChild(cardEl);
        });

        const answersStack = document.createElement('div');
        answersStack.className = 'answers-stack';
        answersStack.innerHTML = `<p class="stack-title">Español:</p>`;

        answers.forEach(a => {
            const cardEl = document.createElement('div');
            cardEl.className = 'matching-card';
            
            cardEl.textContent = a.es;
            
            cardEl.onclick = () => handleStage1AnswerClick(cardEl, a);
            answersStack.appendChild(cardEl);
        });

        matchingContainer.appendChild(questionsStack);
        matchingContainer.appendChild(answersStack);
        container.appendChild(matchingContainer);
        
        setFeedback('Selecciona una palabra y su traducción.', 'neutral');
        setStageComplete(false);
    }

    const stage2Data = [
        { sentence: "Me ducho en el ____.", correct: "Wätyi´bäl", options: ["Wätyi´bäl", "Mal", "Paty otyoty"] },
        { sentence: "Descanso en el ____.", correct: "Mal", options: ["Otyoty", "Mal", "Wätyi´bäl"] },
        { sentence: "Cocino en el ____.", correct: "Cocina", options: ["Cocina", "Paty otyoty", "Mal"] },
    ];
    let currentRound2 = 0;

    function checkAnswer2(selectedWord, currentData) {
        if (selectedWord === currentData.correct) {
             setFeedback('¡Correcto! La frase tiene sentido.', 'ok');
        } else {
             setFeedback('Incorrecto. La palabra correcta era: ' + currentData.correct, 'bad');
             document.querySelectorAll('.word-option').forEach(el => { if (el.textContent === currentData.correct) { el.classList.add('ok'); } el.classList.add('disabled'); });
        }
        currentRound2++;
        setTimeout(() => renderStage2(document.getElementById('stageArea')), selectedWord === currentData.correct ? 1200 : 2500);
    }

    function renderStage2(container) {
        if (currentRound2 >= stage2Data.length) {
            container.innerHTML = `<h2 style="color: var(--ok);">¡Felicidades! Completaste las oraciones lógicas.</h2>`;
            setStageComplete(true);
            renderControls();
            return;
        }

        const currentData = stage2Data[currentRound2];
        container.innerHTML = `<p class="stage0-info">Ronda ${currentRound2 + 1} de ${stage2Data.length}: Selecciona el **lugar** que completa la frase:</p>`;
        
        const sentenceArea = document.createElement('div');
        sentenceArea.className = 'sentence-input-area';
        const displayedSentence = currentData.sentence.replace('____', `<span id="wordSlot" class="word-slot">?</span>`);
        sentenceArea.innerHTML = displayedSentence;
        container.appendChild(sentenceArea);

        const optionsContainer = document.createElement('div');
        optionsContainer.className = 'options-row';
        currentData.options.sort(() => Math.random() - 0.5); 

        currentData.options.forEach(opt => {
            const b = document.createElement('div');
            b.className = 'word-option';
            b.textContent = opt;
            
            b.onclick = () => {
                document.getElementById('wordSlot').textContent = opt;
                disableOptions();
                if (opt !== currentData.correct) { b.classList.add('bad'); }
                checkAnswer2(opt, currentData);
            };

            optionsContainer.appendChild(b);
        });

        container.appendChild(optionsContainer);
        setStageComplete(false); 
        renderControls();
    }

    const stage3Questions = [
        { audio: "Otyoty", filename: "otyoty.mp3", correct: "casa_vista.png", word: "Casa" },
        { audio: "Mal", filename: "mal.mp3", correct: "sala_lugar.png", word: "Sala" }, 
        { audio: "Paty otyoty", filename: "paty_otyoty.mp3", correct: "patio_lugar.png", word: "Patio" },
    ];
    let currentRound3 = 0; 

    function checkAnswer3(selectedImage, currentData) {
         if (selectedImage === currentData.correct) {
              setFeedback(`¡Correcto! Es la ${currentData.word}.`, 'ok');
         } else {
              setFeedback('Incorrecto. La figura correcta representa ' + currentData.word + '!', 'bad');
              document.querySelectorAll('.img-option').forEach(el => { if (el.dataset.img === currentData.correct) { el.classList.add('ok'); } el.classList.add('disabled'); });
         }
         currentRound3++;
         setTimeout(() => renderStage3(document.getElementById('stageArea')), selectedImage === currentData.correct ? 1200 : 2500);
    }
    
    function renderStage3(container) {
        if (currentRound3 >= stage3Questions.length) {
            container.innerHTML = `<h2 style="color: var(--ok);">¡Genial! Terminaste las 3 rondas.</h2>`;
            setStageComplete(true);
            renderControls();
            return; 
        }

        const currentData = stage3Questions[currentRound3];
        container.innerHTML = `<p class="stage0-info">Ronda ${currentRound3 + 1} de 3. Escucha el **lugar en Ch'ol** y selecciona la imagen correcta.</p>`;
        
        const audioBtn = createAudioButton(currentData.audio, currentData.filename, 'cho');
        
        renderControls();

        const buttonWrapper = document.createElement('div');
        buttonWrapper.style.cssText = "display: flex; gap: 15px; justify-content: center; margin-bottom: 20px;";
        buttonWrapper.appendChild(audioBtn);

        const feedbackEl = document.getElementById('feedback');
        if (controlsArea) {
            controlsArea.insertBefore(buttonWrapper, feedbackEl.nextSibling); 
        }
        
        const allOptions = [
             { filename: currentData.correct, word: currentData.word },
             { filename: 'random_distractor_1.png', word: 'Distractor A' },
             { filename: 'random_distractor_2.png', word: 'Distractor B' }
        ];

        const row = document.createElement('div');
        row.className = 'options-row';
        allOptions.sort(() => Math.random() - 0.5);

        allOptions.forEach(it => {
            const b = document.createElement('div');
            b.className = 'opt img-option'; 
            b.dataset.img = it.filename;
            
            b.innerHTML = `<img src="../assets/img/${it.filename}" alt="${it.word}"/>`; 
            
            b.onclick = ()=>{
                disableOptions();
                if (it.filename !== currentData.correct) { b.classList.add('bad'); }
                checkAnswer3(it.filename, currentData);
            };
            row.appendChild(b);
        });

        container.appendChild(row);
        setStageComplete(false);
    }

    function renderStage4(container) {
        container.innerHTML = `
            <div style="text-align: center; padding: 40px; border: 5px dashed var(--ok); border-radius: 20px;">
                <h2 style="color: var(--ok); font-size: 2.5rem;">🎉 ¡Tema 1 Completado! 🎉</h2>
                <p style="font-size: 1.2rem;">Puntuación simulada: **${userScore}/${TOTAL_ACTIVITY_POINTS}**</p>
                <p>Presiona **Siguiente** para volver al Módulo 2: Donde Vivo.</p>
            </div>
        `;
        setStageComplete(true);
        renderControls();
    }


    document.addEventListener('DOMContentLoaded', () => {
        render();
    });
</script>
</body>
</html>
