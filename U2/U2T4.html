<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Tema 4: Animales</title>

    <link rel="stylesheet" href="../assets/css/styles.css">
    <link rel="stylesheet" href="../assets/css/enhanced-styles.css">

    <style>

        button.primary {
            opacity: 0.5;
            pointer-events: none;
        }
        button.primary.active {
            opacity: 1;
            pointer-events: auto;
        }

        .opt {
            min-width: 140px; 
            padding: 15px; 
            border-radius: 20px; 
            background: #fff; 
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px; 
            cursor: pointer; 
            border: 4px solid #E0E0E0;
            font-size: 1.1rem; 
            font-weight: 600; 
            transition: all .2s;
            text-align: center;
        }

        .opt:hover:not(.disabled) {
            transform: translateY(-5px); 
            border-color: var(--accent);
        }

        .opt.disabled { 
            pointer-events: none; 
            opacity: 0.7; 
            cursor: default;
        }

        .opt.img-option img {
            width: 130px; 
            height: 130px;
            border-radius: 12px;
            object-fit: contain;
        }

        .matching-click-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
            max-width: 700px;
            padding: 25px;
            background-color: #FFF; 
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            border: 4px solid #E0E0E0;
        }

        .matching-card {
            background-color: #F5F5F5;
            border-radius: 15px;
            padding: 15px 20px;
            font-weight: 700;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 0 rgba(0,0,0,0.1);
            border: 2px solid #E0E0E0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 60px;
            text-align: center;
        }

        .matching-card:hover:not(.matched):not(.selected) {
            transform: translateY(-2px);
            border-color: var(--accent);
            background-color: #FFF;
        }

        .matching-card.selected {
            border-color: var(--accent);
            background-color: #E3F2FD;
            color: var(--accent);
            transform: translateY(-2px);
        }

        .matching-card.matched {
            background-color: var(--ok);
            color: white;
            pointer-events: none;
            cursor: default;
            box-shadow: none;
            border-color: var(--ok);
            animation: pop 0.3s ease-out;
        }

        .matching-card.shaking {
            animation: shake 0.5s;
            border-color: var(--bad) !important;
            background-color: #FFEBEE !important;
            color: var(--bad);
        }

        @keyframes pop {
            0% { transform: scale(0.8); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        .questions-stack, .answers-stack {
            display: flex;
            flex-direction: column;
            gap: 12px;
            flex: 1;
        }

        .stack-title {
            font-weight: 800;
            font-size: 1.2rem;
            color: var(--text-color);
            margin-bottom: 10px;
            text-align: center;
            text-transform: uppercase;
        }

        @media (min-width: 601px) {
            .matching-click-container {
                flex-direction: row;
                justify-content: space-between;
            }
        }
    </style>
</head>
<body>
    <div class="app" role="application" aria-label="Prototipo actividades para primaria">
        <header>
            <h1 id="title">M2 - Tema 4: Animales</h1>
            <div style="display: flex; gap: 10px;">
                <button class="ghost" onclick="goHome()" style="font-weight: 500; padding: 10px;">🏠 Inicio</button>
                <button class="primary" id="nextBtn" onclick="next()">Siguiente</button>
            </div>
        </header>

        <main class="stage-area" id="stageArea"></main>

        <div class="controls" id="controlsArea"></div>

        <footer>Prototipo educativo · Módulo 2: Donde Vivo</footer>
    </div>
    
    <div class="ground-sim"></div>

    <script src="../assets/js/sound-effects.js"></script>

<script>
    const TEMA_ID = 7;
    const MAIN_SCREEN_URL = '../U2/U2DOVI.html'; 
    const USER_GOOGLE_ID = 'ID_DEL_USUARIO_AUTENTICADO';
    const TOTAL_ACTIVITY_POINTS = 30; 
    
    let stage1Attempts = 0;
    const stage1MaxAttempts = 2;

    let stage3Attempts = 0;
    const stage3MaxAttempts = 2;

    function goHome() {
        soundSystem.play('whoosh');
        setTimeout(() => {
            window.location.href = MAIN_SCREEN_URL;
        }, 200);
    }

    const stages = [renderStage0, renderStage1, renderStage2, renderStage3, renderStage4]; 
    let currentStage = 0;
    let feedbackEl = null; 
    const titleEl = document.getElementById('title');
    const nextBtn = document.getElementById('nextBtn');
    const controlsArea = document.getElementById('controlsArea');
    let stageProgress = new Array(stages.length).fill(false); 
    let userScore = 0;

    function setStageComplete(isComplete = true) {
        if (isComplete && !stageProgress[currentStage]) {
            if(currentStage >= 1 && currentStage <= 3) { userScore += 10; }
        }
        stageProgress[currentStage] = isComplete;
        nextBtn.classList.toggle('active', isComplete);
    }
    
    function renderControls(html = '') {
        controlsArea.innerHTML = `<div id="feedback" class="feedback"></div>${html}`;
        feedbackEl = document.getElementById('feedback');
    }
    
    function clearFeedback(){ if(feedbackEl) feedbackEl.textContent = ""; }
    
    function setFeedback(text, kind){ 
        if(!feedbackEl) return;
        feedbackEl.textContent = text;
        if(kind === 'ok'){ feedbackEl.style.color = 'var(--ok)' }
        else if(kind === 'bad'){ feedbackEl.style.color = 'var(--bad)' }
        else { feedbackEl.style.color = 'var(--text-color)' }
    }

    function disableOptions(selector) { 
        document.querySelectorAll(selector).forEach(el => el.classList.add('disabled')); 
    }
    
    function next(){ 
        if (!stageProgress[currentStage]) {
            setFeedback("¡Termina esta parte antes de continuar!", 'bad');
            soundSystem.play('error');
            return;
        }

        soundSystem.play('whoosh');

        if (currentStage === 4) {
             setTimeout(() => {
                 alert(`✅ Módulo 2 Completado! Volviendo al Módulo 2...`);
                 window.location.href = MAIN_SCREEN_URL; 
             }, 300);
             return; 
        }
        currentStage++;
        if (currentStage >= stages.length) { currentStage = stages.length - 1; }
        render(); 
    }

    function speakText(text, lang='es-ES'){ 
        if(!window.speechSynthesis) return;
        const u = new SpeechSynthesisUtterance(text);
        u.lang = lang;
        window.speechSynthesis.cancel();
        window.speechSynthesis.speak(u);
    }
    
    function playAudio(audioFilename, text, lang = 'cho') {
        const audioUrl = `../assets/audio/${audioFilename}`; 
        const audio = new Audio(audioUrl);
        
        audio.play()
            .then(() => {
                setFeedback(`🔊 Reproduciendo: "${text}"`, 'neutral');
            })
            .catch(e => {
                console.error(`❌ Error al cargar o reproducir "${audioUrl}": ${e.message}`);
                speakText(text, lang); 
                setFeedback(`[TTS] No se encontró el audio real. Reproduciendo: "${text}"`, 'neutral');
            });
    }

    function createAudioButton(text, audioFilename, lang = 'cho') {
        const btn = document.createElement('button');
        btn.className = 'ghost audio-btn';
        btn.innerHTML = '🔊 Reproducir Audio';
        btn.onclick = () => { playAudio(audioFilename, text, lang); };
        return btn;
    }

    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    function render(){ 
        clearFeedback(); 
        setStageComplete(false);
        const container = document.getElementById('stageArea'); 
        container.innerHTML=''; 

        const titles = ['M2 - Tema 4: Animales', 'Actividad 1: Sonido y Adivinanza', 'Actividad 2: Empareja la Palabra', 'Actividad 3: Escucha y Traduce', '¡Módulo 2 Terminado!'];
        titleEl.textContent = titles[currentStage];

        stages[currentStage](container);
        
        if (currentStage === 0 || currentStage === 4) { setStageComplete(true); }
    }

    function renderStage0(container){
        const videoHtml = `
            <div class="video-wrapper">
                <iframe src="https://www.youtube.com/embed/RUTAS_PENDIENTES?rel=0" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
            </div>
            <p style="text-align:center; max-width: 600px; margin-top: 20px;">
                ¡Bienvenido a Animales! Mira el video para conocer los animales de la comunidad en Ch'ol.
            </p>
        `;
        container.innerHTML = videoHtml;
        setStageComplete(true);
        renderControls();
    }

    const stage1Data = [
        { audio_file: "sonido_perro.mp3", correct: "perro.png", options: ["perro.png", "vaca.png", "pato.png"], word: "Perro (Ts´i´)" },
        { audio_file: "sonido_vaca.mp3", correct: "vaca.png", options: ["vaca.png", "caballo.png", "pez.png"], word: "Vaca (Wakax)" },
        { audio_file: "sonido_gallo.mp3", correct: "gallo.png", options: ["gallo.png", "gallina.png", "cerdo.png"], word: "Gallo (Tyaty muty)" },
    ];
    let currentRound1 = 0; 

    function playAnimalSound(filename) {
        const audioUrl = `../assets/audio/${filename}`; 
        try { 
            const audio = new Audio(audioUrl);
            audio.play();
            setFeedback(`Escuchando el sonido...`, 'neutral');
        } catch (e) { 
            console.error(`❌ Error al cargar sonido: "${audioUrl}": ${e.message}`);
            setFeedback(`Error: Sonido no encontrado.`, 'bad');
        }
    }

    function checkAnswer1(selectedImage, currentData, allOptionsElements, selectedElement) {
        if (selectedImage === currentData.correct) {
            setFeedback(`¡Correcto! Es el ${currentData.word}.`, 'ok');
            handleCorrectAnswer(selectedElement);
            
            stage1Attempts = 0;
            currentRound1++;
            setTimeout(() => {
                renderStage1(document.getElementById('stageArea'));
            }, 1500);
        } else {
            stage1Attempts++;
            if (stage1Attempts < stage1MaxAttempts) {
                handleIncorrectAnswer(selectedElement);
                setFeedback(`Incorrecto. Te quedan ${stage1MaxAttempts - stage1Attempts} intentos.`, 'bad');
                
                setTimeout(() => {
                    allOptionsElements.forEach(el => {
                        el.classList.remove('disabled', 'bad');
                        el.style.pointerEvents = 'auto';
                    });
                    setFeedback('Escucha el sonido de nuevo e intenta.', 'neutral');
                }, 1500);
            } else {
                handleIncorrectAnswer(selectedElement);
                setFeedback('Incorrecto. La respuesta correcta era: ' + currentData.word, 'bad');
                
                allOptionsElements.forEach(el => { 
                    if (el.dataset.img === currentData.correct) { 
                        el.classList.add('ok'); 
                    } 
                });
                
                stage1Attempts = 0;
                currentRound1++;
                setTimeout(() => {
                    renderStage1(document.getElementById('stageArea'));
                }, 2500);
            }
        }
    }

    function renderStage1(container) {
        if (currentRound1 >= stage1Data.length) {
            container.innerHTML = `<h2 style="color: var(--ok);">¡Felicidades! Adivinaste todos los animales.</h2>`;
            setStageComplete(true);
            renderControls();
            earnStar(container);
            return;
        }
        const currentData = stage1Data[currentRound1];
        const attemptsInfo = stage1MaxAttempts > 1 ? `(Tienes ${stage1MaxAttempts} intentos)` : '';

        container.innerHTML = `<p class="stage0-info">Ronda ${currentRound1 + 1} de ${stage1Data.length}: Toca el altavoz y selecciona el animal que emite ese sonido. ${attemptsInfo}</p>`;

        const soundBtn = document.createElement('button');
        soundBtn.className = 'ghost audio-btn';
        soundBtn.innerHTML = '🔊 Tocar Sonido';
        soundBtn.onclick = () => { playAnimalSound(currentData.audio_file); };
        renderControls();

        const buttonWrapper = document.createElement('div');
        buttonWrapper.style.cssText = "display: flex; gap: 15px; justify-content: center; margin-bottom: 20px;";
        buttonWrapper.appendChild(soundBtn);

        const feedbackEl = document.getElementById('feedback');
        if (controlsArea) {
            controlsArea.insertBefore(buttonWrapper, feedbackEl.nextSibling); 
        }
        
        const row = document.createElement('div');
        row.className = 'options-row';
        currentData.options.sort(() => Math.random() - 0.5); 

        currentData.options.forEach(opt => {
            const b = document.createElement('div');
            b.className = 'opt img-option'; 
            b.dataset.img = opt;
            
            b.innerHTML = `<img src="../assets/img/${opt}" alt="Animal"/>`; 
            
            b.onclick = () => {
                const allOptions = document.querySelectorAll('.img-option');
                disableOptions('.img-option');
                
                if (opt === currentData.correct) {
                    b.classList.add('ok');
                } else {
                    b.classList.add('bad');
                }
                
                checkAnswer1(opt, currentData, allOptions, b);
            };
            row.appendChild(b);
        });

        container.appendChild(row);
        setStageComplete(false); 
    }
    
    const stage2Pairs = [
        { chol: 'Ts´i´', es: 'Perro' }, 
        { chol: 'Wakax', es: 'Vaca' }, 
        { chol: 'Kawayu´', es: 'Caballo' }, 
        { chol: 'Chäy', es: 'Pez' }, 
    ];
    
    let selectedQuestionStage2 = null;
    let matchedPairsCountStage2 = 0;

    function handleStage2QuestionClick(cardEl, itemData) {
        soundSystem.play('click');
        if (cardEl.classList.contains('selected')) {
            cardEl.classList.remove('selected');
            selectedQuestionStage2 = null;
            setFeedback('Selecciona una palabra en Ch\'ol y luego su traducción.', 'neutral');
            return;
        }
        document.querySelectorAll('.questions-stack .matching-card.selected').forEach(el => el.classList.remove('selected'));
        cardEl.classList.add('selected');
        selectedQuestionStage2 = itemData;
        setFeedback(`Seleccionaste ${itemData.chol}. ¡Ahora elige su traducción!`, 'neutral');
    }

    function handleStage2AnswerClick(cardEl, itemData) {
        soundSystem.play('click');
        if (!selectedQuestionStage2) {
            setFeedback('Selecciona primero una palabra Ch\'ol.', 'bad');
            visualEffects.shake(cardEl);
            return;
        }

        const questionCardEl = document.querySelector(`.questions-stack .matching-card[data-chol="${selectedQuestionStage2.chol}"]`);

        if (selectedQuestionStage2.es === itemData.es) {
            setFeedback('¡Emparejamiento Correcto!', 'ok');
            soundSystem.play('success');
            
            cardEl.classList.add('matched');
            questionCardEl.classList.add('matched');
            cardEl.classList.remove('shaking'); 
            questionCardEl.classList.remove('shaking', 'selected');
            
            selectedQuestionStage2 = null;
            matchedPairsCountStage2++;

            if (matchedPairsCountStage2 === stage2Pairs.length) {
                setTimeout(() => {
                    setFeedback('¡Felicidades! Todos los pares son correctos.', 'ok');
                    setStageComplete(true);
                    earnStar(document.getElementById('stageArea'));
                }, 500);
            }
        } else {
            setFeedback('Incorrecto. Intenta de nuevo.', 'bad');
            soundSystem.play('error');
            
            cardEl.classList.add('shaking');
            questionCardEl.classList.add('shaking');
            
            setTimeout(() => {
                cardEl.classList.remove('shaking');
                questionCardEl.classList.remove('shaking');
            }, 500);
        }
    }

    function renderStage2(container){
        renderControls();
        matchedPairsCountStage2 = 0;
        selectedQuestionStage2 = null;

        const questions = stage2Pairs.map(d => ({ chol: d.chol, es: d.es }));
        const answers = stage2Pairs.map(d => ({ chol: d.chol, es: d.es }));
        
        shuffleArray(questions);
        shuffleArray(answers);

        container.innerHTML = `<p class="stage0-info">Haz clic en el Animal en Ch'ol (Izquierda) y luego en su Significado (Derecha) para unirlos.</p>`;

        const matchingContainer = document.createElement('div');
        matchingContainer.className = 'matching-click-container';

        const questionsStack = document.createElement('div');
        questionsStack.className = 'questions-stack';
        questionsStack.innerHTML = `<p class="stack-title">Ch'ol</p>`;
        
        questions.forEach(q => {
            const cardEl = document.createElement('div');
            cardEl.className = 'matching-card';
            cardEl.textContent = q.chol;
            cardEl.dataset.chol = q.chol;
            cardEl.onclick = () => handleStage2QuestionClick(cardEl, q);
            questionsStack.appendChild(cardEl);
        });

        const answersStack = document.createElement('div');
        answersStack.className = 'answers-stack';
        answersStack.innerHTML = `<p class="stack-title">Español</p>`;

        answers.forEach(a => {
            const cardEl = document.createElement('div');
            cardEl.className = 'matching-card';
            cardEl.textContent = a.es;
            cardEl.onclick = () => handleStage2AnswerClick(cardEl, a);
            answersStack.appendChild(cardEl);
        });

        matchingContainer.appendChild(questionsStack);
        matchingContainer.appendChild(answersStack);
        container.appendChild(matchingContainer);
        setFeedback('Selecciona una palabra y su traducción.', 'neutral');
        setStageComplete(false);
    }
    
    const stage3Data = [
        { audio: "Pech", filename: "pato.mp3", correct: "Pato", options: ["Pato", "Pez", "Vaca", "Caballo"] },
        { audio: "Ña´ muty", filename: "Gallina.mp3", correct: "Gallina", options: ["Gallo", "Pollito", "Gallina", "Pavo"] },
        { audio: "Ajtso´", filename: "pavo.mp3", correct: "Pavo", options: ["Pez", "Pato", "Perro", "Pavo"] },
    ];
    let currentRound3 = 0; 

    function checkAnswer3(selectedOption, currentData, allOptionsElements, selectedElement) {
        if (selectedOption === currentData.correct) {
            setFeedback('¡Muy bien! ¡Correcto!', 'ok');
            handleCorrectAnswer(selectedElement);
            
            stage3Attempts = 0;
            currentRound3++;
            setTimeout(() => {
                renderStage3(document.getElementById('stageArea'));
            }, 1500);
        } else {
            stage3Attempts++;
            if(stage3Attempts < stage3MaxAttempts) {
                handleIncorrectAnswer(selectedElement);
                setFeedback(`Incorrecto. Te quedan ${stage3MaxAttempts - stage3Attempts} intentos.`, 'bad');
                
                setTimeout(() => {
                    allOptionsElements.forEach(el => {
                        el.classList.remove('disabled', 'bad');
                        el.style.pointerEvents = 'auto';
                    });
                    setFeedback('Intenta de nuevo.', 'neutral');
                }, 1500);
            } else {
                handleIncorrectAnswer(selectedElement);
                setFeedback('Incorrecto. La respuesta correcta era: ' + currentData.correct, 'bad');
                
                allOptionsElements.forEach(el => { 
                    if (el.textContent === currentData.correct) { 
                        el.classList.add('ok'); 
                    } 
                });
                
                stage3Attempts = 0;
                currentRound3++;
                setTimeout(() => {
                    renderStage3(document.getElementById('stageArea'));
                }, 2500);
            }
        }
    }

    function renderStage3(container) {
        if (currentRound3 >= stage3Data.length) {
            container.innerHTML = `<h2 style="color: var(--ok);">¡Felicidades! Completaste la traducción de animales.</h2>`;
            setStageComplete(true);
            renderControls();
            earnStar(container);
            return;
        }
        const currentData = stage3Data[currentRound3];
        const attemptsInfo = stage3MaxAttempts > 1 ? `(Tienes ${stage3MaxAttempts} intentos)` : '';

        container.innerHTML = `<p class="stage0-info">Ronda ${currentRound3 + 1} de ${stage3Data.length}: Escucha el animal en Ch'ol y selecciona la **traducción**. ${attemptsInfo}</p>`;

        const audioBtn = createAudioButton(currentData.audio, currentData.filename, 'cho'); 
        renderControls();
        const buttonWrapper = document.createElement('div');
        buttonWrapper.style.cssText = "display: flex; gap: 15px; justify-content: center; margin-bottom: 20px;";
        buttonWrapper.appendChild(audioBtn);

        const feedbackEl = document.getElementById('feedback');
        if (controlsArea) {
            controlsArea.insertBefore(buttonWrapper, feedbackEl.nextSibling); 
        }
        
        const row = document.createElement('div');
        row.className = 'options-row';
        currentData.options.sort(() => Math.random() - 0.5); 

        currentData.options.forEach(opt => {
            const b = document.createElement('div');
            b.className = 'opt';
            b.textContent = opt;
            
            b.onclick = () => {
                const allOptions = document.querySelectorAll('.opt');
                disableOptions('.opt'); 
                
                if (opt === currentData.correct) {
                    b.classList.add('ok');
                } else {
                    b.classList.add('bad');
                }
                
                checkAnswer3(opt, currentData, allOptions, b);
            };
            row.appendChild(b);
        });

        container.appendChild(row);
        setStageComplete(false); 
    }
    
    function renderStage4(container) {
        container.innerHTML = `
            <div style="text-align: center; padding: 40px; border: 5px dashed var(--ok); border-radius: 20px; background-color: rgba(255,255,255,0.9);">
                <h2 style="color: var(--ok); font-size: 2.5rem; margin-bottom: 20px;">🎉 ¡Módulo 2: Donde Vivo, COMPLETADO! 🎉</h2>
                <p style="font-size: 1.5rem; font-weight: bold;">Puntuación simulada: ${userScore}/${TOTAL_ACTIVITY_POINTS}</p>
                <p style="margin-top: 15px;">¡Has terminado la unidad! Presiona Siguiente para volver a la pantalla de módulos.</p>
            </div>
        `;
        
        try {
            if (window.visualEffects && typeof window.visualEffects.confetti === 'function') {
                window.visualEffects.confetti();
            } else if (typeof celebrateLevelComplete === 'function') {
                celebrateLevelComplete();
            }
        } catch (e) {
            console.log("Efectos visuales no disponibles");
        }

        guardarProgresoEnBD();
        setStageComplete(true);
        renderControls();
    }

    function guardarProgresoEnBD() {
        fetch('../../backend/api/progress.php', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                tema_id: TEMA_ID,
                completado: true
            })
        })
        .then(response => response.json())
        .then(data => {
            console.log("Progreso guardado:", data);
            if(data.success && window.collectCoin) {
                collectCoin();
            }
        })
        .catch(error => console.error('Error al guardar:', error));
    }

    document.addEventListener('DOMContentLoaded', () => {
        render();
    });
</script>
</body>
</html>
