<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Ch'ol App - Tema 4: Animales</title>
    
    <link rel="stylesheet" href="../assets/css/styles.css">

</head>
<body>
    <div class="app" role="application" aria-label="Prototipo actividades para primaria">
        <header>
            <h1 id="title">M2 - Tema 4: Animales</h1>
            <div style="display: flex; gap: 10px;">
                <button class="ghost" onclick="goHome()" style="font-weight: 500; padding: 10px;">🏠 Inicio</button>
                <button class="primary" id="nextBtn" onclick="next()">Siguiente</button>
            </div>
        </header>

        <main class="stage-area" id="stageArea"></main>

        <div class="controls" id="controlsArea">
             </div>

        <footer>Prototipo educativo · Módulo 2: Donde Vivo</footer>
    </div>
    
    <div class="ground-sim"></div>

<script>
    // ************************************************************************
    // CONFIGURACIÓN (RUTAS MÓDULO 2)
    const MAIN_SCREEN_URL = '../U2/U2DOVI.html'; 
    const USER_GOOGLE_ID = 'ID_DEL_USUARIO_AUTENTICADO';
    const TOTAL_ACTIVITY_POINTS = 30; 
    // ************************************************************************
    
    function goHome() { window.location.href = MAIN_SCREEN_URL; }

    // VARIABLES y FLUJO
    const stages = [renderStage0, renderStage1, renderStage2, renderStage3, renderStage4]; 
    let currentStage = 0;
    let feedbackEl = null; 
    const titleEl = document.getElementById('title');
    const nextBtn = document.getElementById('nextBtn');
    const controlsArea = document.getElementById('controlsArea');
    let stageProgress = new Array(stages.length).fill(false); 
    let userScore = 0;

    // Lógica de Puntuación y Flujo (Unificada)
    function setStageComplete(isComplete = true) {
        if (isComplete && !stageProgress[currentStage]) {
            if(currentStage >= 1 && currentStage <= 3) { userScore += 10; }
        }
        stageProgress[currentStage] = isComplete;
        nextBtn.classList.toggle('active', isComplete);
    }
    
    // FUNCIÓN CRÍTICA DE RENDER CONTROL
    function renderControls(html = '') {
        controlsArea.innerHTML = `<div id="feedback" class="feedback"></div>${html}`;
        feedbackEl = document.getElementById('feedback');
    }
    
    function clearFeedback(){ if(feedbackEl) feedbackEl.textContent = ""; }
    function setFeedback(text, kind){ 
        if(!feedbackEl) return;
        feedbackEl.textContent = text;
        if(kind === 'ok'){ feedbackEl.style.color = 'var(--ok)' }
        else if(kind === 'bad'){ feedbackEl.style.color = 'var(--bad)' }
        else { feedbackEl.style.color = 'var(--text-color)' }
    }
    function disableOptions() { document.querySelectorAll('.opt, .word-option').forEach(el => el.classList.add('disabled')); }
    
    function next(){ 
        if (!stageProgress[currentStage]) {
            setFeedback("¡Termina esta parte antes de continuar!", 'bad');
            return;
        }
        if (currentStage === 4) {
             alert(`✅ Módulo 2 Completado! Puntuación simulada: ${userScore}/${TOTAL_ACTIVITY_POINTS}. Volviendo al Módulo 2...`);
             window.location.href = MAIN_SCREEN_URL; 
             return; 
        }
        currentStage++;
        if (currentStage >= stages.length) { currentStage = stages.length - 1; }
        render(); 
    }

    function speakText(text, lang='es-ES'){ 
        if(!window.speechSynthesis) return;
        const u = new SpeechSynthesisUtterance(text);
        u.lang = lang;
        window.speechSynthesis.cancel();
        window.speechSynthesis.speak(u);
    }
    
    // COMENTARIO: FUNCIÓN DE AUDIO MEJORADA (Manejo de Promise para diagnóstico)
    function playAudio(audioFilename, text, lang = 'cho') {
        // COMENTARIO: Se corrige la ruta a la ruta relativa correcta (../assets/audio)
        const audioUrl = `../assets/audio/${audioFilename}`; 
        
        const audio = new Audio(audioUrl);
        
        audio.play()
            .then(() => {
                setFeedback(`🔊 Reproduciendo: "${text}"`, 'neutral');
            })
            .catch(e => {
                // COMENTARIO: Si el archivo no carga (404 o formato), este error aparecerá en la Consola.
                console.error(`❌ Error al cargar o reproducir "${audioUrl}": ${e.message}`);
                speakText(text, lang); 
                setFeedback(`[TTS] No se encontró el audio real. Reproduciendo: "${text}"`, 'neutral');
            });
    }

    // COMENTARIO: createAudioButton se mueve al ámbito global para evitar ReferenceError.
    function createAudioButton(text, audioFilename, lang = 'cho') {
        const btn = document.createElement('button');
        btn.className = 'ghost';
        btn.innerHTML = '🔊 Reproducir Audio';
        btn.onclick = () => { playAudio(audioFilename, text, lang); };
        return btn;
    }

    function render(){ 
        clearFeedback(); 
        setStageComplete(false);
        const container = document.getElementById('stageArea'); 
        container.innerHTML=''; 

        const titles = ['M2 - Tema 4: Animales', 'Actividad 1: Sonido y Adivinanza', 'Actividad 2: Unir Ch\'ol con Imagen', 'Actividad 3: Escucha y Traduce', '¡Módulo 2 Terminado!'];
        titleEl.textContent = titles[currentStage];

        stages[currentStage](container);
        
        if (currentStage === 0 || currentStage === 4) { setStageComplete(true); }
    }

    // =======================================================================
    // 0 - MINI-CLASE (VIDEO INTRO)
    // =======================================================================
    function renderStage0(container){
        const videoHtml = `
            <div class="video-wrapper">
                <iframe src="https://www.youtube.com/embed/dQw4w9WgXcQ?rel=0" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
            </div>
            <p style="text-align:center; max-width: 600px; margin-top: 20px;">
                ¡Bienvenido a Animales! Mira el video para conocer los animales de la comunidad en Ch'ol.
            </p>
        `;
        container.innerHTML = videoHtml;
        setStageComplete(true);
        renderControls();
    }

    // =======================================================================
    // 1 - ACTIVIDAD 1: SONIDO Y ADIVINANZA (NUEVA ACTIVIDAD)
    // =======================================================================
    const stage1Data = [
        // COMENTARIO: NOMBRES DE ARCHIVO ESTANDARIZADOS A MINÚSCULAS
        { audio_file: "sonido_perro.mp3", correct: "tsi.png", options: ["tsi.png", "wakax.png", "pech.png"], word: "Perro (Ts´i´)" },
        { audio_file: "sonido_vaca.mp3", correct: "wakax.png", options: ["wakax.png", "kawayu.png", "chay.png"], word: "Vaca (Wakax)" },
        { audio_file: "sonido_gallo.mp3", correct: "tyaty_muty.png", options: ["tyaty_muty.png", "ña_muty.png", "ajtso.png"], word: "Gallo (Tyaty muty)" },
    ];
    let currentRound1 = 0; 

    // FUNCIÓN DE REPRODUCCIÓN DE SONIDO DE ANIMAL
    // COMENTARIO: Esta función se mantiene separada porque reproduce sonidos de animales, no frases Ch'ol.
    function playAnimalSound(filename) {
        const audioUrl = `../assets/audio/${filename}`; 
        try { 
            const audio = new Audio(audioUrl);
            audio.play();
            setFeedback(`Escuchando el sonido...`, 'neutral');
        } catch (e) { 
            console.error(`❌ Error al cargar sonido: "${audioUrl}": ${e.message}`);
            setFeedback(`Error: Sonido no encontrado.`, 'bad');
        }
    }

    function checkAnswer1(selectedImage, currentData) {
        if (selectedImage === currentData.correct) {
            setFeedback(`¡Correcto! Es el ${currentData.word}.`, 'ok');
        } else {
            setFeedback('Incorrecto. La figura correcta es ' + currentData.word + '!', 'bad');
            document.querySelectorAll('.img-option').forEach(el => { if (el.dataset.img === currentData.correct) { el.classList.add('ok'); } el.classList.add('disabled'); });
        }
        currentRound1++;
        setTimeout(() => renderStage1(document.getElementById('stageArea')), selectedImage === currentData.correct ? 1200 : 2500);
    }

    function renderStage1(container) {
        if (currentRound1 >= stage1Data.length) {
            container.innerHTML = `<h2 style="color: var(--ok);">¡Felicidades! Adivinaste todos los animales.</h2>`;
            setStageComplete(true);
            renderControls();
            return;
        }
        const currentData = stage1Data[currentRound1];
        container.innerHTML = `<p class="stage0-info">Ronda ${currentRound1 + 1} de ${stage1Data.length}: Toca el altavoz y selecciona el animal que emite ese sonido.</p>`;

        // 1. Crear el botón como objeto DOM
        const soundBtn = document.createElement('button');
        soundBtn.className = 'ghost';
        soundBtn.innerHTML = '🔊 Tocar Sonido';
        soundBtn.onclick = () => { playAnimalSound(currentData.audio_file); };
        
        // 2. Inicializar el controlsArea (solo con el feedback)
        renderControls();

        // 3. Crear contenedor de centrado para el botón
        const buttonWrapper = document.createElement('div');
        buttonWrapper.style.cssText = "display: flex; gap: 15px; justify-content: center; margin-bottom: 20px;";
        buttonWrapper.appendChild(soundBtn);

        // COMENTARIO: CORRECCIÓN DE DOM. Se inserta el objeto DOM (buttonWrapper) directamente.
        const feedbackEl = document.getElementById('feedback');
        if (controlsArea) {
            controlsArea.insertBefore(buttonWrapper, feedbackEl.nextSibling); 
        }
        
        const row = document.createElement('div');
        row.className = 'options-row';
        currentData.options.sort(() => Math.random() - 0.5); 

        currentData.options.forEach(opt => {
            const b = document.createElement('div');
            b.className = 'opt img-option'; 
            b.dataset.img = opt;
            
            // COMENTARIO: RUTA DE IMAGEN CORREGIDA
            b.innerHTML = `<img src="../assets/img/${opt}" alt="Animal"/>`; 
            
            b.onclick = () => {
                disableOptions(); 
                if (opt !== currentData.correct) { b.classList.add('bad'); }
                checkAnswer1(opt, currentData);
            };
            row.appendChild(b);
        });

        container.appendChild(row);
        setStageComplete(false); 
    }
    
    // =======================================================================
    // 2 - ACTIVIDAD 2: UNIR CH'OL CON IMAGEN (Matching)
    // =======================================================================
    const stage2Pairs = [
        // COMENTARIO: NOMBRES DE IMAGEN ESTANDARIZADOS
        ['Ts´i´', 'tsi.png'], 
        ['Wakax', 'wakax.png'], 
        ['Kawayu´', 'kawayu.png'], 
        ['Chäy', 'chay.png'], 
    ];
    
    // LÓGICA DE COMPROBACIÓN DE MATCHING
    function checkAllMatches2() {
        // [ ... (Lógica de Matching: checkAllMatches2 - CÓDIGO IDÉNTICO) ... ]
         const dropzones = document.querySelectorAll('.answer-dropzone');
         let allCorrect = true;
         const questionsList = document.getElementById('questionsList'); 
         
         dropzones.forEach(dz => {
             dz.classList.remove('ok', 'bad'); 
             const droppedCard = dz.querySelector('.question-card');
             const answerImg = dz.dataset.answer; 
             
             if (droppedCard) {
                 const questionText = droppedCard.dataset.question; 
                 const correctPair = stage2Pairs.find(p => p[0] === questionText);
                 
                 if (correctPair && correctPair[1] === answerImg) {
                     dz.classList.add('ok');
                     droppedCard.classList.add('matched-correct'); 
                 } else {
                     dz.classList.add('bad');
                     allCorrect = false;
                     
                     droppedCard.classList.remove('matched-correct');
                     questionsList.appendChild(droppedCard); 
                 }
             } else {
                 dz.classList.add('bad'); 
                 allCorrect = false;
             }
         });
         
         if (allCorrect) {
              setFeedback('¡Felicidades! Todos los pares son correctos.', 'ok');
              setStageComplete(true);
              document.querySelectorAll('.question-card').forEach(card => card.draggable = false);
              document.querySelector('.ghost').style.pointerEvents = 'none';
         } else {
              setFeedback('¡Revisa los rojos! Las tarjetas incorrectas regresaron para que intentes de nuevo.', 'bad');
         }
    }

    // RENDERIZADO DEL MATCHING
    function renderStage2(container){
        container.innerHTML = `<p class="stage0-info">Arrastra el **Nombre del Animal en Ch'ol** (Izquierda) a la **Imagen** correcta (Derecha).</p>`;
        
        renderControls(`<button class="ghost" onclick="checkAllMatches2()">Comprobar</button>`);
        
        const matchingContainer = document.createElement('div');
        matchingContainer.className = 'matching-container';
        
        const questionsCol = document.createElement('div');
        questionsCol.className = 'matching-column';
        questionsCol.innerHTML = '<h3>Ch\'ol (Arrastra)</h3><div id="questionsList" class="questions-list"></div>';

        const answersCol = document.createElement('div');
        answersCol.className = 'matching-column';
        answersCol.innerHTML = '<h3>Imagen (Suelta Aquí)</h3><div id="answersList"></div>';
        
        const shuffledQuestions = [...stage2Pairs].sort(() => Math.random() - 0.5); 
        const shuffledAnswers = [...stage2Pairs].map(p=>p[1]).sort(() => Math.random() - 0.5);

        const questionsList = questionsCol.querySelector('#questionsList');
        shuffledQuestions.forEach((pair, index) => {
            const questionCard = document.createElement('div');
            questionCard.className = 'question-card';
            questionCard.id = `q-card-2-${index}`;
            questionCard.draggable = true;
            questionCard.dataset.question = pair[0];
            questionCard.textContent = pair[0];
            
            // Lógica Drag-and-Drop: DRAGSTART/DRAGEND
            questionCard.addEventListener('dragstart', (e) => { e.dataTransfer.setData('text/plain', e.target.id); e.target.classList.add('dragging'); });
            questionCard.addEventListener('dragend', (e) => { e.target.classList.remove('dragging'); });
            
            questionsList.appendChild(questionCard);
        });

        const answersList = answersCol.querySelector('#answersList');
        shuffledAnswers.forEach((answerImg, index) => {
            const dropzone = document.createElement('div');
            dropzone.className = 'answer-dropzone';
            dropzone.id = `ans-dropzone-2-${index}`;
            dropzone.dataset.answer = answerImg;

            const img = document.createElement('img');
            // COMENTARIO: RUTA DE IMAGEN CORREGIDA
            img.src = `../assets/img/${answerImg}`; 
            img.alt = answerImg;
            dropzone.appendChild(img);
            
            // Lógica Drag-and-Drop: DRAGOVER/DROP
            dropzone.addEventListener('dragover', (e) => { e.preventDefault(); dropzone.classList.add('hovered'); });
            dropzone.addEventListener('dragleave', () => dropzone.classList.remove('hovered'));
            dropzone.addEventListener('drop', (e) => {
                e.preventDefault(); dropzone.classList.remove('hovered');
                const cardId = e.dataTransfer.getData('text/plain');
                const draggedCard = document.getElementById(cardId);
                
                if (dropzone.children.length > 1 && dropzone.children[1].classList.contains('question-card')) { questionsList.appendChild(dropzone.children[1]); }
                
                dropzone.appendChild(draggedCard);
                setStageComplete(false);
            });
             answersList.appendChild(dropzone);
        });

        matchingContainer.appendChild(questionsCol);
        matchingContainer.appendChild(answersCol);
        container.appendChild(matchingContainer);
        setStageComplete(false);
    }
    
    // =======================================================================
    // 3 - ACTIVIDAD 3: ESCUCHA Y TRADUCE (Palabra)
    // =======================================================================
    const stage3Data = [
        // COMENTARIO: NOMBRES DE ARCHIVO ESTANDARIZADOS A MINÚSCULAS
        { audio: "Pech", filename: "pech.mp3", correct: "Pato", options: ["Pato", "Pez", "Vaca", "Caballo"] },
        { audio: "Ña´ muty", filename: "ña_muty.mp3", correct: "Gallina", options: ["Gallo", "Pollito", "Gallina", "Pavo"] },
        { audio: "Ajtso´", filename: "ajtso.mp3", correct: "Pavo", options: ["Pez", "Pato", "Perro", "Pavo"] },
    ];
    let currentRound3 = 0; 

    function checkAnswer3(selectedOption, currentData, allOptionsElements) {
        if (selectedOption === currentData.correct) {
            setFeedback('¡Muy bien! ¡Correcto!', 'ok');
        } else {
            setFeedback('Incorrecto. ¡La respuesta correcta es: ' + currentData.correct + '!', 'bad');
            allOptionsElements.forEach(el => { if (el.textContent === currentData.correct) { el.classList.add('ok'); } });
        }
        currentRound3++;
        setTimeout(() => renderStage3(document.getElementById('stageArea')), selectedOption === currentData.correct ? 1200 : 2500);
    }

    function renderStage3(container) {
        if (currentRound3 >= stage3Data.length) {
            container.innerHTML = `<h2 style="color: var(--ok);">¡Felicidades! Completaste la traducción de animales.</h2>`;
            setStageComplete(true);
            renderControls();
            return;
        }
        const currentData = stage3Data[currentRound3];
        container.innerHTML = `<p class="stage0-info">Ronda ${currentRound3 + 1} de ${stage3Data.length}: Escucha el animal en Ch'ol y selecciona la **traducción**.</p>`;

        // 1. Crear el botón como objeto DOM
        const audioBtn = createAudioButton(currentData.audio, currentData.filename, 'cho'); 
        
        // 2. Inicializar el controlsArea (solo con el feedback)
        renderControls();
        
        // 3. Crear contenedor de centrado para el botón
        const buttonWrapper = document.createElement('div');
        buttonWrapper.style.cssText = "display: flex; gap: 15px; justify-content: center; margin-bottom: 20px;";
        buttonWrapper.appendChild(audioBtn);

        // COMENTARIO: CORRECCIÓN DE DOM. Se inserta el objeto DOM (buttonWrapper) directamente,
        // eliminando el uso de outerHTML.
        const feedbackEl = document.getElementById('feedback');
        if (controlsArea) {
            controlsArea.insertBefore(buttonWrapper, feedbackEl.nextSibling); 
        }
        
        const row = document.createElement('div');
        row.className = 'options-row';
        currentData.options.sort(() => Math.random() - 0.5); 

        currentData.options.forEach(opt => {
            const b = document.createElement('div');
            b.className = 'opt';
            b.textContent = opt;
            
            b.onclick = () => {
                disableOptions(); 
                if (opt !== currentData.correct) { b.classList.add('bad'); }
                checkAnswer3(opt, currentData, document.querySelectorAll('.opt'));
            };
            row.appendChild(b);
        });

        container.appendChild(row);
        setStageComplete(false); 
    }
    
    // =======================================================================
    // 4 - FINAL DE TEMA
    // =======================================================================
    function renderStage4(container) {
        container.innerHTML = `
            <div style="text-align: center; padding: 40px; border: 5px dashed var(--ok); border-radius: 20px;">
                <h2 style="color: var(--ok); font-size: 2.5rem;">🎉 ¡Módulo 2: Donde Vivo, COMPLETADO! 🎉</h2>
                <p style="font-size: 1.2rem;">¡Has terminado la unidad! Presiona **Siguiente** para volver a la pantalla de módulos.</p>
                <p>Puntuación simulada: **${userScore}/${TOTAL_ACTIVITY_POINTS}**</p>
            </div>
        `;
        setStageComplete(true);
        renderControls();
    }

    // --- Inicialización ---
    document.addEventListener('DOMContentLoaded', () => {
        render();
    });
</script>
</body>
</html>
