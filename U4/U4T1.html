<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Ch'ol App - Tema 1: Gustos</title>

    <link rel="stylesheet" href="../assets/css/styles.css">

</head>
<body>
    <div class="app">
        <header>
            <h1 id="title">M4 - Tema 1: Gustos</h1>
            <div style="display: flex; gap: 10px;">
                <!-- Botón de Inicio, usa el estilo 'ghost' de U1T1 -->
                <button class="ghost" onclick="goHome()" style="font-weight: 500; padding: 10px;">🏠 Inicio</button> 
            </div>
        </header>

        <main class="stage-area" id="stageArea"></main>

        <div class="controls" id="controlsArea">
            <!-- Se mantiene el área de controles, pero se quita la puntuación visible -->
            <div id="feedback" class="feedback"></div>
            <!-- El botón Siguiente se inserta mediante JS en renderControls() -->
        </div>
        
        <footer>Prototipo educativo · Módulo 4: Gustos</footer>
    </div>
    
    <div class="ground-sim"></div>


    <script>
        // ************************************************************************
        // CONFIGURACIÓN DE LA PANTALLA PRINCIPAL (UNIFICADO)
        // ************************************************************************
        const MAIN_SCREEN_URL = '../U4/U4GUPA.html';
        const TOTAL_ACTIVITY_POINTS = 180; 
        
        // Función de redirección para el botón de Inicio
        function goHome() {
            window.location.href = MAIN_SCREEN_URL;
        }

        const DATA = {
            stages: [
                { type: 'video', title: 'Mini-Clase: Frutas y Bebidas', videoUrl: 'https://www.youtube.com/embed/dQw4w9WgXcQ?rel=0' }, // URL de ejemplo, usar la real si se tiene
                { 
                    type: 'matching_click', 
                    title: 'Actividad 1: ¡Empareja los Sabores!',
                    rounds: [
                        { ch: 'Alaxax', es: 'Naranja', audio: 'audio_alaxax.mp3' },
                        { ch: 'Ja’as', es: 'Plátano', audio: 'audio_jaas.mp3' },
                        { ch: 'Sa’', es: 'Pozol', audio: 'audio_sa.mp3' },
                        { ch: 'Kajpe', es: 'Café', audio: 'audio_kajpe.mp3' },
                        { ch: 'Po’om', es: 'Ciruela', audio: 'audio_poom.mp3' },
                        { ch: 'Bu’ul', es: 'Frijol', audio: 'audio_buul.mp3' },
                    ]
                },
                { 
                    type: 'select_image_audio', 
                    title: 'Actividad 2: ¿Qué estás escuchando?',
                    rounds: [
                        { audio: 'audio_waj.mp3', correct: 'waj.png', 
                            options: [{filename: 'img1.png', word: 'Tortilla'}, {filename: 'tyumuty.png', word: 'Huevo'}, {filename: 'buul.png', word: 'Frijol'}, {filename: 'sa.png', word: 'Pozol'}] },
                        { audio: 'audio_manko.mp3', correct: 'manko.png', 
                            options: [{filename: 'limon.png', word: 'Ilmoñix'}, {filename: 'manko.png', word: 'Mango'}, {filename: 'guayaba.png', word: 'Pätya'}, {filename: 'chi.png', word: 'Nance'}] },
                        { audio: 'audio_atol.mp3', correct: 'ul.png', 
                            options: [{filename: 'cafe.png', word: 'Kajpe'}, {filename: 'xaba.png', word: 'Xä’bä'}, {filename: 'ul.png', word: 'Atol'}, {filename: 'agua.png', word: 'Ja'}] },
                        { audio: 'audio_limon.mpp3', correct: 'ilmoñix.png', 
                            options: [{filename: 'ciruela.png', word: 'Po’om'}, {filename: 'ilmoñix.png', word: 'Limón'}, {filename: 'alaxax.png', word: 'Naranja'}, {filename: 'platano.png', word: 'Ja’as'}] },
                        { audio: 'audio_camote.mp3', correct: 'ajkum.png', 
                            options: [{filename: 'yuca.png', word: 'Ts’ijñ'}, {filename: 'macal.png', word: 'Juk’'}, {filename: 'ajkum.png', word: 'Camote'}, {filename: 'calabaza.png', word: 'Ch’ujm'}] },
                        { audio: 'audio_huevo.mp3', correct: 'tyumuty.png', 
                            options: [{filename: 'buul.png', word: 'Frijol'}, {filename: 'tyumuty.png', word: 'Huevo'}, {filename: 'waj.png', word: 'Tortilla'}, {filename: 'comida.png', word: 'Bäñik’'}] },
                    ]
                },
                { 
                    type: 'multiple_choice', 
                    title: 'Actividad 3: Diálogo de Preferencias',
                    rounds: [
                        { audio: 'audio_preferencia_limon.mp3', ch: 'K-tyi’ tyi’ añet ilmoñix.', q: 'Si te gusta el limón, ¿qué dices en Ch’ol?', correct: 'K-tyi’ tyi’ añet ilmoñix.', 
                            options: ['Ma’ax k-tyi’ tyi’ añet waj.', 'K-tyi’ tyi’ añet ilmoñix.', 'K-tyi’ tyi’ añet ul.', 'Ma’ax k-tyi’ tyi’ añet sa’.'], 
                            hint: 'Me gusta/no me gusta = K-tyi’ tyi’ añet / Ma’ax k-tyi’ tyi’ añet'},
                        { audio: 'audio_preferencia_frijol.mp3', ch: 'Ma’ax k-tyi’ tyi’ añet bu’ul.', q: 'No te gusta el frijol. ¿Cuál es la frase correcta?', correct: 'Ma’ax k-tyi’ tyi’ añet bu’ul.', 
                            options: ['K-tyi’ tyi’ añet waj.', 'Ma’ax k-tyi’ tyi’ añet bu’ul.', 'K-tyi’ tyi’ añet tyumuty.', 'Ma’ax k-tyi’ tyi’ añet waj.']},
                        { audio: 'audio_preferencia_pozol.mp3', ch: 'K-tyi’ tyi’ añet sa’.', q: 'Te ofrecen pozol. Responde que sí te gusta.', correct: 'K-tyi’ tyi’ añet sa’.', 
                            options: ['K-tyi’ tyi’ añet sa’.', 'Ma’ax k-tyi’ tyi’ añet sa’.', 'Ma’ax k-tyi’ tyi’ añet kajpe.', 'K-tyi’ tyi’ añet ul.']},
                        { audio: 'audio_preferencia_fruta.mp3', ch: 'K-tyi’ tyi’ añet wuty tye’.', q: '¿Cuál dirías para indicar que te gusta la fruta (genérico)?', correct: 'K-tyi’ tyi’ añet wuty tye’.', 
                            options: ['Ma’ax k-tyi’ tyi’ añet waj.', 'K-tyi’ tyi’ añet wuty tye’.', 'Ma’ax k-tyi’ tyi’ añet bäñik’.', 'K-tyi’ tyi’ añet tyumuty.']},
                        { audio: 'audio_preferencia_huevo_neg.mp3', ch: 'Ma’ax k-tyi’ tyi’ añet tyumuty.', q: 'Si te dan un huevo frito, y no quieres, ¿qué dices?', correct: 'Ma’ax k-tyi’ tyi’ añet tyumuty.', 
                            options: ['K-tyi’ tyi’ añet tyumuty.', 'Ma’ax k-tyi’ tyi’ añet tyumuty.', 'K-tyi’ tyi’ añet waj.', 'K-tyi’ tyi’ añet bu’ul.']},
                        { audio: 'audio_preferencia_cafe.mp3', ch: 'K-tyi’ tyi’ añet kajpe.', q: 'Pregunta: "¿Te gusta el café?" Respuesta afirmativa:', correct: 'K-tyi’ tyi’ añet kajpe.', 
                            options: ['Ma’ax k-tyi’ tyi’ añet kajpe.', 'K-tyi’ tyi’ añet kajpe.', 'K-tyi’ tyi’ añet sa’.', 'Ma’ax k-tyi’ tyi’ añet ul.']},
                    ]
                },
                { type: 'final' } 
            ]
        };
        // Variables de Matching (Click Logic)
        let selectedQuestion = null; 
        let matchedPairs = 0;
        const totalPairs = DATA.stages[1].rounds.length;

        // Variables globales
        const stages = [renderStage0, renderStage1_MatchingClick, renderStage2_SelectImage, renderStage3_MultipleChoice, renderStageFinal];
        let currentStage = 0;
        let currentActivityRound = 0;
        let userScore = 0; // Se mantiene la puntuación para el guardado interno
        let stageProgress = new Array(stages.length).fill(false); // Progreso de la etapa
        let feedbackEl = null; 
        const titleEl = document.getElementById('title');
        let nextBtn = null; // Se inicializa en renderControls
        const controlsArea = document.getElementById('controlsArea');
        
        // =======================================================================
        // 1 - FUNCIONES DE CONTROL (ADAPTADAS DE U1T1)
        // =======================================================================

        function setStageComplete(isComplete) {
            stageProgress[currentStage] = isComplete;
            if(nextBtn) nextBtn.classList.toggle('active', isComplete);
        }
        
        function clearFeedback(){ 
            if(feedbackEl) feedbackEl.textContent = ""; 
        }

        function setFeedback(text, kind){
            if(!feedbackEl) return;
            feedbackEl.textContent = text;
            if(kind === 'ok'){ feedbackEl.style.color = 'var(--ok)' }
            else if(kind === 'bad'){ feedbackEl.style.color = 'var(--bad)' }
            else { feedbackEl.style.color = 'var(--color-texto)' }
            feedbackEl.style.fontSize = '1.4rem'; 
        }
        
        function disableOptions() {
             document.querySelectorAll('.opt, .img-option, .matching-card').forEach(el => {
                el.classList.add('disabled', 'prevent-click');
                el.onclick = null;
            });
            const checkBtn = document.querySelector('.controls .ghost');
            if(checkBtn) checkBtn.style.pointerEvents = 'none';
        }

        // Función para renderizar el botón Siguiente y el Feedback (tomada de U1T1)
        function renderControls(html = '') {
            controlsArea.innerHTML = `<div id="feedback" class="feedback"></div>
                                      <button class="primary" id="nextBtn" onclick="next()">Siguiente</button>${html}`;
            feedbackEl = document.getElementById('feedback'); 
            nextBtn = document.getElementById('nextBtn');
        }

        function next() {
            if (!stageProgress[currentStage]) {
                setFeedback("¡Termina esta parte antes de continuar!", 'bad');
                return;
            }

            if (currentStage === stages.length - 1) {
                // Mensaje final
                alert(`✅ Tema Terminado. Puntuación: ${userScore}/${TOTAL_ACTIVITY_POINTS}. Volviendo al Módulo 4...`);
                window.location.href = MAIN_SCREEN_URL; 
                return; 
            }

            currentStage++;
            currentActivityRound = 0;
            render();
        }
        
        function addPoints(points = 10) {
            userScore += points;
            // No se muestra la puntuación, pero se actualiza internamente
        }

        function speakText(text, lang='es-ES'){
            if(!window.speechSynthesis) return;
            const u = new SpeechSynthesisUtterance(text);
            u.lang = lang;
            window.speechSynthesis.cancel();
            window.speechSynthesis.speak(u);
        }

        function playAudio(audioFilename, text = audioFilename.replace('.mp3', ''), lang = 'cho') {
            const audioUrl = `../assets/audio/${audioFilename}`; 
            const audio = new Audio(audioUrl);
            
            audio.play()
                .then(() => { setFeedback(`🔊 Reproduciendo: "${text}"`, 'neutral'); })
                .catch(e => {
                    console.error(`❌ Error al cargar o reproducir "${audioUrl}": ${e.message}`);
                    speakText(text, lang); 
                    setFeedback(`[TTS] No se encontró el audio real. Reproduciendo: "${text}"`, 'neutral');
                });
        }
        
        // --- Pantalla de éxito de actividad (similar a U1T1) ---
        function showActivitySuccessScreen(activityTitle) {
            const container = document.getElementById('stageArea');
            container.innerHTML = `
                <div style="text-align: center; padding: 40px; background-color: var(--matching-card-bg); border-radius: 20px; border: 3px solid var(--ok); max-width: 400px; margin-top: 50px;">
                    <h2 style="color: var(--ok); font-size: 2rem;">¡Felicidades!</h2>
                    <p style="font-size: 1.1rem;">Completaste la actividad: **${activityTitle}**.</p>
                    <p style="margin-top: 20px;">Presiona **Siguiente** para continuar.</p>
                </div>
            `;
            setStageComplete(true);
        }

        function render() {
            clearFeedback(); 
            setStageComplete(false);
            const container = document.getElementById('stageArea'); 
            container.innerHTML=''; 

            // Títulos de las etapas para el H1 (similar a U1T1)
            const titles = [
                DATA.stages[0].title, 
                DATA.stages[1].title, 
                DATA.stages[2].title, 
                DATA.stages[3].title, 
                '¡Tema Terminado!'
            ];
            titleEl.textContent = titles[currentStage];

            // Renderizar la etapa actual
            stages[currentStage](container);
            
            // La Mini-Clase y la pantalla final se completan inmediatamente (como en U1T1)
            if (currentStage === 0 || currentStage === stages.length - 1) {
                setStageComplete(true);
            }
        }

        // =======================================================================
        // 2 - RENDERIZADO DE ETAPAS
        // =======================================================================
        
        // 0 - MINI-CLASE (VIDEO)
        function renderStage0(container) {
             // Se usa la estructura de video-wrapper de U1T1
             const currentData = DATA.stages[0];
             container.innerHTML = `
                <div class="video-wrapper">
                    <iframe src="${currentData.videoUrl}" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
                </div>
                <p style="text-align:center; max-width: 600px; margin-top: 20px;">
                    ¡Mira el video para aprender sobre ${currentData.title.split(': ')[1]}! Luego, presiona **Siguiente** para comenzar las actividades.
                </p>
            `;
            renderControls(); // Renderiza el botón Siguiente
        }

        // 1 - ACTIVIDAD 1: MATCHING DE CLICK (Diseño Apilado)
        function handleQuestionClick(card) {
            if (card.classList.contains('matched')) return;

            // Limpiar selección previa de pregunta
            document.querySelectorAll('.question-card.selected').forEach(q => q.classList.remove('selected'));
            
            card.classList.add('selected');
            selectedQuestion = {
                element: card,
                ch: card.dataset.ch,
                es: card.dataset.es
            };
            setFeedback(`Seleccionado: ${selectedQuestion.ch}. Ahora selecciona su traducción.`, 'neutral');
        }

        function handleAnswerClick(card) {
            if (card.classList.contains('matched')) return;

            if (!selectedQuestion) {
                setFeedback('¡Primero selecciona un elemento en Ch\'ol (arriba)!', 'bad');
                return;
            }

            const answerEs = card.dataset.es;
            
            if (selectedQuestion.es === answerEs) {
                // Coincidencia correcta
                selectedQuestion.element.classList.add('matched');
                selectedQuestion.element.classList.add('selected'); 
                card.classList.add('matched');
                card.classList.add('selected'); 
                
                matchedPairs++;
                addPoints(10); 
                
                setFeedback(`¡Correcto! ${selectedQuestion.ch} es ${answerEs}. (${matchedPairs}/${totalPairs})`, 'ok');
                
                selectedQuestion = null;
                
                if (matchedPairs === totalPairs) {
                    // Muestra la pantalla de felicitación al terminar
                    showActivitySuccessScreen(DATA.stages[1].title); 
                }

            } else {
                // Coincidencia incorrecta
                card.classList.add('bad');
                selectedQuestion.element.classList.add('bad');
                setFeedback(`Incorrecto. ${selectedQuestion.ch} no es ${answerEs}. Intenta de nuevo.`, 'bad');

                // Quitar clases después de un breve tiempo
                setTimeout(() => {
                    card.classList.remove('bad');
                    selectedQuestion.element.classList.remove('bad');
                    selectedQuestion.element.classList.remove('selected');
                    selectedQuestion = null;
                }, 800);
            }
        }

        function renderStage1_MatchingClick(container) {
            matchedPairs = 0; 
            selectedQuestion = null;
            const currentData = DATA.stages[1];
            
            container.innerHTML = `
                <p class="stage0-info">Haz clic en el **elemento en Ch'ol (arriba)** y luego en su **traducción en Español (abajo)** para formar el par.</p>
                <div class="matching-container" id="matchingContainer">
                    <div id="questionGroup" class="question-group"></div>
                    <div id="answerGroup" class="answer-group"></div>
                </div>
            `;
            
            renderControls(); // Renderiza el botón Siguiente
            
            const questionGroup = document.getElementById('questionGroup');
            const answerGroup = document.getElementById('answerGroup');

            // Asegurar que las listas esten desordenadas para el ejercicio
            const shuffledQuestions = [...currentData.rounds].sort(() => Math.random() - 0.5);
            const shuffledAnswers = [...currentData.rounds].sort(() => Math.random() - 0.5);

            // 1. Crear tarjetas de preguntas (Ch'ol)
            shuffledQuestions.forEach((pair, index) => {
                const qCard = document.createElement('div');
                qCard.className = 'matching-card question-card';
                qCard.dataset.ch = pair.ch;
                qCard.dataset.es = pair.es;
                qCard.dataset.audio = pair.audio;
                
                qCard.innerHTML = `
                    <div style="display: flex; align-items: center; gap: 5px;">
                        <span class="play-btn-icon" onclick="event.stopPropagation(); playAudio('${pair.audio}', '${pair.ch}')">▶️</span>
                        ${pair.ch}
                    </div>
                `;
                qCard.onclick = () => handleQuestionClick(qCard);
                questionGroup.appendChild(qCard);
            });

            // 2. Crear tarjetas de respuestas (Español)
            shuffledAnswers.forEach((pair, index) => {
                const aCard = document.createElement('div');
                aCard.className = 'matching-card answer-card';
                aCard.dataset.es = pair.es;
                
                aCard.innerHTML = `
                    <span style="margin-left: 20px;">${pair.es}</span>
                    <span class="zoom-icon">🔎</span>
                `;
                aCard.onclick = () => handleAnswerClick(aCard);
                answerGroup.appendChild(aCard);
            });
            
            setStageComplete(false);
        }

        // 2 - ACTIVIDAD 2: SELECCIONAR IMAGEN (Con Audio)
        function renderStage2_SelectImage(container) {
            const currentData = DATA.stages[2];
            const roundData = currentData.rounds[currentActivityRound];

            const audioBtn = document.createElement('button');
            audioBtn.className = 'audio-button';
            audioBtn.textContent = '🔊 Reproducir Audio';
            audioBtn.onclick = () => playAudio(roundData.audio, roundData.correct.replace('.png', ''));

            const buttonWrapper = document.createElement('div');
            buttonWrapper.style.cssText = "display: flex; gap: 15px; justify-content: center; margin-bottom: 20px;";
            buttonWrapper.appendChild(audioBtn);
            
            renderControls(); // Renderiza el botón Siguiente
            const feedbackElTemp = document.getElementById('feedback');

            // Inserta el botón de audio antes del botón Siguiente
            if (controlsArea && nextBtn) {
                 controlsArea.insertBefore(buttonWrapper, nextBtn); 
            }
            
            container.innerHTML = `
                <p class="stage0-info">Ronda ${currentActivityRound + 1} / ${currentData.rounds.length}. Escucha la palabra en Ch'ol y selecciona la imagen correcta.</p>
                <div class="options-row" id="imageOptionsRow"></div>
            `;
            
            const row = document.getElementById('imageOptionsRow');
            const allOptions = roundData.options.sort(() => Math.random() - 0.5);

            allOptions.forEach(item => {
                const b = document.createElement('div');
                b.className = 'img-option';
                b.dataset.img = item.filename;
                
                b.innerHTML = `<img src="../assets/img/${item.filename}" alt="${item.word}" />
                                <p>${item.word}</p>`; 
                
                b.onclick = () => {
                    disableOptions(); 
                    
                    if (item.filename === roundData.correct) { 
                        b.classList.add('ok');
                        addPoints(10);
                    } else { 
                        b.classList.add('bad');
                        // Muestra la opción correcta
                        const correctEl = document.querySelector(`.img-option[data-img="${roundData.correct}"]`);
                        if(correctEl) correctEl.classList.add('ok');
                    }
                    
                    currentActivityRound++;

                    setTimeout(() => {
                        if (currentActivityRound < currentData.rounds.length) {
                            render();
                        } else {
                            showActivitySuccessScreen(DATA.stages[2].title);
                        }
                    }, 1500);
                };
                row.appendChild(b);
            });
            setStageComplete(false);
        }

        // 3 - ACTIVIDAD 3: OPCIÓN MÚLTIPLE (Con Audio y Título Modificado)
        function renderStage3_MultipleChoice(container) {
            const currentData = DATA.stages[3];
            const roundData = currentData.rounds[currentActivityRound];
            
            // Usamos la pregunta específica de la ronda
            const questionTitle = roundData.q;
            
            const audioBtn = document.createElement('button');
            audioBtn.className = 'audio-button';
            audioBtn.textContent = '🔊 Reproducir Audio';
            audioBtn.onclick = () => playAudio(roundData.audio, roundData.ch);

            const buttonWrapper = document.createElement('div');
            buttonWrapper.style.cssText = "display: flex; gap: 15px; justify-content: center; margin-bottom: 20px;";
            buttonWrapper.appendChild(audioBtn);
            
            renderControls(); // Renderiza el botón Siguiente
            const feedbackElTemp = document.getElementById('feedback');

            // Inserta el botón de audio antes del botón Siguiente
            if (controlsArea && nextBtn) {
                 controlsArea.insertBefore(buttonWrapper, nextBtn); 
            }

            container.innerHTML = `
                <p class="stage0-info">Ronda ${currentActivityRound + 1} / ${currentData.rounds.length}</p>
                <p style="font-size: 1.2rem; font-weight: 700;">${questionTitle}</p>
                ${roundData.hint ? `<p style="font-style: italic; color: var(--accent); text-align: center;">Pista: ${roundData.hint}</p>` : ''}
                <div class="options-row" id="optionsContainer" style="margin-top: 20px;"></div>
            `;

            const optionsContainer = document.getElementById('optionsContainer');
            const allOptions = roundData.options.sort(() => Math.random() - 0.5);
            
            allOptions.forEach(opt => {
                const b = document.createElement('div');
                b.className = 'opt';
                b.textContent = opt;
                
                b.onclick = () => {
                    disableOptions(); 

                    if (opt === roundData.correct) { 
                        b.classList.add('ok');
                        addPoints(10);
                    } else { 
                        b.classList.add('bad'); 
                        document.querySelectorAll('.opt').forEach(btn => {
                            if (btn.textContent === roundData.correct) {
                                btn.classList.add('ok');
                            }
                        });
                    }
                    
                    currentActivityRound++;
                    setTimeout(() => {
                        if (currentActivityRound < currentData.rounds.length) {
                            render();
                        } else {
                            showActivitySuccessScreen(DATA.stages[3].title);
                        }
                    }, 1500);
                };
                optionsContainer.appendChild(b);
            });
            setStageComplete(false); 
        }

        // 4 - FINAL DE TEMA (UNIFICADO)
        function renderStageFinal(container) {
            container.innerHTML = `
                <div style="text-align: center; padding: 40px; border: 5px dashed var(--ok); border-radius: 20px;">
                    <h2 style="color: var(--ok); font-size: 2.5rem;">🎉 ¡Tema 1: Gustos Completado! 🎉</h2>
                    <p style="font-size: 1.2rem;">Puntuación total: **${userScore} / ${TOTAL_ACTIVITY_POINTS}**</p>
                    <p>¡Excelente trabajo! Presiona **Siguiente** para volver a la pantalla de módulos.</p>
                </div>
            `;
            // El botón 'Siguiente' ya está renderizado y configurado para ir a MAIN_SCREEN_URL en la función 'next'.
            // Solo aseguramos que se marque como completo.
            setStageComplete(true);
            renderControls(); 
        }


        // --- Inicialización ---
        document.addEventListener('DOMContentLoaded', () => {
            renderControls(); // Inicializa el área de controles y el botón 'Siguiente'
            render();
        });
    </script>
</body>
</html>
