<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Tema 3: Mi Mundo</title>

    <link rel="stylesheet" href="../assets/css/styles.css">
    <link rel="stylesheet" href="../assets/css/enhanced-styles.css">

    <style>

        button.primary {
            opacity: 0.5;
            pointer-events: none;
        }
        button.primary.active {
            opacity: 1;
            pointer-events: auto;
        }

        .opt {
            min-width: 140px; 
            padding: 15px; 
            border-radius: 20px; 
            background: #fff; 
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px; 
            cursor: pointer; 
            border: 4px solid #E0E0E0;
            font-size: 1.1rem; 
            font-weight: 600; 
            transition: all .2s;
            text-align: center;
        }

        .opt:hover:not(.disabled) {
            transform: translateY(-5px); 
            border-color: var(--accent);
        }

        .opt.disabled { 
            pointer-events: none; 
            opacity: 0.7; 
            cursor: default;
        }

        .image-target-wrapper {
            width: 100%;
            display: flex; 
            justify-content: center; 
            margin-bottom: 25px;
        }

        .image-target {
            max-width: 300px; 
            height: 200px; 
            border: 5px solid var(--accent);
            border-radius: 20px;
            overflow: hidden;
            background: white;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        .image-target img {
            width: 100%;
            height: 100%;
            object-fit: contain; 
        }

        .matching-click-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
            max-width: 700px;
            padding: 25px;
            background-color: #FFF; 
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            border: 4px solid #E0E0E0;
        }

        .matching-card {
            background-color: #F5F5F5;
            border-radius: 15px;
            padding: 15px 20px;
            font-weight: 700;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 0 rgba(0,0,0,0.1);
            border: 2px solid #E0E0E0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 60px;
            text-align: center;
        }

        .matching-card:hover:not(.matched):not(.selected) {
            transform: translateY(-2px);
            border-color: var(--accent);
            background-color: #FFF;
        }

        .matching-card.selected {
            border-color: var(--accent);
            background-color: #E3F2FD;
            color: var(--accent);
            transform: translateY(-2px);
        }

        .matching-card.matched {
            background-color: var(--ok);
            color: white;
            pointer-events: none;
            cursor: default;
            box-shadow: none;
            border-color: var(--ok);
            animation: pop 0.3s ease-out;
        }

        .matching-card.shaking {
            animation: shake 0.5s;
            border-color: var(--bad) !important;
            background-color: #FFEBEE !important;
            color: var(--bad);
        }

        @keyframes pop {
            0% { transform: scale(0.8); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        .questions-stack, .answers-stack {
            display: flex;
            flex-direction: column;
            gap: 12px;
            flex: 1;
        }

        .stack-title {
            font-weight: 800;
            font-size: 1.2rem;
            color: var(--text-color);
            margin-bottom: 10px;
            text-align: center;
            text-transform: uppercase;
        }

        @media (min-width: 601px) {
            .matching-click-container {
                flex-direction: row;
                justify-content: space-between;
            }
        }
    </style>
</head>
<body>
    <div class="app" role="application" aria-label="Prototipo actividades para primaria">
        <header>
            <h1 id="title">Mini-Clase: Números y Clima</h1>
            <div style="display: flex; gap: 10px;">
                <button class="ghost" onclick="goHome()" style="font-weight: 500; padding: 10px;">🏠 Inicio</button>
                <button class="primary" id="nextBtn" onclick="next()">Siguiente</button>
            </div>
        </header>

        <main class="stage-area" id="stageArea"></main>

        <div class="controls" id="controlsArea"></div>

        <footer>Prototipo educativo · Módulo 4: Tema 3</footer>
    </div>

    <div class="ground-sim"></div>

    <script src="../assets/js/sound-effects.js"></script>

<script>
    const TEMA_ID = 13;
    const MAIN_SCREEN_URL = '../U4/U4GUPA.html'; 
    const TOTAL_ACTIVITY_POINTS = 180; 
    
    let stage1Attempts = 0;
    const stage1MaxAttempts = 2;

    let stage3Attempts = 0;
    const stage3MaxAttempts = 2;

    function goHome() {
        soundSystem.play('whoosh');
        setTimeout(() => {
            window.location.href = MAIN_SCREEN_URL;
        }, 200);
    }

    const stages = [renderStage0, renderStage1, renderStage2, renderStage3, renderStageFinal];
    let currentStage = 0;
    let userScore = 0;
    let stageProgress = new Array(stages.length).fill(false);
    let feedbackEl = null; 
    
    const titleEl = document.getElementById('title');
    const nextBtn = document.getElementById('nextBtn'); 
    const controlsArea = document.getElementById('controlsArea');

    function setStageComplete(isComplete = true) {
        if (isComplete && !stageProgress[currentStage]) {
            if(currentStage >= 1 && currentStage <= 3) { 
                userScore += 10; 
            }
        }
        stageProgress[currentStage] = isComplete;
        nextBtn.classList.toggle('active', isComplete);
    }
    
    function clearFeedback(){ 
        if(feedbackEl) feedbackEl.textContent = ""; 
    }
    
    function setFeedback(text, kind){
        if(!feedbackEl) return;
        feedbackEl.textContent = text;
        if(kind === 'ok'){ feedbackEl.style.color = 'var(--ok)' }
        else if(kind === 'bad'){ feedbackEl.style.color = 'var(--bad)' }
        else { feedbackEl.style.color = 'var(--text-color)' }
    }
    
    function disableOptions(selector) {
        document.querySelectorAll(selector).forEach(el => {
            el.classList.add('disabled');
        });
    }

    function renderControls(html = '') {
        controlsArea.innerHTML = `<div id="feedback" class="feedback"></div>${html}`;
        feedbackEl = document.getElementById('feedback');
    }

    function next() {
        if (!stageProgress[currentStage]) {
            setFeedback("¡Termina esta parte antes de continuar!", 'bad');
            soundSystem.play('error');
            return;
        }

        soundSystem.play('whoosh');

        if (currentStage === stages.length - 1) {
            setTimeout(() => {
                alert(`✅ Tema Terminado. Puntuación: ${userScore}/${TOTAL_ACTIVITY_POINTS}. Volviendo al Módulo 4...`);
                window.location.href = MAIN_SCREEN_URL; 
            }, 300);
            return; 
        }

        currentStage++;
        render();
    }
    
    function render() {
        clearFeedback(); 
        setStageComplete(false);
        const container = document.getElementById('stageArea'); 
        container.innerHTML=''; 

        const titles = [
            'Mini-Clase: Números, Figuras y Clima', 
            'Actividad 1: ¡Conteo y Figuras!', 
            'Actividad 2: Clima y Calendario', 
            'Actividad 3: ¡Traduce lo Aprendido!', 
            '¡Tema Terminado!'
        ];
        titleEl.textContent = titles[currentStage];

        stages[currentStage](container);

        if (currentStage === 0 || currentStage === stages.length - 1) {
            setStageComplete(true);
        }
    }
    
    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    function renderStage0(container) {
        const videoHtml = `
            <div class="video-wrapper">
                <iframe src="https://www.youtube.com/embed/URL_DEL_VIDEO_MI_MUNDO?rel=0" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
            </div>
            <p style="text-align:center; max-width: 600px; margin-top: 20px;">
                ¡Mira el video para aprender los Números, Figuras y Clima en Ch'ol! Luego, presiona Siguiente.
            </p>
        `;
        container.innerHTML = videoHtml;
        renderControls(); 
    }

    const stage1Data = [
        { q_type: 'count', target: '7', target_chol: 'Wukp’ej', target_img: 'siete.png', options: ['Wäkp’ej', 'Wukp’ej', 'Bolomp’ej'] },
        { q_type: 'count', target: '10', target_chol: 'Lujump’ej', target_img: 'diez.png', options: ['Waxäkp’ej', 'Lujump’ej', 'Wukp’ej'] },
        { q_type: 'count', target: '12', target_chol: 'Cha’lujump’ej', target_img: 'doce.png', options: ['Lujump’ej', 'Cha’lujump’ej', 'Junlujump’ej'] },
        { q_type: 'figure', target: 'Cuadrado', target_chol: 'Lakal', target_img: 'cuadrado.png', options: ['Selekña', 'Ts’ujki’bal', 'Lakal'] },
        { q_type: 'figure', target: 'Círculo', target_chol: 'Selekña', target_img: 'circulo.png', options: ['Lakal', 'Ts’ujki’bal', 'Selekña'] },
        { q_type: 'count', target: '20', target_chol: 'Junk’al', target_img: 'veinte.png', options: ['Bolomp’ej', 'Cha’lujump’ej', 'Junk’al'] },
    ];
    let currentRound1 = 0;

    function checkAnswer1(selectedOption, currentData, allOptionsElements, selectedElement) {
        if (selectedOption === currentData.target_chol) {
            setFeedback('¡Muy bien! ¡Correcto!', 'ok');
            handleCorrectAnswer(selectedElement);
            
            stage1Attempts = 0;
            currentRound1++;
            setTimeout(() => {
                renderStage1(document.getElementById('stageArea'));
            }, 1500);
        } else {
            stage1Attempts++;
            if (stage1Attempts < stage1MaxAttempts) {
                handleIncorrectAnswer(selectedElement);
                setFeedback(`Incorrecto. Te quedan ${stage1MaxAttempts - stage1Attempts} intentos.`, 'bad');
                
                setTimeout(() => {
                    allOptionsElements.forEach(el => {
                        el.classList.remove('disabled', 'bad');
                        el.style.pointerEvents = 'auto';
                    });
                    setFeedback('Intenta de nuevo.', 'neutral');
                }, 1500);
            } else {
                handleIncorrectAnswer(selectedElement);
                setFeedback('Incorrecto. La respuesta correcta era: ' + currentData.target_chol, 'bad');
                
                allOptionsElements.forEach(el => {
                    if (el.textContent === currentData.target_chol) { el.classList.add('ok'); }
                });
                
                stage1Attempts = 0;
                currentRound1++;
                setTimeout(() => {
                    renderStage1(document.getElementById('stageArea'));
                }, 2500);
            }
        }
    }

    function renderStage1(container) {
        if (currentRound1 >= stage1Data.length) {
            container.innerHTML = `<h2 style="color: var(--ok);">¡Felicidades! Completaste la actividad de conteo y figuras.</h2>`;
            setStageComplete(true);
            renderControls();
            earnStar(container);
            return;
        }

        const roundData = stage1Data[currentRound1];
        const attemptsInfo = stage1MaxAttempts > 1 ? `(Tienes ${stage1MaxAttempts} intentos)` : '';

        container.innerHTML = `
            <p class="stage0-info">Ronda ${currentRound1 + 1} de ${stage1Data.length}: ${roundData.q_type === 'count' ? '¿Qué número en Ch’ol representa la cantidad?' : 'Selecciona el nombre de la figura en Ch’ol:'} ${attemptsInfo}</p>
            <div class="image-target-wrapper">
                <div class="image-target">
                    <img src="../assets/img/${roundData.target_img}" alt="${roundData.target}" />
                </div>
            </div>
            <div class="options-row" id="optionsContainer"></div>`;
        
        renderControls(); 

        const optionsContainer = document.getElementById('optionsContainer');
        const allOptions = roundData.options.sort(() => Math.random() - 0.5);

        allOptions.forEach(opt => {
            const b = document.createElement('div');
            b.className = 'opt';
            b.textContent = opt;
            
            b.onclick = () => {
                const allOptions = document.querySelectorAll('.opt');
                disableOptions('.opt');
                
                if (opt === roundData.target_chol) { 
                    b.classList.add('ok');
                } else { 
                    b.classList.add('bad');
                }
                
                checkAnswer1(opt, roundData, allOptions, b);
            };
            optionsContainer.appendChild(b);
        });
        setStageComplete(false);
    }

    const stage2Pairs = [
        { ch: 'K’iñ', es: 'Días' },
        { ch: 'kiñtyuñil', es: 'Temporada de calor' },
        { ch: 'Tsiñäle k’iñ', es: 'Temporada de frío' },
        { ch: 'Waxäklujump’ej', es: '18' },
        { ch: 'Bolomlujump’ej', es: '19' },
        { ch: 'Junlujump’ej', es: '11' }
    ];

    let selectedQuestion = null;
    let matchedPairsCount = 0;

    function handleQuestionClick(cardEl, question) {
        soundSystem.play('click');
        if (cardEl.classList.contains('selected')) {
            cardEl.classList.remove('selected');
            selectedQuestion = null;
            setFeedback('Selecciona el concepto en Ch\'ol y luego su traducción en español.', 'neutral');
            return;
        }
        document.querySelectorAll('.questions-stack .matching-card.selected').forEach(el => el.classList.remove('selected'));
        cardEl.classList.add('selected');
        selectedQuestion = question;
        setFeedback(`Seleccionaste ${question.ch}. ¡Ahora elige su traducción!`, 'neutral');
    }

    function handleAnswerClick(cardEl, answer) {
        soundSystem.play('click');
        if (!selectedQuestion) {
            setFeedback('Selecciona primero un concepto Ch\'ol.', 'bad');
            visualEffects.shake(cardEl);
            return;
        }

        const questionCardEl = document.querySelector(`.questions-stack .matching-card[data-chol="${selectedQuestion.ch}"]`);

        if (selectedQuestion.es === answer.es) {
            setFeedback('¡Emparejamiento Correcto!', 'ok');
            soundSystem.play('success');
            
            cardEl.classList.add('matched');
            questionCardEl.classList.add('matched');
            cardEl.classList.remove('shaking');
            questionCardEl.classList.remove('shaking', 'selected');
            
            selectedQuestion = null;
            matchedPairsCount++;

            if (matchedPairsCount === stage2Pairs.length) {
                setTimeout(() => {
                    setFeedback('¡Actividad 2 Completada! Todo es correcto.', 'ok');
                    setStageComplete(true);
                    earnStar(document.getElementById('stageArea'));
                }, 500);
            }
        } else {
            setFeedback('Incorrecto. Intenta de nuevo.', 'bad');
            soundSystem.play('error');
            
            cardEl.classList.add('shaking');
            questionCardEl.classList.add('shaking');
            setTimeout(() => {
                cardEl.classList.remove('shaking');
                questionCardEl.classList.remove('shaking');
            }, 500);
        }
    }

    function renderStage2(container) {
        matchedPairsCount = 0; 
        selectedQuestion = null;
        
        container.innerHTML = `
            <p class="stage0-info">Haz clic en el Concepto en Ch'ol (Izquierda) y luego en su traducción en Español (Derecha).</p>
            <div class="matching-click-container">
                <div id="questionGroup" class="questions-stack">
                    <p class="stack-title">Ch'ol</p>
                </div>
                <div id="answerGroup" class="answers-stack">
                    <p class="stack-title">Español</p>
                </div>
            </div>
        `;
        
        renderControls();
        setFeedback('Selecciona el concepto en Ch\'ol y luego su traducción en español.', 'neutral');

        const questionGroup = document.getElementById('questionGroup');
        const answerGroup = document.getElementById('answerGroup');
        const shuffledQuestions = shuffleArray([...stage2Pairs]);
        const shuffledAnswers = shuffleArray([...stage2Pairs]);

        shuffledQuestions.forEach(pair => {
            const qCard = document.createElement('div');
            qCard.className = 'matching-card';
            qCard.dataset.chol = pair.ch;
            qCard.textContent = pair.ch;
            qCard.onclick = () => handleQuestionClick(qCard, pair);
            questionGroup.appendChild(qCard);
        });

        shuffledAnswers.forEach(pair => {
            const aCard = document.createElement('div');
            aCard.className = 'matching-card';
            aCard.dataset.es = pair.es;
            aCard.textContent = pair.es;
            aCard.onclick = () => handleAnswerClick(aCard, pair);
            answerGroup.appendChild(aCard);
        });
        setStageComplete(false);
    }

    const stage3Data = [
        { es_phrase: 'Círculo', correct_chol: 'Selekña', options: ['Lakal', 'Ts’ujki’bal', 'Selekña'] },
        { es_phrase: '7 Siete', correct_chol: 'Wukp’ej', options: ['Wäkp’ej', 'Wukp’ej', 'Bolomp’ej'] },
        { es_phrase: '20 Veinte', correct_chol: 'Junk’al', options: ['Lujump’ej', 'Cha’lujump’ej', 'Junk’al'] },
        { es_phrase: 'Temporada de frío', correct_chol: 'Tsiñäle k’iñ', options: ['K’iñ', 'kiñtyuñil', 'Tsiñäle k’iñ'] },
        { es_phrase: '8 Ocho', correct_chol: 'Waxäkp’ej', options: ['Bolomp’ej', 'Wäkp’ej', 'Waxäkp’ej'] },
        { es_phrase: 'Días', correct_chol: 'K’iñ', options: ['Tsiñäle k’iñ', 'kiñtyuñil', 'K’iñ'] }
    ];
    let currentRound3 = 0;

    function checkAnswer3(selectedOption, currentData, allOptionsElements, selectedElement) {
        if (selectedOption === currentData.correct_chol) {
            setFeedback('¡Correcto!', 'ok');
            handleCorrectAnswer(selectedElement);
            
            stage3Attempts = 0;
            currentRound3++;
            setTimeout(() => {
                renderStage3(document.getElementById('stageArea'));
            }, 1500);
        } else {
            stage3Attempts++;
            if (stage3Attempts < stage3MaxAttempts) {
                handleIncorrectAnswer(selectedElement);
                setFeedback(`Incorrecto. Te quedan ${stage3MaxAttempts - stage3Attempts} intentos.`, 'bad');
                
                setTimeout(() => {
                    allOptionsElements.forEach(el => {
                        el.classList.remove('disabled', 'bad');
                        el.style.pointerEvents = 'auto';
                    });
                    setFeedback('Intenta de nuevo.', 'neutral');
                }, 1500);
            } else {
                handleIncorrectAnswer(selectedElement);
                setFeedback('Incorrecto. La respuesta correcta era: ' + currentData.correct_chol, 'bad');
                
                allOptionsElements.forEach(el => {
                    if (el.textContent === currentData.correct_chol) { el.classList.add('ok'); }
                });
                
                stage3Attempts = 0;
                currentRound3++;
                setTimeout(() => {
                    renderStage3(document.getElementById('stageArea'));
                }, 2500);
            }
        }
    }

    function renderStage3(container) {
        if (currentRound3 >= stage3Data.length) {
            container.innerHTML = `<h2 style="color: var(--ok);">¡Felicidades! Completaste la actividad de traducción.</h2>`;
            setStageComplete(true);
            renderControls();
            earnStar(container);
            return;
        }

        const roundData = stage3Data[currentRound3];
        const attemptsInfo = stage3MaxAttempts > 1 ? `(Tienes ${stage3MaxAttempts} intentos)` : '';

        container.innerHTML = `
            <p class="stage0-info">Ronda ${currentRound3 + 1} de ${stage3Data.length}: ${attemptsInfo}</p>
            <div style="background: #fff3e0; padding: 25px; border-radius: 20px; border: 3px solid var(--accent); margin-bottom: 25px; max-width: 500px; text-align: center; margin-left: auto; margin-right: auto; box-shadow: 0 5px 15px rgba(0,0,0,0.05);">
                <p class="question-text" style="font-size: 1.3rem; font-weight: 700; margin: 0; color: #5D4037;">¿Cómo se traduce:</p>
                <p style="font-size: 2rem; color: var(--accent); font-weight: 800; margin: 15px 0;">"${roundData.es_phrase}"</p>
                <p class="question-text" style="font-size: 1.3rem; font-weight: 700; margin: 0; color: #5D4037;">al Ch'ol?</p>
            </div>
            <div class="options-row" id="optionsContainer"></div>
        `;
        renderControls();

        const optionsContainer = document.getElementById('optionsContainer');
        const allOptions = roundData.options.sort(() => Math.random() - 0.5);

        allOptions.forEach(opt => {
            const b = document.createElement('div');
            b.className = 'opt';
            b.textContent = opt;
            
            b.onclick = () => {
                const allOptions = document.querySelectorAll('.opt');
                disableOptions('.opt');
                
                if (opt === roundData.correct_chol) { 
                    b.classList.add('ok');
                } else { 
                    b.classList.add('bad');
                }
                
                checkAnswer3(opt, roundData, allOptions, b);
            };
            optionsContainer.appendChild(b);
        });
        setStageComplete(false);
    }

    function renderStageFinal(container) {
        container.innerHTML = `
            <div style="text-align: center; padding: 40px; border: 5px dashed var(--ok); border-radius: 20px; background-color: rgba(255,255,255,0.9);">
                <h2 style="color: var(--ok); font-size: 2.5rem; margin-bottom: 20px;">🎉 ¡MÓDULO 4 COMPLETADO! 🎉</h2>
                <p style="font-size: 1.5rem; font-weight: bold;">Puntuación total: ${userScore} / ${TOTAL_ACTIVITY_POINTS}</p>
                <p style="margin-top: 15px;">Has terminado el Módulo: Mi Mundo.</p>
                <p>Presiona Siguiente para volver a la pantalla de módulos.</p>
            </div>
        `;
        
        try {
            if (window.visualEffects && typeof window.visualEffects.confetti === 'function') {
                window.visualEffects.confetti();
            } else if (typeof celebrateLevelComplete === 'function') {
                celebrateLevelComplete();
            }
        } catch (e) {
            console.log("Efectos visuales no disponibles");
        }

        guardarProgresoEnBD();
        setStageComplete(true);
        renderControls();
    }

    function guardarProgresoEnBD() {
        fetch('../../backend/api/progress.php', { 
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                tema_id: TEMA_ID,
                completado: true
            })
        })
        .then(response => response.json())
        .then(data => {
            console.log("Progreso guardado:", data);
            if(data.success && window.collectCoin) {
                collectCoin();
            }
        })
        .catch(error => console.error('Error al guardar:', error));
    }

    document.addEventListener('DOMContentLoaded', () => {
        render();
    });
</script>
</body>
</html>
