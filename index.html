<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aprendiendo Ch'ol</title>

    <style>

    body {
        position: relative;
        margin: 0;
        padding: 0;
        font-family: 'Comic Sans MS', 'Comic Sans', cursive; 
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        color: #4B4B4B;
        text-align: center;

        /* 🔵 NUEVO FONDO ESTÁNDAR */
        background: linear-gradient(180deg, #ADE4FF 65%, #ADD8E6 100%);
        overflow-x: hidden;
    }

    /* 🌱 Pasto del fondo */
    .ground-sim {
        position: fixed;
        bottom: 0;
        width: 100%;
        height: 20vh;
        background-color: #6AA84F;
        border-top-left-radius: 60% 30%;
        border-top-right-radius: 60% 30%;
        z-index: -1;
    }

    /* Botón Google */
    .google-login-button {
        position: absolute;
        top: 20px;
        right: 20px;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 12px 20px;
        background-color: #FFFFFF;
        border: 2px solid #00BCD4;
        border-radius: 20px;
        cursor: pointer;
        box-shadow: 0 5px 0 #0097A7;
        text-decoration: none;
        color: #0097A7;
        font-weight: bold;
        transition: 0.15s;
        z-index: 10;
    }
    .google-login-button:active {
        transform: translateY(4px);
        box-shadow: 0 1px 0 #0097A7;
    }

    .google-icon {
        width: 20px;
        height: 20px;
    }

    /* Contenedor principal igual que antes */
    .container {
        padding: 0 20px;
        max-width: 900px;
        width: 100%;
    }

    .header {
        margin-bottom: 40px;
        padding-top: 60px;
    }

    .header h1 {
        font-size: clamp(2.2rem, 4vw, 4rem);
        font-weight: bold;
        color: #0081A7;
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        margin-bottom: 0.5rem;
    }

    .header p {
        font-size: 1.5rem;
        color: #555;
        margin-top: 0;
    }

    /* Video responsivo */
    .video-container {
        position: relative;
        padding-bottom: 56.25%; 
        height: 0;
        overflow: hidden;
        border-radius: 20px;
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
    }
    .video-container video {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    /* Responsivo */
    @media (max-width: 768px) {
        .header h1 {
            font-size: 3rem;
        }
        .header p {
            font-size: 1.2rem;
        }
        .google-login-button {
            top: 15px;
            right: 15px;
            padding: 10px 15px;
        }
    }

    @media (max-width: 500px) {
        .google-login-button {
            top: 10px;
            right: 10px;
            padding: 8px 12px;
            font-size: 0.8rem;
        }
        .google-icon {
            width: 16px;
            height: 16px;
        }
        .header {
            padding-top: 50px;
            margin-bottom: 20px;
        }
        .header h1 {
            font-size: 2.2rem;
        }
    }

</style>

</head>
<body>

    <a href="#" class="google-login-button" id="btn-login">
        <img src="https://www.google.com/favicon.ico" alt="Google Icon" class="google-icon">
        Acceder con Google
    </a>

    <div class="container">
        <header class="header">
            <h1>Bienvenidos a <span style="color: #F88F8F;">Aprendiendo CH'OL</span></h1>
            <p>¡Aquí aprenderás cosas nuevas y muy divertidas!</p>
        </header>

        <div class="video-container">
            <video controls autoplay muted>
                <source src="videos/personaje_presentacion.mp4" type="video/mp4"> 
                Tu navegador no soporta la etiqueta de video.
            </video>
        </div>
    </div>
    
<div class="ground-sim"></div>

    <script>
        document.getElementById('btn-login').addEventListener('click', function(e) {
            e.preventDefault();
            
            // Simulación de la lógica de Backend/API
            alert("Simulando Inicio de Sesión Exitoso. Redireccionando...");
            
            // Redirección automática al Código 2 (puedes cambiar el nombre del archivo)
            window.location.href = "panprin.html"; 
        });
    </script>
</body>
</html>
