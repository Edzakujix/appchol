<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aprendiendo Ch'ol</title>
    <style>
        body {
            position: relative;
            margin: 0;
            padding: 0;
            font-family: 'Comic Sans MS', 'Comic Sans', cursive; 
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #4B4B4B;
            text-align: center;
            background: linear-gradient(180deg, #ADE4FF 65%, #ADD8E6 100%);
            overflow-x: hidden;
        }
        .ground-sim {
            position: fixed;
            bottom: 0;
            width: 100%;
            height: 20vh;
            background-color: #6AA84F;
            border-top-left-radius: 60% 30%;
            border-top-right-radius: 60% 30%;
            z-index: -1;
        }
        .google-btn-wrapper {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 10;
        }
        .container {
            padding: 0 20px;
            max-width: 900px;
            width: 100%;
        }
        .header {
            margin-bottom: 40px;
            padding-top: 60px;
        }
        .header h1 {
            font-size: clamp(2.2rem, 4vw, 4rem);
            font-weight: bold;
            color: #0081A7;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
            margin-bottom: 0.5rem;
        }
        .header p {
            font-size: 1.5rem;
            color: #555;
            margin-top: 0;
        }
        .video-container {
            position: relative;
            padding-bottom: 56.25%; 
            height: 0;
            overflow: hidden;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
        }
        .video-container video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        @media (max-width: 768px) {
            .header h1 { font-size: 3rem; }
            .header p { font-size: 1.2rem; }
            .google-btn-wrapper { top: 15px; right: 15px; }
        }
    </style>
</head>
<body>

    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <div id="g_id_onload"
         data-client_id="242199046466-8m8sqnimou002rg07t8rl77bm3ts7l34.apps.googleusercontent.com"
         data-callback="handleCredentialResponse"
         data-auto_prompt="false">
    </div>

    <div class="google-btn-wrapper">
        <div class="g_id_signin"
             data-type="standard"
             data-shape="pill"
             data-theme="outline"
             data-text="signin_with"
             data-size="large"
             data-logo_alignment="left">
        </div>
    </div>

    <div class="container">
        <header class="header">
            <h1>Bienvenidos a <span style="color: #F88F8F;">Aprendiendo CH'OL</span></h1>
            <p>¡Aquí aprenderás cosas nuevas y muy divertidas!</p>
        </header>

        <div class="video-container">
            <video controls autoplay muted>
                <source src="videos/personaje_presentacion.mp4" type="video/mp4"> 
                Tu navegador no soporta la etiqueta de video.
            </video>
        </div>
    </div>
    
    <div class="ground-sim"></div>

    <script>
    function handleCredentialResponse(response) {
        const responsePayload = decodeJwtResponse(response.credential);

        fetch('backend/api/auth.php', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                google_id: responsePayload.sub,
                email: responsePayload.email,
                nombre: responsePayload.name,
                foto: responsePayload.picture
            })
        })
        .then(res => res.json())
        .then(data => {
            if (data.success) {
                localStorage.setItem('usuario_nombre', responsePayload.name);
                localStorage.setItem('usuario_foto', responsePayload.picture);
                window.location.href = "panprin.html";
            } else {
                alert("Error al iniciar sesión en el servidor");
            }
        })
        .catch(err => console.error(err));
    }

            function decodeJwtResponse(token) {
            var base64Url = token.split('.')[1];
            var base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            var jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));
            return JSON.parse(jsonPayload);
        }
</script>
</body>
</html>
