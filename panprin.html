<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú Principal - Ch'ol App</title>

    <style>
        :root {
            --color-cielo: #ADE4FF;
            --color-pasto: #6AA84F;
            --btn1: #5FA8D3;
            --btn2: #FF9933;
            --btn3: #3d683d;
            --btn4: #87b433;
            --btn5: #FF5E5E;
            --btn-perfil: #e77eb2;
        }

        body {
            margin: 0;
            background-color: var(--color-cielo);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .ground {
            position: fixed;
            bottom: 0;
            width: 100%;
            height: 30vh;
            background-color: var(--color-pasto);
            border-top-left-radius: 50% 10%;
            border-top-right-radius: 50% 10%;
            z-index: 0;
        }

        .interface-box {
            background-color: rgba(255, 255, 255, 0.65);
            border-radius: 25px;
            width: 90%;
            max-width: 800px;
            margin-top: 15vh;
            padding: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
            position: relative;
            z-index: 10;
        }

        header h1 {
            text-align: center;
            font-size: 2.3rem;
            margin: 0;
            color: #444;
        }

        .profile-button {
            position: fixed; 
            top: 20px; 
            right: 20px; 
            background-color: var(--btn-perfil); 
            color: rgb(255, 255, 255);
            padding: 15px 30px;
            border: none;
            border-radius: 25px;
            font-weight: bold;
            font-size: 1rem;
            text-decoration: none;
            box-shadow: 0 4px 8px rgba(199, 79, 79, 0.2);
            transition: all 0.2s ease-in-out;
            z-index: 100; 
        }

        .profile-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.3);
            background-color: #FFB6C1; 
        }

        .button-area {
            position: relative;
            width: 100%;
            height: 500px;
            margin-top: 20px;
        }

.center-content {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%); 
    width: 240px; 
    height: 240px;
    border-radius: 50%;     
    border: 6px solid white; 
    box-shadow: 0 0 20px rgba(173, 228, 255, 0.6);
    overflow: hidden;   
    background-color: #fff;   
    z-index: 0;
}

.center-content img {
    width: 100%;
    height: 100%;
    object-fit: cover; 
}

        .nav-btn {
            position: absolute;
            padding: 12px 22px;
            border-radius: 40px;
            color: white;
            text-decoration: none;
            font-weight: bold;
            font-size: 1rem;
            box-shadow: 0 5px 0 rgba(0,0,0,0.25);
            transition: transform 0.2s;
            animation: float 3s ease-in-out infinite;
        }


        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-12px); }
            100% { transform: translateY(0px); }
        }

        .nav-btn:hover {
            filter: brightness(1.1);
            transform: scale(1.05);
        }

#btn1 { background: var(--btn1); top: calc(50% - 200px); left: calc(50% - 55px); } 
#btn2 { background: var(--btn2); top: calc(50% - 85px);  left: calc(50% + 180px); }
#btn3 { background: var(--btn3); top: calc(50% + 120px); left: calc(50% + 140px); }
#btn4 { background: var(--btn4); top: calc(50% + 120px); left: calc(50% - 280px); }
#btn5 { background: var(--btn5); top: calc(50% - 85px);  left: calc(50% - 300px); }

@media (max-width: 600px) {

    .button-area {
        height: 340px;
    }

    .center-content {
        width: 190px;
        height: 200px;
        border-width: 4px;
    }

    .nav-btn {
        font-size: 0.8rem;
        padding: 10px 18px;
        border-radius: 30px;
        animation-duration: 2.5s; 
    }

    #btn1 { 
        top: calc(50% - 140px); 
        left: calc(50% - 45px); 
    }

    #btn2 {
        top: calc(50% - 40px); 
        left: calc(50% - 210px); 
    }

    #btn3 { 
        top: calc(50% + 75px); 
        left: calc(50% - 175px); 
    }

    #btn4 { 
        top: calc(50% - 40px); 
        left: calc(50% + 80px); 
    }

    #btn5 { 
        top: calc(50% + 75px); 
        left: calc(50% + 60px); 
    }
}

@media (min-width: 600px) and (max-width: 900px) {

    .button-area {
        height: 420px;
    }

    .center-content {
        width: 200px;
        height: 200px;
    }

    .nav-btn {
        font-size: 1rem;
        padding: 12px 26px;
    }

    #btn1 { top: calc(50% - 170px); left: calc(50% - 45px); }
    #btn2 { top: calc(50% - 60px);  left: calc(50% + 150px); }
    #btn3 { top: calc(50% + 95px);  left: calc(50% + 125px); }
    #btn4 { top: calc(50% + 95px);  left: calc(50% - 180px); }
    #btn5 { top: calc(50% - 60px);  left: calc(50% - 210px); }
}

    </style>
</head>
<body>

<a href="user.html" class="profile-button">Mi Perfil</a>

<div class="interface-box">
    <header>
        <h1>MÓDULOS</h1>
    </header>

    <div class="button-area">

        <div class="center-content">
            <img src="assets/img/grupo.jpeg" alt="Imagen representativa">
        </div>

        <a href="U1/U1FAM.html" class="nav-btn" id="btn1">1 - FAMILIA</a>
        <a href="U2/U2DOVI.html" class="nav-btn" id="btn2">2 - DONDE VIVO</a>
        <a href="U3/U3ESC.html" class="nav-btn" id="btn3">3 - ESCUELA</a>
        <a href="U4/U4GUPA.html" class="nav-btn" id="btn4">4 - GUSTOS Y PASATIEMPOS</a>
        <a href="U5/U5MICU.html" class="nav-btn" id="btn5">5 - MI CUERPO</a>

    </div>
</div>

<div class="ground"></div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const nombreGoogle = localStorage.getItem('usuario_nombre');
        
        const btnPerfil = document.querySelector('.profile-button');

        if (nombreGoogle && btnPerfil) {
            const primerNombre = nombreGoogle.split(' ')[0]; 
            btnPerfil.textContent = "Hola, " + primerNombre;
        }
    });
</script>

</body>
</html>
