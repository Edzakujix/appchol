<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Tema 2: Lugares y Objetos</title>

    <link rel="stylesheet" href="../assets/css/styles.css">

    <style>
:root {
    --matching-bg: #8AC257;
    --matching-card-bg: #E7F6E1;
    --select-highlight: #FF7043;
}

button.primary {
    opacity: 0.5;
    pointer-events: none;
}

button.primary.active {
    opacity: 1;
    pointer-events: auto;
}

button.primary.active:active {
    transform: translateY(5px);
    box-shadow: 0 0px 0 0 #0288D1;
}

.opt {
    min-width: 140px; 
    padding: 20px; 
    border-radius: 20px;
    background: #fff;
    box-shadow: 0 8px 18px rgba(0, 0, 0, 0.1);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px; 
    cursor: pointer;
    border: 4px solid #E0E0E0;
    font-size: 1.1rem;
    font-weight: 600;
    transition: all .2s;
}

.opt:not(.disabled):hover {
    transform: translateY(-5px) scale(1.05);
    box-shadow: 0 12px 25px rgba(0, 0, 0, 0.15);
}

.opt.disabled { pointer-events: none; opacity: 0.7; }
.opt.ok { border-color: var(--ok); box-shadow: 0 8px 20px rgba(76,175,80,0.3); background: #E8F5E9; }
.opt.bad { border-color: var(--bad); box-shadow: 0 8px 20px rgba(229,57,53,0.3); background: #FFEBEE; }

.img-option img {
    width: 150px; 
    height: 150px; 
    border-radius: 10px; 
    object-fit: cover;
}

.matching-click-container {
    display: flex;
    flex-direction: column;
    gap: 15px;
    width: 100%;
    max-width: 700px;
    padding: 20px;
    background-color: var(--matching-bg); 
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.1);
}

.matching-card {
    background-color: var(--matching-card-bg);
    border-radius: 12px;
    padding: 10px 15px;
    font-weight: 700;
    font-size: 1.2rem;
    cursor: pointer;
    transition: all 0.2s;
    box-shadow: 0 4px 0 0 rgba(0,0,0,0.1);
    border: 3px solid transparent;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 60px;
}

.matching-card:hover:not(.matched):not(.selected) {
    transform: translateY(-2px);
    box-shadow: 0 6px 0 0 rgba(0,0,0,0.15);
}

.matching-card.selected {
    border-color: var(--select-highlight);
    box-shadow: 0 0 0 4px var(--select-highlight);
    background-color: #F8E3DD;
}

.matching-card.matched {
    background-color: var(--ok);
    color: white;
    pointer-events: none;
    cursor: default;
    box-shadow: none;
    border-color: var(--ok);
}

.matching-card.shaking {
    animation: shake 0.5s;
    animation-iteration-count: 2;
    border-color: var(--bad) !important;
    box-shadow: 0 0 0 4px var(--bad) !important;
    background-color: #FFEBEE !important;
    color: var(--bad);
}

.questions-stack, .answers-stack {
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 10px;
    border-radius: 15px;
    background: rgba(255, 255, 255, 0.5);
}

.stack-title {
    font-weight: 800;
    font-size: 1.1rem;
    color: var(--text-color);
    margin-bottom: 5px;
    text-align: left;
    padding-left: 10px;
}

@media (min-width: 601px) {
    .matching-click-container {
        flex-direction: row;
        justify-content: space-around;
    }
    .questions-stack, .answers-stack {
        flex-basis: 48%;
    }
}
    </style>

</head>
<body>
    <div class="app" role="application" aria-label="Prototipo actividades para primaria">
        <header>
            <h1 id="title">Mini-Clase: Lugares y Objetos Ch'ol</h1>
            <div style="display: flex; gap: 10px;">
                <button class="ghost" onclick="goHome()" style="font-weight: 500; padding: 10px;">🏠 Inicio</button>
                <button class="primary" id="nextBtn" onclick="next()">Siguiente</button>
            </div>
        </header>

        <main class="stage-area" id="stageArea"></main>

        <div class="controls" id="controlsArea">
        </div>

        <footer>Prototipo educativo · Módulo 3: Tema 2</footer>
    </div>

    <div class="ground-sim"></div>


<script>
    const MAIN_SCREEN_URL = '../U3/U3ESC.html'; 
    const USER_GOOGLE_ID = 'ID_DEL_USUARIO_AUTENTICADO'; 
    const TOTAL_ACTIVITY_POINTS = 40; 
    
    function goHome() { window.location.href = MAIN_SCREEN_URL; }

    const stages = [renderStage0, renderStage1, renderStage2, renderStage3, renderStage4];
    let currentStage = 0;
    let feedbackEl = null; 
    const titleEl = document.getElementById('title');
    const nextBtn = document.getElementById('nextBtn');
    const controlsArea = document.getElementById('controlsArea');
    
    let stageProgress = new Array(stages.length).fill(false); 
    let userScore = 0; 

    function setStageComplete(isComplete = true) {
        if (isComplete && !stageProgress[currentStage]) {
            if(currentStage >= 1 && currentStage <= 3) { userScore += 10; }
        }
        stageProgress[currentStage] = isComplete;
        nextBtn.classList.toggle('active', isComplete);
    }

    function clearFeedback(){ if(feedbackEl) feedbackEl.textContent = ""; }
    
    function setFeedback(text, kind){
        if(!feedbackEl) return;
        feedbackEl.innerHTML = text; 
        if(kind === 'ok'){ feedbackEl.style.color = 'var(--ok)' }
        else if(kind === 'bad'){ feedbackEl.style.color = 'var(--bad)' }
        else { feedbackEl.style.color = 'var(--text-color)' }
    }
    
    function disableOptions() {
        document.querySelectorAll('.opt').forEach(el => el.classList.add('disabled'));
    }

    function renderControls(html = '') {
        controlsArea.innerHTML = `<div id="feedback" class="feedback"></div>${html}`;
        feedbackEl = document.getElementById('feedback');
    }

    function next(){ 
        if (!stageProgress[currentStage]) {
            setFeedback("¡Termina esta parte antes de continuar!", 'bad');
            return;
        }

        if (currentStage === 4) {
             alert(`✅ Tema Terminado. Puntuación simulada: ${userScore}/${TOTAL_ACTIVITY_POINTS}. Volviendo a la pantalla principal...`);
             window.location.href = MAIN_SCREEN_URL; 
             return; 
        }

        currentStage++;
        if (currentStage >= stages.length) { currentStage = stages.length - 1; }
        render(); 
    }

    function speakText(text, lang='es-ES'){
        if(!window.speechSynthesis) return;
        const u = new SpeechSynthesisUtterance(text);
        u.lang = lang;
        window.speechSynthesis.cancel();
        window.speechSynthesis.speak(u);
    }
    
    function render(){ 
        clearFeedback(); 
        setStageComplete(false);
        const container = document.getElementById('stageArea'); 
        container.innerHTML=''; 

        const titles = [
            'Mini-Clase: Lugares y Objetos Ch\'ol', 
            'Actividad 1: Oración a Figura', 
            'Actividad 2: Audio a Figura', 
            'Actividad 3: Relaciona Objeto y Color', 
            '¡Tema Terminado!'
        ];
        titleEl.textContent = titles[currentStage];

        stages[currentStage](container);
        
        if (currentStage === 0 || currentStage === 4) { setStageComplete(true); }
    }

    function playAudio(audioFilename, text, lang = 'cho') {
        const audioUrl = `../assets/audio/${audioFilename}`; 
        const audio = new Audio(audioUrl);
        
        audio.play()
            .then(() => { setFeedback(`🔊 Reproduciendo: "${text}"`, 'neutral'); })
            .catch(e => {
                console.error(`❌ Error al cargar o reproducir "${audioUrl}": ${e.message}`);
                speakText(text, lang); 
                setFeedback(`[TTS] No se encontró el audio real. Reproduciendo: "${text}"`, 'neutral');
            });
    }

    function createAudioButton(text, audioFilename, lang = 'cho') {
        const btn = document.createElement('button');
        btn.className = 'ghost';
        btn.innerHTML = '🔊 Reproducir Audio';
        btn.onclick = () => { playAudio(audioFilename, text, lang); };
        return btn;
    }
    
    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    function renderStage0(container){
        const videoHtml = `
            <div class="video-wrapper">
                <iframe src="https://www.youtube.com/embed/URL_DEL_VIDEO_TEMA2?rel=0" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
            </div>
            <p style="text-align:center; max-width: 600px; margin-top: 20px;">
                ¡Mira el video para aprender sobre Lugares, Objetos y Colores en Ch'ol! Luego, presiona Siguiente.
            </p>
        `;
        container.innerHTML = videoHtml;
        setStageComplete(true);
        renderControls();
    }

    const stage1Data = [
        { ch_sentence: "ka´bä añ buchli´bäl", audio: "muchas_sillas.mp3", correct_img: "sillas.png", distractor_img: "silla.png", hint: "Hay muchas sillas" }, 
        { ch_sentence: "Säsäk li buchli´bäl", audio: "silla_negra.mp3", correct_img: "silla_negra.png", distractor_img: "cr.png", hint: "La silla es negra" }, 
        { ch_sentence: "Li dibru ya´añ tyi iye´bal li buchli´bäl", audio: "libro_debajo.mp3", correct_img: "libro_silla.png", distractor_img: "tarde.png", hint: "El Libro está debajo de la silla" }, 
        { ch_sentence: "Jiñi juñ ya´añ tyi ity´ej tyi tyexelex", audio: "cuaderno_al_lado.mp3", correct_img: "ct.png", distractor_img: "noche.png", hint: "El cuaderno está al lado de las tijeras" }, 
        { ch_sentence: "Jiñi juñ xchächäko´", audio: "cuadernos_rojos.mp3", correct_img: "cr.png", distractor_img: "ct.png", hint: "Los cuadernos son rojos" }, 
    ];
    let currentRound1 = 0;

    function checkAnswer1(selectedImage, currentData, allOptionsElements) {
        if (selectedImage === currentData.correct_img) {
            setFeedback('¡Muy bien! ¡Correcto!', 'ok');
            currentRound1++;
            setTimeout(() => { renderStage1(document.getElementById('stageArea')); }, 1500);
        } else {
            setFeedback(`Incorrecto. ¡La oración significa: ${currentData.hint}!`, 'bad');
            allOptionsElements.forEach(el => {
                if (el.dataset.img === currentData.correct_img) { el.classList.add('ok'); }
            });
            currentRound1++;
            setTimeout(() => { renderStage1(document.getElementById('stageArea')); }, 3000);
        }
    }

    function renderStage1(container) {
        if (currentRound1 >= stage1Data.length) {
            container.innerHTML = `<h2 style="color: var(--ok);">¡Felicidades! Completaste las ${stage1Data.length} rondas de oraciones.</h2>`;
            setStageComplete(true);
            renderControls();
            return;
        }

        const currentData = stage1Data[currentRound1];
        renderControls();
        
        container.innerHTML = `
            <p class="stage0-info">Ronda ${currentRound1 + 1} de ${stage1Data.length}: Escucha la oración y selecciona la figura correcta.</p>
            <p style="font-size: 1.4rem; font-weight: bold; color: var(--accent);">${currentData.ch_sentence}</p>
        `;
        
        const audioBtn = createAudioButton(currentData.ch_sentence, currentData.audio, 'cho');
        const buttonWrapper = document.createElement('div');
        buttonWrapper.style.cssText = "display: flex; gap: 15px; justify-content: center; margin-bottom: 20px;";
        buttonWrapper.appendChild(audioBtn);
        controlsArea.insertBefore(buttonWrapper, feedbackEl.nextSibling); 

        const options = [currentData.correct_img, currentData.distractor_img, "perro.png", "patio.png"]; 
        options.sort(() => Math.random() - 0.5); 

        const row = document.createElement('div');
        row.className = 'options-row';
        
        options.forEach(imgName => {
            const b = document.createElement('div');
            b.className = 'opt img-option'; 
            b.dataset.img = imgName;
            
            b.innerHTML = `<img src="../assets/img/${imgName}" alt="Opción de imagen"/>`;
            
            b.onclick = ()=>{
                const allOptions = document.querySelectorAll('.opt');
                disableOptions();
                
                if (imgName === currentData.correct_img) { b.classList.add('ok'); } else { b.classList.add('bad'); }
                
                checkAnswer1(imgName, currentData, allOptions); 
            };
            row.appendChild(b);
        });

        container.appendChild(row);
        setStageComplete(false);
    }
    
    const stage2Questions = [
        { ch_word: "Yotyle aj k´ejuño´", filename: "escuela.mp3", correct: "escuela.png", word: "Escuela" }, 
        { ch_word: "Juñ", filename: "cuaderno.mp3", correct: "cuaderno.png", word: "Cuaderno" }, 
        { ch_word: "Tyexelex", filename: "tijera.mp3", correct: "tijera.png", word: "Tijera" }, 
        { ch_word: "Dubru", filename: "libro.mp3", correct: "libro.png", word: "Libro" }, 
        { ch_word: "Buchli´bäl", filename: "silla.mp3", correct: "silla.png", word: "Silla" }, 
        { ch_word: "Tyi´otyoty", filename: "puerta.mp3", correct: "puerta.png", word: "Puerta" }, 
    ];
    let currentRound2 = 0; 

    const stage2AllOptions = [
        { filename: "escuela.png", word: "Escuela" },
        { filename: "cuaderno.png", word: "Cuaderno" },
        { filename: "tijera.png", word: "Tijera" },
        { filename: "libro.png", word: "Libro" },
        { filename: "silla.png", word: "Silla" }, 
        { filename: "puerta.png", word: "Puerta" },
        { filename: "casa.png", word: "casa" } 
    ];

    function checkAnswer2(selectedImage, currentData, allOptionsElements) {
        if (selectedImage === currentData.correct) {
            setFeedback(`¡Correcto! Es ${currentData.word}.`, 'ok');
            currentRound2++;
            setTimeout(() => { renderStage2(document.getElementById('stageArea')); }, 1200);
        } else {
            setFeedback('Incorrecto. ¡La figura correcta representa ' + currentData.word + '!', 'bad');
            allOptionsElements.forEach(el => {
                if (el.dataset.img === currentData.correct) { el.classList.add('ok'); }
            });
            currentRound2++;
            setTimeout(() => { renderStage2(document.getElementById('stageArea')); }, 2500);
        }
    }
    
    function renderStage2(container) {
        if (currentRound2 >= stage2Questions.length) {
            container.innerHTML = `<h2 style="color: var(--ok);">¡Genial! Terminaste las ${stage2Questions.length} rondas.</h2>`;
            setStageComplete(true);
            renderControls();
            return; 
        }

        const currentData = stage2Questions[currentRound2];
        container.innerHTML = `<p class="stage0-info">Ronda ${currentRound2 + 1} de ${stage2Questions.length}. Escucha el audio y selecciona la figura: ${currentData.word}.</p>`;
        
        const audioBtn = createAudioButton(currentData.ch_word, currentData.filename, 'cho');
        renderControls();
        const buttonWrapper = document.createElement('div');
        buttonWrapper.style.cssText = "display: flex; gap: 15px; justify-content: center; margin-bottom: 20px;";
        buttonWrapper.appendChild(audioBtn);
        const feedbackEl = document.getElementById('feedback');
        if (controlsArea) { controlsArea.insertBefore(buttonWrapper, feedbackEl.nextSibling); }

        const row = document.createElement('div');
        row.className = 'options-row';
        
        let optionsToDisplay = stage2AllOptions.filter(opt => opt.filename === currentData.correct);
        let distractionOptions = stage2AllOptions.filter(opt => opt.filename !== currentData.correct);
        
        while(optionsToDisplay.length < 4 && distractionOptions.length > 0) {
            const randomIndex = Math.floor(Math.random() * distractionOptions.length);
            optionsToDisplay.push(distractionOptions.splice(randomIndex, 1)[0]);
        }
        optionsToDisplay.sort(() => Math.random() - 0.5);

        optionsToDisplay.forEach(it => {
            const b = document.createElement('div');
            b.className = 'opt img-option'; 
            b.dataset.img = it.filename;
            
            b.innerHTML = `<img src="../assets/img/${it.filename}" alt="${it.word}"/> <span style="margin-top: 5px; font-size: 0.9rem;">${it.word}</span>`;
            
            b.onclick = ()=>{
                const allOptions = document.querySelectorAll('.opt');
                disableOptions();
                if (it.filename === currentData.correct) { b.classList.add('ok'); } else { b.classList.add('bad'); }
                checkAnswer2(it.filename, currentData, allOptions); 
            };
            row.appendChild(b);
        });

        container.appendChild(row);
        setStageComplete(false);
    }

    const stage3Pairs = [
        { chol: 'Xäjxäx', es: 'Verde' }, 
        { chol: 'Chächäk', es: 'Rojo' }, 
        { chol: 'I´ik´', es: 'Negro' }, 
        { chol: 'Säsäk', es: 'Blanco' }, 
        { chol: 'K´änk´än', es: 'Amarillo' }, 
    ];

    let selectedQuestionStage3 = null;
    let matchedPairsCountStage3 = 0;

    function handleStage3QuestionClick(cardEl, itemData) {
        if (cardEl.classList.contains('selected')) {
            cardEl.classList.remove('selected');
            selectedQuestionStage3 = null;
            setFeedback('Selecciona una palabra en Ch\'ol y luego su traducción.', 'neutral');
            return;
        }
        document.querySelectorAll('.questions-stack .matching-card.selected').forEach(el => el.classList.remove('selected'));
        cardEl.classList.add('selected');
        selectedQuestionStage3 = itemData;
        setFeedback(`Seleccionaste ${itemData.chol}. ¡Ahora elige el color en Español!`, 'neutral');
    }

    function handleStage3AnswerClick(cardEl, itemData) {
        if (!selectedQuestionStage3) {
            setFeedback('Selecciona primero un color en Ch\'ol de la columna izquierda.', 'bad');
            cardEl.classList.add('shaking');
            setTimeout(() => cardEl.classList.remove('shaking'), 500);
            return;
        }

        const questionCardEl = document.querySelector(`.questions-stack .matching-card[data-chol="${selectedQuestionStage3.chol}"]`);

        if (selectedQuestionStage3.es === itemData.es) {
            setFeedback('¡Emparejamiento Correcto!', 'ok');
            cardEl.classList.add('matched');
            questionCardEl.classList.add('matched');
            cardEl.classList.remove('shaking'); 
            questionCardEl.classList.remove('shaking', 'selected');
            selectedQuestionStage3 = null;
            matchedPairsCountStage3++;

            if (matchedPairsCountStage3 === stage3Pairs.length) {
                setFeedback('¡Felicidades! Todos los colores son correctos.', 'ok');
                setStageComplete(true);
            }
        } else {
            setFeedback('Incorrecto. Intenta de nuevo.', 'bad');
            cardEl.classList.add('shaking');
            questionCardEl.classList.add('shaking');
            setTimeout(() => {
                cardEl.classList.remove('shaking');
                questionCardEl.classList.remove('shaking');
            }, 500);
        }
    }

    function renderStage3(container){
        renderControls();
        matchedPairsCountStage3 = 0;
        selectedQuestionStage3 = null;

        const questions = stage3Pairs.map(d => ({ chol: d.chol, es: d.es }));
        const answers = stage3Pairs.map(d => ({ chol: d.chol, es: d.es }));
        
        shuffleArray(questions);
        shuffleArray(answers);

        container.innerHTML = `<p class="stage0-info">Haz clic en el Color en Ch'ol (Izquierda) y luego en su Traducción en Español (Derecha) para unirlos.</p>`;

        const matchingContainer = document.createElement('div');
        matchingContainer.className = 'matching-click-container';

        const questionsStack = document.createElement('div');
        questionsStack.className = 'questions-stack';
        questionsStack.innerHTML = `<p class="stack-title">Ch'ol:</p>`;
        
        questions.forEach(q => {
            const cardEl = document.createElement('div');
            cardEl.className = 'matching-card';
            cardEl.textContent = q.chol;
            cardEl.dataset.chol = q.chol;
            cardEl.onclick = () => handleStage3QuestionClick(cardEl, q);
            questionsStack.appendChild(cardEl);
        });

        const answersStack = document.createElement('div');
        answersStack.className = 'answers-stack';
        answersStack.innerHTML = `<p class="stack-title">Español:</p>`;

        answers.forEach(a => {
            const cardEl = document.createElement('div');
            cardEl.className = 'matching-card';
            cardEl.textContent = a.es;
            cardEl.onclick = () => handleStage3AnswerClick(cardEl, a);
            answersStack.appendChild(cardEl);
        });

        matchingContainer.appendChild(questionsStack);
        matchingContainer.appendChild(answersStack);
        container.appendChild(matchingContainer);
        setFeedback('Selecciona una palabra y su traducción.', 'neutral');
        setStageComplete(false);
    }
    
    function renderStage4(container) {
        container.innerHTML = `
            <div style="text-align: center; padding: 40px; border: 5px dashed var(--ok); border-radius: 20px;">
                <h2 style="color: var(--ok); font-size: 2.5rem;">🎉 ¡Tema 2 Completado! 🎉</h2>
                <p style="font-size: 1.2rem;">Puntuación simulada: ${userScore}/${TOTAL_ACTIVITY_POINTS}</p>
                <p>Presiona Siguiente para volver a la pantalla principal.</p>
            </div>
        `;
        setStageComplete(true);
        renderControls();
    }


    document.addEventListener('DOMContentLoaded', () => {
        render();
    });
</script>
</body>
</html>
