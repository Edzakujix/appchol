<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Ch'ol App - Tema 2: Lugares y Objetos</title>

    <style>
/* (Se mantiene el CSS completo de la plantilla, no repetido aquí por brevedad) */
:root {
    --color-cielo: #ADE4FF; 
    --color-pasto: #6AA84F; 
    --color-principal: #75b4c7;
    --color-acentos: #2A9D8F;
    --color-texto: #333;
    --accent: #FF7043; 
    --card: #ffffff;
    --next: #29B6F6;
    --ok: #4CAF50;
    --bad: #E53935;
}
html, body {
    height: 100%;
    margin: 0;
    padding: 0;
}

body {
    font-family: 'Comic Sans MS', 'Comic Sans', cursive; 
    background: linear-gradient(180deg, var(--color-cielo) 65%, #ADD8E6 100%); 
    color: var(--color-texto);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    text-align: center;
    position: relative;
    box-sizing: border-box;
    padding: 20px;
}

.ground-sim {
    position: fixed; bottom: 0; width: 100%; height: 20vh; background-color: var(--color-pasto);
    border-top-left-radius: 60% 30%; border-top-right-radius: 60% 30%; z-index: -1;
}

.app {
    width: 100%; max-width: 900px; background: var(--card); border-radius: 30px;
    box-shadow: 0 15px 40px rgba(255, 112, 67, 0.2); padding: 30px; border: 5px solid var(--accent);
    max-height: 95vh; display: flex; flex-direction: column; justify-content: space-between; overflow: hidden;
}

header{
    display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom: 20px; flex-shrink: 0; 
}
h1{
    font-size: clamp(1.5rem, 3vw, 2rem); margin:0; color: var(--accent); text-shadow: 2px 2px #fff;
}
.stage-area{
    overflow-y: auto; padding-right: 10px; padding-bottom: 20px; display: flex; 
    flex-direction: column; justify-content: flex-start; align-items: center; scrollbar-width: thin;
}
.controls{
    display:flex;gap:15px;justify-content:space-between;align-items:center; margin-top:10px;
    flex-shrink: 0; padding-top: 10px; border-top: 1px solid #eee;
}

button.primary, button.ghost{
    padding:12px 20px; border-radius: 15px; font-weight:700; cursor:pointer; transition: all .1s ease;
}
button.primary{
    background:var(--next); color:white; border:none; box-shadow: 0 5px 0 0 #0288D1; opacity: 0.5; pointer-events: none;
}
button.primary.active{
    opacity: 1; pointer-events: auto;
}
button.primary.active:active{
    transform: translateY(5px); box-shadow: 0 0px 0 0 #0288D1;
}
button.ghost{
    background:#e0f7fa; border: 3px solid #00BCD4; color: #00BCD4; font-weight: 600;
}

.options-row{display:flex; gap:20px; flex-wrap:wrap; justify-content:center}

.opt{
    min-width:140px; padding:20px; border-radius: 20px; background:#fff;
    box-shadow: 0 8px 18px rgba(0, 0, 0, 0.1); display:flex;flex-direction:column;align-items:center;gap:10px; cursor:pointer;
    border: 4px solid #E0E0E0; font-size: 1.1rem; font-weight: 600; transition: all .2s;
}
.opt:not(.disabled):hover{
    transform:translateY(-5px) scale(1.05); box-shadow: 0 12px 25px rgba(0, 0, 0, 0.15);
}
.opt.disabled{pointer-events: none; opacity: 0.7;}
.opt.ok{border-color:var(--ok); box-shadow:0 8px 20px rgba(76,175,80,0.3); background:#E8F5E9;}
.opt.bad{border-color:var(--bad); box-shadow:0 8px 20px rgba(229,57,53,0.3); background:#FFEBEE;}

.feedback{ font-weight:800; font-size: 1.4rem; }

.video-wrapper {
    position: relative; width: 100%; max-width: 600px; padding-bottom: 56.25%; 
    height: 0; overflow: hidden; border-radius: 15px; box-shadow: 0 10px 20px rgba(0,0,0,0.1);
}
.video-wrapper iframe {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none;
}

.day-image-option img {
    width: 100px; height: 100px; border-radius: 10px; object-fit: cover;
}

.matching-container {
    display: flex; flex-wrap: wrap; gap: 25px; width: 100%; justify-content: center;
    padding: 20px; background-color: #e8f5e9; border-radius: 25px;
    box-shadow: inset 0 0 15px rgba(0,150,136,0.1);
}

.matching-column {
    flex: 1; min-width: 280px; background-color: #ffffff; border-radius: 20px;
    padding: 20px; box-shadow: 0 8px 20px rgba(0,0,0,0.1); text-align: center;
    min-height: 300px; display: flex; flex-direction: column;
}
.matching-column h3 {
    color: var(--accent); margin-top: 0; font-size: 1.4rem; border-bottom: 2px solid #FFD180;
    padding-bottom: 10px; margin-bottom: 20px;
}

.questions-list {
    display: flex; flex-direction: column; gap: 15px; flex-grow: 1; 
}

.question-card {
    background-color: #FFF9C4; border: 3px solid #FFCA28; border-radius: 15px;
    padding: 15px 20px; font-weight: 700; font-size: 1.1rem; cursor: grab;
    box-shadow: 0 5px 0 0 #FFB300; transition: transform 0.2s, box-shadow 0.2s;
    color: var(--text-color); text-align: center;
}
.question-card.matched-correct {
    opacity: 1; cursor: default; pointer-events: none; box-shadow: none; transform: none;
    background-color: #f3e5f5; border-color: #AB47BC;
}

.answer-dropzone {
    background-color: #E3F2FD; border: 4px dashed #64B5F6; border-radius: 15px;
    padding: 15px; min-height: 80px; display: flex; align-items: center;
    justify-content: center; margin-bottom: 15px; font-style: italic;
    color: #42A5F5; font-weight: 500; position: relative;
    transition: background-color 0.3s, border-color 0.3s, box-shadow 0.3s; flex-direction: column;
}

@media (max-width: 600px){
    .app{ max-height: 100vh; padding: 15px; padding-right: 0; }
    body{ padding: 10px; }
    h1{font-size: 1.5rem;}
    
    button.primary, button.ghost{ padding: 8px 15px; font-size: 0.9rem; }
    .controls{ flex-direction: column; gap: 10px; align-items: stretch; }
    
    .matching-container{ flex-direction: column; gap: 15px; }
    .matching-column{ min-width:100%; flex-basis: 100%; padding: 15px; }
}
    </style>

</head>
<body>
    <div class="app" role="application" aria-label="Prototipo actividades para primaria">
        <header>
            <h1 id="title">Mini-Clase: Lugares y Objetos Ch'ol</h1>
            <div style="display: flex; gap: 10px;">
                <button class="ghost" onclick="goHome()" style="font-weight: 500; padding: 10px;">🏠 Inicio</button>
                <button class="primary" id="nextBtn" onclick="next()">Siguiente</button>
            </div>
        </header>

        <main class="stage-area" id="stageArea"></main>

        <div class="controls" id="controlsArea">
        </div>

        <footer>Prototipo educativo · Módulo 3: Tema 2</footer>
    </div>

    <div class="ground-sim"></div>


<script>
    // ************************************************************************
    // CONFIGURACIÓN DE LA PANTALLA PRINCIPAL (UNIFICADO)
    const MAIN_SCREEN_URL = '../U3/U3ESC.html'; 
    const USER_GOOGLE_ID = 'ID_DEL_USUARIO_AUTENTICADO'; 
    const TOTAL_ACTIVITY_POINTS = 40; 
    // ************************************************************************
    
    function goHome() { window.location.href = MAIN_SCREEN_URL; }

    // VARIABLES CRÍTICAS
    const stages = [renderStage0, renderStage1, renderStage2, renderStage3, renderStage4];
    let currentStage = 0;
    let feedbackEl = null; 
    const titleEl = document.getElementById('title');
    const nextBtn = document.getElementById('nextBtn');
    const controlsArea = document.getElementById('controlsArea');
    
    // Variables de Progreso
    let stageProgress = new Array(stages.length).fill(false); 
    let userScore = 0; 

    // Funciones de Control de Etapa 
    function setStageComplete(isComplete = true) {
        if (isComplete && !stageProgress[currentStage]) {
            if(currentStage >= 1 && currentStage <= 3) { userScore += 10; }
        }
        stageProgress[currentStage] = isComplete;
        nextBtn.classList.toggle('active', isComplete);
    }

    function clearFeedback(){ if(feedbackEl) feedbackEl.textContent = ""; }
    
    function setFeedback(text, kind){
        if(!feedbackEl) return;
        feedbackEl.innerHTML = text; 
        if(kind === 'ok'){ feedbackEl.style.color = 'var(--ok)' }
        else if(kind === 'bad'){ feedbackEl.style.color = 'var(--bad)' }
        else { feedbackEl.style.color = 'var(--text-color)' }
    }
    
    function disableOptions() {
        document.querySelectorAll('.opt').forEach(el => el.classList.add('disabled'));
    }

    function renderControls(html = '') {
        controlsArea.innerHTML = `<div id="feedback" class="feedback"></div>${html}`;
        feedbackEl = document.getElementById('feedback');
    }

    function next(){ 
        if (!stageProgress[currentStage]) {
            setFeedback("¡Termina esta parte antes de continuar!", 'bad');
            return;
        }

        if (currentStage === 4) {
             alert(`✅ Tema Terminado. Puntuación simulada: ${userScore}/${TOTAL_ACTIVITY_POINTS}. Volviendo a la pantalla principal...`);
             window.location.href = MAIN_SCREEN_URL; 
             return; 
        }

        currentStage++;
        if (currentStage >= stages.length) { currentStage = stages.length - 1; }
        render(); 
    }

    function speakText(text, lang='es-ES'){
        if(!window.speechSynthesis) return;
        const u = new SpeechSynthesisUtterance(text);
        u.lang = lang;
        window.speechSynthesis.cancel();
        window.speechSynthesis.speak(u);
    }
    
    function render(){ 
        clearFeedback(); 
        setStageComplete(false);
        const container = document.getElementById('stageArea'); 
        container.innerHTML=''; 

        // Títulos para el Tema 2
        const titles = [
            'Mini-Clase: Lugares y Objetos Ch\'ol', 
            'Actividad 1: Oración a Figura', 
            'Actividad 2: Audio a Figura', 
            'Actividad 3: Relaciona Objeto y Color', 
            '¡Tema Terminado!'
        ];
        titleEl.textContent = titles[currentStage];

        stages[currentStage](container);
        
        if (currentStage === 0 || currentStage === 4) { setStageComplete(true); }
    }


    // =======================================================================
    // FUNCIÓN CRÍTICA DE AUDIO Y CREACIÓN DE BOTONES
    // =======================================================================
    function playAudio(audioFilename, text, lang = 'cho') {
        const audioUrl = `../assets/audio/${audioFilename}`; 
        const audio = new Audio(audioUrl);
        
        audio.play()
            .then(() => { setFeedback(`🔊 Reproduciendo: "${text}"`, 'neutral'); })
            .catch(e => {
                console.error(`❌ Error al cargar o reproducir "${audioUrl}": ${e.message}`);
                speakText(text, lang); 
                setFeedback(`[TTS] No se encontró el audio real. Reproduciendo: "${text}"`, 'neutral');
            });
    }

    function createAudioButton(text, audioFilename, lang = 'cho') {
        const btn = document.createElement('button');
        btn.className = 'ghost';
        btn.innerHTML = '🔊 Reproducir Oración';
        btn.onclick = () => { playAudio(audioFilename, text, lang); };
        return btn;
    }

    // =======================================================================
    // 0 - MINI-CLASE (VIDEO)
    // =======================================================================
    function renderStage0(container){
        const videoHtml = `
            <div class="video-wrapper">
                <iframe src="https://www.youtube.com/embed/URL_DEL_VIDEO_TEMA2?rel=0" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
            </div>
            <p style="text-align:center; max-width: 600px; margin-top: 20px;">
                ¡Mira el video para aprender sobre **Lugares, Objetos y Colores** en Ch'ol! Luego, presiona **Siguiente**.
            </p>
        `;
        container.innerHTML = videoHtml;
        setStageComplete(true);
        renderControls();
    }

    // =======================================================================
    // 1 - ACTIVIDAD 1: ORACIÓN A IMAGEN (NIVEL SINTÁCTICO) - 6 RONDAS
    // =======================================================================
    const stage1Data = [
        { ch_sentence: "ka´bä añ buchli´bäl", audio: "muchas_sillas.mp3", correct_img: "sillas_muchas.png", distractor_img: "sillas_pocas.png", hint: "Hay muchas sillas" }, // 
        { ch_sentence: "K´änk´äñ li buchli´bäl", audio: "sillas_amarillas.mp3", correct_img: "sillas_amarillas.png", distractor_img: "sillas_rojas.png", hint: "Las sillas son amarillas" }, // 
        { ch_sentence: "Ili ts´i´ ichuke´ jalaw", audio: "perro_caza.mp3", correct_img: "perro_caza.png", distractor_img: "perro_come.png", hint: "El perro caza tepezcuintle" }, // 
        { ch_sentence: "Li dibru ya´añ tyi iye´bal li buchli´bäl", audio: "libro_debajo.mp3", correct_img: "libro_debajo.png", distractor_img: "libro_encima.png", hint: "El Libro está debajo de la silla" }, // 
        { ch_sentence: "Jiñi juñ ya´añ tyi ity´ej tyi tyexelex", audio: "cuaderno_al_lado.mp3", correct_img: "cuaderno_al_lado.png", distractor_img: "cuaderno_lejos.png", hint: "El cuaderno está al lado de las tijeras" }, // 
        { ch_sentence: "Jiñi juñ xchächäko´", audio: "cuadernos_rojos.mp3", correct_img: "cuadernos_rojos.png", distractor_img: "cuadernos_azules.png", hint: "Los cuadernos son rojos" }, // 
    ];
    let currentRound1 = 0;

    function checkAnswer1(selectedImage, currentData, allOptionsElements) {
        if (selectedImage === currentData.correct_img) {
            setFeedback('¡Muy bien! ¡Correcto!', 'ok');
            currentRound1++;
            setTimeout(() => { renderStage1(document.getElementById('stageArea')); }, 1500);
        } else {
            setFeedback(`Incorrecto. ¡La oración significa: **${currentData.hint}**!`, 'bad');
            allOptionsElements.forEach(el => {
                if (el.dataset.img === currentData.correct_img) { el.classList.add('ok'); }
            });
            currentRound1++;
            setTimeout(() => { renderStage1(document.getElementById('stageArea')); }, 3000);
        }
    }

    function renderStage1(container) {
        if (currentRound1 >= stage1Data.length) {
            container.innerHTML = `<h2 style="color: var(--ok);">¡Felicidades! Completaste las ${stage1Data.length} rondas de oraciones.</h2>`;
            setStageComplete(true);
            renderControls();
            return;
        }

        const currentData = stage1Data[currentRound1];
        renderControls();
        
        container.innerHTML = `
            <p class="stage0-info">Ronda ${currentRound1 + 1} de ${stage1Data.length}: Escucha la oración y selecciona la **figura correcta**.</p>
            <p style="font-size: 1.4rem; font-weight: bold; color: var(--accent);">**${currentData.ch_sentence}**</p>
        `;
        
        // Botón de Audio
        const audioBtn = createAudioButton(currentData.ch_sentence, currentData.audio, 'cho');
        const buttonWrapper = document.createElement('div');
        buttonWrapper.style.cssText = "display: flex; gap: 15px; justify-content: center; margin-bottom: 20px;";
        buttonWrapper.appendChild(audioBtn);
        controlsArea.insertBefore(buttonWrapper, feedbackEl.nextSibling); 

        const options = [currentData.correct_img, currentData.distractor_img, "distractor_3.png", "distractor_4.png"]; // 4 opciones
        options.sort(() => Math.random() - 0.5); 

        const row = document.createElement('div');
        row.className = 'options-row';
        
        options.forEach(imgName => {
            const b = document.createElement('div');
            b.className = 'opt day-image-option'; 
            b.dataset.img = imgName;
            
            b.innerHTML = `<img src="../assets/img/${imgName}" alt="Opción de imagen" style="width: 150px; height: 150px;"/>`;
            
            b.onclick = ()=>{
                const allOptions = document.querySelectorAll('.opt');
                disableOptions();
                
                if (imgName === currentData.correct_img) { b.classList.add('ok'); } else { b.classList.add('bad'); }
                
                checkAnswer1(imgName, currentData, allOptions); 
            };
            row.appendChild(b);
        });

        container.appendChild(row);
        setStageComplete(false);
    }
    
    // =======================================================================
    // 2 - ACTIVIDAD 2: IDENTIFICA OBJETOS/LUGARES POR AUDIO (LÉXICO) - 6 RONDAS
    // =======================================================================
    const stage2Questions = [
        { ch_word: "Yotyle aj k´ejuño´", filename: "escuela.mp3", correct: "escuela.png", word: "Escuela" }, // 
        { ch_word: "Juñ", filename: "cuaderno.mp3", correct: "cuaderno.png", word: "Cuaderno" }, // 
        { ch_word: "Tyexelex", filename: "tijera.mp3", correct: "tijera.png", word: "Tijera" }, // 
        { ch_word: "Dubru", filename: "libro.mp3", correct: "libro.png", word: "Libro" }, // 
        { ch_word: "Buchli´bäl", filename: "silla.mp3", correct: "silla.png", word: "Silla" }, // 
        { ch_word: "Tyi´otyoty", filename: "puerta.mp3", correct: "puerta.png", word: "Puerta" }, // 
    ];
    let currentRound2 = 0; 

    const stage2AllOptions = [
        { filename: "escuela.png", word: "Escuela" },
        { filename: "cuaderno.png", word: "Cuaderno" },
        { filename: "tijera.png", word: "Tijera" },
        { filename: "libro.png", word: "Libro" },
        { filename: "silla.png", word: "Silla" }, 
        { filename: "puerta.png", word: "Puerta" },
        { filename: "distractor_5.png", word: "distractor" } 
    ];

    function checkAnswer2(selectedImage, currentData, allOptionsElements) {
        if (selectedImage === currentData.correct) {
            setFeedback(`¡Correcto! Es **${currentData.word}**.`, 'ok');
            currentRound2++;
            setTimeout(() => { renderStage2(document.getElementById('stageArea')); }, 1200);
        } else {
            setFeedback('Incorrecto. ¡La figura correcta representa ' + currentData.word + '!', 'bad');
            allOptionsElements.forEach(el => {
                if (el.dataset.img === currentData.correct) { el.classList.add('ok'); }
            });
            currentRound2++;
            setTimeout(() => { renderStage2(document.getElementById('stageArea')); }, 2500);
        }
    }
    
    function renderStage2(container) {
        if (currentRound2 >= stage2Questions.length) {
            container.innerHTML = `<h2 style="color: var(--ok);">¡Genial! Terminaste las ${stage2Questions.length} rondas.</h2>`;
            setStageComplete(true);
            renderControls();
            return; 
        }

        const currentData = stage2Questions[currentRound2];
        container.innerHTML = `<p class="stage0-info">Ronda ${currentRound2 + 1} de ${stage2Questions.length}. Escucha el audio y selecciona la figura: **${currentData.word}**.</p>`;
        
        // Botón de Audio
        const audioBtn = createAudioButton(currentData.ch_word, currentData.filename, 'cho');
        renderControls();
        const buttonWrapper = document.createElement('div');
        buttonWrapper.style.cssText = "display: flex; gap: 15px; justify-content: center; margin-bottom: 20px;";
        buttonWrapper.appendChild(audioBtn);
        const feedbackEl = document.getElementById('feedback');
        if (controlsArea) { controlsArea.insertBefore(buttonWrapper, feedbackEl.nextSibling); }

        const row = document.createElement('div');
        row.className = 'options-row';
        
        let optionsToDisplay = stage2AllOptions.filter(opt => opt.filename === currentData.correct);
        let distractionOptions = stage2AllOptions.filter(opt => opt.filename !== currentData.correct);
        
        while(optionsToDisplay.length < 4 && distractionOptions.length > 0) {
            const randomIndex = Math.floor(Math.random() * distractionOptions.length);
            optionsToDisplay.push(distractionOptions.splice(randomIndex, 1)[0]);
        }
        optionsToDisplay.sort(() => Math.random() - 0.5);

        optionsToDisplay.forEach(it => {
            const b = document.createElement('div');
            b.className = 'opt day-image-option'; 
            b.dataset.img = it.filename;
            
            b.innerHTML = `<img src="../assets/img/${it.filename}" alt="${it.word}"/> <span style="margin-top: 5px; font-size: 0.9rem;">${it.word}</span>`;
            
            b.onclick = ()=>{
                const allOptions = document.querySelectorAll('.opt');
                disableOptions();
                if (it.filename === currentData.correct) { b.classList.add('ok'); } else { b.classList.add('bad'); }
                checkAnswer2(it.filename, currentData, allOptions); 
            };
            row.appendChild(b);
        });

        container.appendChild(row);
        setStageComplete(false);
    }

    // =======================================================================
    // 3 - ACTIVIDAD 3: UNIR PALABRAS (MATCHING OBJETO - COLOR) - 5 PARES
    // =======================================================================
    const stage3Pairs = [
        ['Xäjxäx', 'Verde'], // 
        ['Chächäk', 'Rojo'], // 
        ['I´ik´', 'Negro'], // 
        ['Säsäk', 'Blanco'], // 
        ['K´änk´än', 'Amarillo'], // 
    ];

    // Funciones de Matching (DRAG AND DROP) - Se re-incluyen aquí para la integridad del archivo
    
    function checkAllMatches3() {
        const dropzones = document.querySelectorAll('.answer-dropzone');
        let allCorrect = true;
        const questionsList = document.getElementById('questionsList'); 

        dropzones.forEach(dz => {
            dz.classList.remove('ok', 'bad'); 
            const droppedCard = dz.querySelector('.question-card');
            const answerText = dz.dataset.answer;
            
            if (droppedCard) {
                const questionText = droppedCard.dataset.question;
                const correctPair = stage3Pairs.find(p => p[0] === questionText);
                
                if (correctPair && correctPair[1] === answerText) {
                    dz.classList.add('ok');
                    droppedCard.classList.add('matched-correct'); 
                } else {
                    dz.classList.add('bad');
                    allCorrect = false;
                    
                    droppedCard.classList.remove('matched-correct', 'dragging');
                    questionsList.appendChild(droppedCard); 
                    
                    dz.classList.remove('filled');
                    const placeholder = dz.querySelector('.placeholder-text');
                    if (placeholder) placeholder.style.display = 'block';
                }
            } else {
                dz.classList.add('bad'); 
                allCorrect = false;
            }
        });

        if (allCorrect) {
            setFeedback('¡Felicidades! Todos los pares son correctos.', 'ok');
            setStageComplete(true);
            document.querySelectorAll('.question-card').forEach(card => {
                card.draggable = false;
                card.classList.add('matched-correct'); 
            });
            nextBtn.classList.add('active'); 
            controlsArea.querySelector('button.ghost').style.pointerEvents = 'none';
        } else {
            setFeedback('¡Revisa los rojos! Las tarjetas incorrectas regresaron para que intentes de nuevo.', 'bad');
        }
    }


    function renderStage3(container){
        container.innerHTML = `<p class="stage0-info">Arrastra el **Color en Ch'ol** (Amarillo) a su **Traducción en Español** (Azul).</p>`;
        
        renderControls(`<button class="ghost" onclick="checkAllMatches3()">Comprobar</button>`);
        
        const matchingContainer = document.createElement('div');
        matchingContainer.className = 'matching-container';
        
        const questionsCol = document.createElement('div');
        questionsCol.className = 'matching-column';
        questionsCol.innerHTML = '<h3>Ch\'ol (Arrastra)</h3><div id="questionsList" class="questions-list"></div>';

        const answersCol = document.createElement('div');
        answersCol.className = 'matching-column';
        answersCol.innerHTML = '<h3>Español (Suelta Aquí)</h3><div id="answersList"></div>';
        
        const shuffledQuestions = [...stage3Pairs].sort(() => Math.random() - 0.5); 
        const shuffledAnswers = [...stage3Pairs].map(p=>p[1]).sort(() => Math.random() - 0.5);

        // Crear tarjetas de preguntas (Arrastrables - Ch'ol)
        const questionsList = questionsCol.querySelector('#questionsList');
        shuffledQuestions.forEach((pair, index) => {
            const questionCard = document.createElement('div');
            questionCard.className = 'question-card';
            questionCard.id = `q-card-${index}`;
            questionCard.draggable = true;
            questionCard.dataset.question = pair[0];
            questionCard.textContent = pair[0];

            questionCard.addEventListener('dragstart', (e) => {
                e.dataTransfer.setData('text/plain', e.target.id);
                e.target.classList.add('dragging');
            });
            questionCard.addEventListener('dragend', (e) => {
                e.target.classList.remove('dragging');
            });
            questionsList.appendChild(questionCard);
        });

        // Crear zonas de respuesta (Dropzones - Español)
        const answersList = answersCol.querySelector('#answersList');
        shuffledAnswers.forEach((answer, index) => {
            const dropzone = document.createElement('div');
            dropzone.className = 'answer-dropzone';
            dropzone.id = `ans-dropzone-${index}`;
            dropzone.dataset.answer = answer;

            const placeholder = document.createElement('span');
            placeholder.className = 'placeholder-text';
            placeholder.textContent = answer;
            dropzone.appendChild(placeholder);

            dropzone.addEventListener('dragover', (e) => {
                e.preventDefault(); 
                dropzone.classList.add('hovered');
            });
            dropzone.addEventListener('dragleave', () => {
                dropzone.classList.remove('hovered');
            });
            dropzone.addEventListener('drop', (e) => {
                e.preventDefault();
                dropzone.classList.remove('hovered');

                const cardId = e.dataTransfer.getData('text/plain');
                const draggedCard = document.getElementById(cardId);
                
                // Devolver tarjeta previa
                if (dropzone.children.length > 0 && dropzone.children[0].classList.contains('question-card')) {
                    questionsList.appendChild(dropzone.children[0]);
                    dropzone.classList.remove('filled');
                    dropzone.querySelector('.placeholder-text').style.display = 'block'; 
                }
                
                // Mover la nueva tarjeta
                dropzone.appendChild(draggedCard);
                dropzone.classList.add('filled');
                dropzone.querySelector('.placeholder-text').style.display = 'none'; 

                setStageComplete(false); 
                dropzone.classList.remove('ok', 'bad');
            });
            answersList.appendChild(dropzone);
        });

        matchingContainer.appendChild(questionsCol);
        matchingContainer.appendChild(answersCol);
        container.appendChild(matchingContainer);
        setStageComplete(false);
    }

    
    // =======================================================================
    // 4 - FINAL DE TEMA (UNIFICADO)
    // =======================================================================
    function renderStage4(container) {
        container.innerHTML = `
            <div style="text-align: center; padding: 40px; border: 5px dashed var(--ok); border-radius: 20px;">
                <h2 style="color: var(--ok); font-size: 2.5rem;">🎉 ¡Tema 2 Completado! 🎉</h2>
                <p style="font-size: 1.2rem;">Puntuación simulada: **${userScore}/${TOTAL_ACTIVITY_POINTS}**</p>
                <p>Presiona **Siguiente** para volver a la pantalla principal.</p>
            </div>
        `;
        setStageComplete(true);
        renderControls();
    }


    // --- Inicialización ---
    document.addEventListener('DOMContentLoaded', () => {
        render();
    });
</script>
</body>
</html>
