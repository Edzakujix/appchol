<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Tema 1: Profesiones y Oficios</title>

    <link rel="stylesheet" href="../assets/css/styles.css">
    <link rel="stylesheet" href="../assets/css/enhanced-styles.css">

    <style>

        button.primary {
            opacity: 0.5;
            pointer-events: none;
        }
        button.primary.active {
            opacity: 1;
            pointer-events: auto;
        }

        .opt {
            min-width: 140px; 
            padding: 15px; 
            border-radius: 20px; 
            background: #fff; 
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px; 
            cursor: pointer; 
            border: 4px solid #E0E0E0;
            font-size: 1.1rem; 
            font-weight: 600; 
            transition: all .2s;
            text-align: center;
        }

        .opt:hover:not(.disabled) {
            transform: translateY(-5px); 
            border-color: var(--accent);
        }

        .opt.disabled { 
            pointer-events: none; 
            opacity: 0.7; 
            cursor: default;
        }

        .day-image-option img {
            width: 110px; 
            height: 110px;
            border-radius: 12px;
            object-fit: cover;
        }

        .matching-click-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
            max-width: 700px;
            padding: 25px;
            background-color: #FFF; 
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            border: 4px solid #E0E0E0;
        }

        .matching-card {
            background-color: #F5F5F5;
            border-radius: 15px;
            padding: 15px 20px;
            font-weight: 700;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 0 rgba(0,0,0,0.1);
            border: 2px solid #E0E0E0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 60px;
            text-align: center;
        }

        .matching-card:hover:not(.matched):not(.selected) {
            transform: translateY(-2px);
            border-color: var(--accent);
            background-color: #FFF;
        }

        .matching-card.selected {
            border-color: var(--accent);
            background-color: #E3F2FD;
            color: var(--accent);
            transform: translateY(-2px);
        }

        .matching-card.matched {
            background-color: var(--ok);
            color: white;
            pointer-events: none;
            cursor: default;
            box-shadow: none;
            border-color: var(--ok);
            animation: pop 0.3s ease-out;
        }

        .matching-card.shaking {
            animation: shake 0.5s;
            border-color: var(--bad) !important;
            background-color: #FFEBEE !important;
            color: var(--bad);
        }

        @keyframes pop {
            0% { transform: scale(0.8); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        .questions-stack, .answers-stack {
            display: flex;
            flex-direction: column;
            gap: 12px;
            flex: 1;
        }

        .stack-title {
            font-weight: 800;
            font-size: 1.2rem;
            color: var(--text-color);
            margin-bottom: 10px;
            text-align: center;
            text-transform: uppercase;
        }

        @media (min-width: 601px) {
            .matching-click-container {
                flex-direction: row;
                justify-content: space-between;
            }
        }
    </style>
</head>
<body>
    <div class="app" role="application" aria-label="Prototipo actividades para primaria">
        <header>
            <h1 id="title">Mini-Clase: Profesiones Ch'ol</h1>
            <div style="display: flex; gap: 10px;">
                <button class="ghost" onclick="goHome()" style="font-weight: 500; padding: 10px;">🏠 Inicio</button>
                <button class="primary" id="nextBtn" onclick="next()">Siguiente</button>
            </div>
        </header>

        <main class="stage-area" id="stageArea"></main>

        <div class="controls" id="controlsArea"></div>

        <footer>Prototipo educativo · Módulo 3: Tema 1</footer>
    </div>

    <div class="ground-sim"></div>

    <script src="../assets/js/sound-effects.js"></script>

<script>
    const TEMA_ID = 8; 
    const MAIN_SCREEN_URL = '../U3/U3ESC.html'; 
    const USER_GOOGLE_ID = 'ID_DEL_USUARIO_AUTENTICADO'; 
    const TOTAL_ACTIVITY_POINTS = 40; 
    
    let stage1Attempts = 0;
    const stage1MaxAttempts = 2;

    let stage2Attempts = 0;
    const stage2MaxAttempts = 2;

    function goHome() {
        soundSystem.play('whoosh');
        setTimeout(() => {
            window.location.href = MAIN_SCREEN_URL;
        }, 200);
    }

    const stages = [renderStage0, renderStage1, renderStage2, renderStage3, renderStage4];
    let currentStage = 0;
    let feedbackEl = null; 
    const titleEl = document.getElementById('title');
    const nextBtn = document.getElementById('nextBtn');
    const controlsArea = document.getElementById('controlsArea');
    
    let stageProgress = new Array(stages.length).fill(false); 
    let userScore = 0; 

    function setStageComplete(isComplete = true) {
        if (isComplete && !stageProgress[currentStage]) {
            if(currentStage >= 1 && currentStage <= 3) { 
                userScore += 10; 
            }
        }
        stageProgress[currentStage] = isComplete;
        nextBtn.classList.toggle('active', isComplete);
    }

    function clearFeedback(){ 
        if(feedbackEl) feedbackEl.textContent = ""; 
    }
    
    function setFeedback(text, kind){
        if(!feedbackEl) return;
        feedbackEl.innerHTML = text; 
        if(kind === 'ok'){ feedbackEl.style.color = 'var(--ok)' }
        else if(kind === 'bad'){ feedbackEl.style.color = 'var(--bad)' }
        else { feedbackEl.style.color = 'var(--text-color)' }
    }
    
    function disableOptions(selector) {
        document.querySelectorAll(selector).forEach(el => el.classList.add('disabled'));
    }

    function renderControls(html = '') {
        controlsArea.innerHTML = `<div id="feedback" class="feedback"></div>${html}`;
        feedbackEl = document.getElementById('feedback');
    }

    function next(){ 
        if (!stageProgress[currentStage]) {
            setFeedback("¡Termina esta parte antes de continuar!", 'bad');
            soundSystem.play('error');
            return;
        }

        soundSystem.play('whoosh');

        if (currentStage === 4) {
             setTimeout(() => {
                 alert(`✅ Tema Terminado. Puntuación simulada: ${userScore}/${TOTAL_ACTIVITY_POINTS}. Volviendo a la pantalla principal...`);
                 window.location.href = MAIN_SCREEN_URL; 
             }, 300);
             return; 
        }
        currentStage++;
        if (currentStage >= stages.length) {
            currentStage = stages.length - 1; 
        }
        render(); 
    }

    function speakText(text, lang='es-ES'){
        if(!window.speechSynthesis) return;
        const u = new SpeechSynthesisUtterance(text);
        u.lang = lang;
        window.speechSynthesis.cancel();
        window.speechSynthesis.speak(u);
    }
    
    function render(){ 
        clearFeedback(); 
        setStageComplete(false);
        const container = document.getElementById('stageArea'); 
        container.innerHTML=''; 

        const titles = [
            'Mini-Clase: Profesiones Ch\'ol', 
            'Actividad 1: Observa y Escribe', 
            'Actividad 2: Escucha y Selecciona Figura', 
            'Actividad 3: Relaciona la Profesión', 
            '¡Tema Terminado!'
        ];
        titleEl.textContent = titles[currentStage];

        stages[currentStage](container);
        
        if (currentStage === 0 || currentStage === 4) {
            setStageComplete(true);
        }
    }

    function playAudio(audioFilename, text, lang = 'cho') {
        const audioUrl = `../assets/audio/${audioFilename}`; 
        const audio = new Audio(audioUrl);
        
        audio.play()
            .then(() => {
                setFeedback(`🔊 Reproduciendo: "${text}"`, 'neutral');
            })
            .catch(e => {
                console.error(`❌ Error al cargar o reproducir "${audioUrl}": ${e.message}`);
                speakText(text, lang); 
                setFeedback(`[TTS] No se encontró el audio real. Reproduciendo: "${text}"`, 'neutral');
            });
    }

    function createAudioButton(text, audioFilename, lang = 'cho') {
        const btn = document.createElement('button');
        btn.className = 'ghost audio-btn';
        btn.innerHTML = '🔊 Reproducir Audio';
        btn.onclick = () => { playAudio(audioFilename, text, lang); };
        return btn;
    }
    
    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    function renderStage0(container){
        const videoHtml = `
            <div class="video-wrapper">
                <iframe src="https://www.youtube.com/embed/g3d1K4z5q6c?rel=0" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
            </div>
            <p style="text-align:center; max-width: 600px; margin-top: 20px;">
                ¡Mira el video para aprender sobre las Profesiones y Oficios en Ch'ol! Luego, presiona Siguiente para comenzar las actividades.
            </p>
        `;
        container.innerHTML = videoHtml;
        setStageComplete(true);
        renderControls();
    }

    const stage1Data = [
        { ch_word: "Aj lukbäl", es_word: "PESCADOR", img: "pescador.png" },
        { ch_word: "Xts´ak", es_word: "CURANDERO", img: "curandero.png" },
        { ch_word: "Xpäsjuñ", es_word: "MAESTRO", img: "maestro.png" },
        { ch_word: "Xpäty otyoty", es_word: "ALBAÑIL", img: "albañil.png" },
        { ch_word: "Aj cholejel", es_word: "CAMPESINO", img: "campesino.png" },
    ];
    let currentRound1 = 0;

    function checkAnswer1(inputEl, currentData) {
        const userInput = inputEl.value.toUpperCase().trim();
        const correctAnswer = currentData.es_word.toUpperCase();

        if (userInput === correctAnswer) {
            setFeedback('¡Muy bien! ¡Correcto!', 'ok');
            soundSystem.play('success');
            
            inputEl.style.borderColor = 'var(--ok)';
            inputEl.disabled = true;
            
            stage1Attempts = 0;
            currentRound1++;
            
            setTimeout(() => {
                renderStage1(document.getElementById('stageArea'));
            }, 1500);
        } else {
            stage1Attempts++;
            if (stage1Attempts < stage1MaxAttempts) {
                setFeedback(`Incorrecto. Te quedan ${stage1MaxAttempts - stage1Attempts} intentos.`, 'bad');
                soundSystem.play('error');
                
                inputEl.style.borderColor = 'var(--bad)';
                visualEffects.shake(inputEl);
                
                const checkBtn = document.getElementById('checkBtn1');
                checkBtn.classList.add('active');
                checkBtn.disabled = false;
                checkBtn.textContent = "Reintentar";
                
            } else {
                setFeedback(`Incorrecto. La respuesta correcta es: **${currentData.es_word}**`, 'bad');
                soundSystem.play('error');
                
                inputEl.value = currentData.es_word; 
                inputEl.style.borderColor = 'var(--bad)';
                inputEl.style.color = 'var(--bad)';
                inputEl.disabled = true;
                
                stage1Attempts = 0;
                currentRound1++;
                
                setTimeout(() => {
                    renderStage1(document.getElementById('stageArea'));
                }, 3000);
            }
        }
    }

    function renderStage1(container) {
        if (currentRound1 >= stage1Data.length) {
            container.innerHTML = `<h2 style="color: var(--ok);">¡Felicidades! Completaste las ${stage1Data.length} rondas.</h2>`;
            setStageComplete(true);
            renderControls();
            earnStar(container);
            return;
        }

        const currentData = stage1Data[currentRound1];
        const attemptsInfo = stage1MaxAttempts > 1 ? `(Tienes ${stage1MaxAttempts} intentos)` : '';

        renderControls(); 

        container.innerHTML = `
            <p class="stage0-info">Ronda ${currentRound1 + 1} de ${stage1Data.length}: Mira la imagen, lee la palabra en Ch'ol y escribe su significado en Español. ${attemptsInfo}</p>
            <div style="display: flex; flex-direction: column; align-items: center; gap: 20px; max-width: 400px; margin: 20px auto; padding: 25px; border: 4px solid var(--accent); border-radius: 20px; background: #fff; box-shadow: 0 10px 25px rgba(0,0,0,0.1);">
                <img src="../assets/img/${currentData.img}" alt="${currentData.ch_word}" style="width: 140px; height: 140px; object-fit: cover; border-radius: 15px; border: 3px solid #eee;">
                <p style="font-size: 1.8rem; font-weight: 800; color: var(--accent); margin:0;">${currentData.ch_word}</p>
                <input type="text" id="answerInput" placeholder="Escribe en Español..." autocomplete="off" style="padding: 12px; font-size: 1.1rem; border-radius: 10px; border: 2px solid #ccc; width: 100%; text-align: center; outline: none; transition: all 0.2s;">
                <button class="primary active" id="checkBtn1" style="width: 100%; margin-top: 10px;">Comprobar</button>
            </div>
        `;

        const inputEl = document.getElementById('answerInput');
        const checkBtn = document.getElementById('checkBtn1');
        
        setTimeout(() => inputEl.focus(), 100);
        
        checkBtn.onclick = () => {
            if (inputEl.value.trim() === "") {
                setFeedback("¡Debes escribir algo!", 'bad');
                visualEffects.shake(inputEl);
                return;
            }
            checkBtn.classList.remove('active');
            checkBtn.disabled = true;
            checkAnswer1(inputEl, currentData);
        };
        
        inputEl.addEventListener('keypress', function(event) {
            if (event.key === 'Enter' && checkBtn.classList.contains('active')) {
                checkBtn.click();
            }
        });
        
        inputEl.addEventListener('input', function() {
            inputEl.style.borderColor = '#ccc'; 
        });

        setStageComplete(false);
    }

    const stage2Questions = [
        { audio: "Xpäsjuñ", filename: "maestro.mp3", correct: "maestro.png", word: "Maestro" },
        { audio: "Aj cholejel", filename: "campesino.mp3", correct: "campesino.png", word: "Campesino" }, 
        { audio: "Aj lukbäl", filename: "pescador.mp3", correct: "pescador.png", word: "Pescador" },
        { audio: "Xts´ak", filename: "curandero.mp3", correct: "curandero.png", word: "Curandero" },
    ];
    let currentRound2 = 0; 

    const stage2AllOptions = [
        { filename: "maestro.png", word: "Maestro" },
        { filename: "campesino.png", word: "Campesino" },
        { filename: "pescador.png", word: "Pescador" },
        { filename: "curandero.png", word: "Curandero" },
        { filename: "albañil.png", word: "Albañil" }, 
        { filename: "florista.png", word: "Florista" } 
    ];

    function checkAnswer2(selectedImage, currentData, allOptionsElements, selectedElement) {
        if (selectedImage === currentData.correct) {
            setFeedback(`¡Correcto! Es el ${currentData.word}.`, 'ok');
            handleCorrectAnswer(selectedElement);
            
            stage2Attempts = 0;
            currentRound2++;
            setTimeout(() => {
                renderStage2(document.getElementById('stageArea'));
            }, 1500);
        } else {
            stage2Attempts++;
            if (stage2Attempts < stage2MaxAttempts) {
                handleIncorrectAnswer(selectedElement);
                setFeedback(`Incorrecto. Te quedan ${stage2MaxAttempts - stage2Attempts} intentos.`, 'bad');
                
                setTimeout(() => {
                    allOptionsElements.forEach(el => {
                        el.classList.remove('disabled', 'bad');
                        el.style.pointerEvents = 'auto';
                    });
                    setFeedback('Intenta de nuevo...', 'neutral');
                }, 1500);
            } else {
                handleIncorrectAnswer(selectedElement);
                setFeedback('Incorrecto. La figura correcta era: ' + currentData.word, 'bad');
                
                allOptionsElements.forEach(el => {
                    if (el.dataset.img === currentData.correct) {
                        el.classList.add('ok');
                    }
                });
                
                stage2Attempts = 0;
                currentRound2++;
                setTimeout(() => {
                    renderStage2(document.getElementById('stageArea'));
                }, 2500);
            }
        }
    }
    
    function renderStage2(container) {
        if (currentRound2 >= stage2Questions.length) {
            container.innerHTML = `<h2 style="color: var(--ok);">¡Genial! Terminaste las ${stage2Questions.length} rondas.</h2>`;
            setStageComplete(true);
            renderControls();
            earnStar(container);
            return; 
        }

        const currentData = stage2Questions[currentRound2];
        const attemptsInfo = stage2MaxAttempts > 1 ? `(Tienes ${stage2MaxAttempts} intentos)` : '';

        container.innerHTML = `<p class="stage0-info">Ronda ${currentRound2 + 1} de ${stage2Questions.length}. Escucha el audio y selecciona la figura: ${currentData.word}. ${attemptsInfo}</p>`;
        
        const audioBtn = createAudioButton(currentData.audio, currentData.filename, 'cho');
        
        renderControls();
        const buttonWrapper = document.createElement('div');
        buttonWrapper.style.cssText = "display: flex; gap: 15px; justify-content: center; margin-bottom: 20px;";
        buttonWrapper.appendChild(audioBtn);
        const feedbackEl = document.getElementById('feedback');
        if (controlsArea) {
            controlsArea.insertBefore(buttonWrapper, feedbackEl.nextSibling); 
        }

        const row = document.createElement('div');
        row.className = 'options-row';
        
        let optionsToDisplay = stage2AllOptions.filter(opt => opt.filename === currentData.correct);
        let distractionOptions = stage2AllOptions.filter(opt => opt.filename !== currentData.correct);
        
        while(optionsToDisplay.length < 4 && distractionOptions.length > 0) {
            const randomIndex = Math.floor(Math.random() * distractionOptions.length);
            optionsToDisplay.push(distractionOptions.splice(randomIndex, 1)[0]);
        }
        optionsToDisplay.sort(() => Math.random() - 0.5);

        optionsToDisplay.forEach(it => {
            const b = document.createElement('div');
            b.className = 'opt day-image-option'; 
            b.dataset.img = it.filename;
            
            b.innerHTML = `<img src="../assets/img/${it.filename}" alt="${it.word}"/> <span style="margin-top: 5px; font-size: 0.9rem;">${it.word}</span>`;
            
            b.onclick = ()=>{
                const allOptions = document.querySelectorAll('.opt');
                disableOptions('.opt');
                
                if (it.filename === currentData.correct) {
                    b.classList.add('ok');
                } else {
                    b.classList.add('bad');
                }
                
                checkAnswer2(it.filename, currentData, allOptions, b); 
            };
            row.appendChild(b);
        });

        container.appendChild(row);
        setStageComplete(false);
    }

    const stage3Pairs = [
        { chol: 'Xpäsjuñ', es: 'Maestro' },
        { chol: 'Aj cholejel', es: 'Campesino' },
        { chol: 'Xts´ak', es: 'Curandero' },
        { chol: 'Aj lukbäl', es: 'Pescador' },
        { chol: 'Xpäty otyoty', es: 'Albañil' },
        { chol: 'Toñel', es: 'Trabajar' }
    ];

    let selectedQuestionStage3 = null;
    let matchedPairsCountStage3 = 0;

    function handleStage3QuestionClick(cardEl, itemData) {
        soundSystem.play('click');
        if (cardEl.classList.contains('selected')) {
            cardEl.classList.remove('selected');
            selectedQuestionStage3 = null;
            setFeedback('Selecciona una palabra en Ch\'ol y luego su significado.', 'neutral');
            return;
        }
        document.querySelectorAll('.questions-stack .matching-card.selected').forEach(el => el.classList.remove('selected'));
        cardEl.classList.add('selected');
        selectedQuestionStage3 = itemData;
        setFeedback(`Seleccionaste ${itemData.chol}. ¡Ahora elige su traducción!`, 'neutral');
    }

    function handleStage3AnswerClick(cardEl, itemData) {
        soundSystem.play('click');
        if (!selectedQuestionStage3) {
            setFeedback('Selecciona primero una palabra Ch\'ol de la columna izquierda.', 'bad');
            visualEffects.shake(cardEl);
            return;
        }

        const questionCardEl = document.querySelector(`.questions-stack .matching-card[data-chol="${selectedQuestionStage3.chol}"]`);

        if (selectedQuestionStage3.es === itemData.es) {
            setFeedback('¡Emparejamiento Correcto!', 'ok');
            soundSystem.play('success');
            
            cardEl.classList.add('matched');
            questionCardEl.classList.add('matched');
            cardEl.classList.remove('shaking'); 
            questionCardEl.classList.remove('shaking', 'selected');
            
            selectedQuestionStage3 = null;
            matchedPairsCountStage3++;

            if (matchedPairsCountStage3 === stage3Pairs.length) {
                setTimeout(() => {
                    setFeedback('¡Felicidades! Todos los pares son correctos.', 'ok');
                    setStageComplete(true);
                    earnStar(document.getElementById('stageArea'));
                }, 500);
            }
        } else {
            setFeedback('Incorrecto. Intenta de nuevo.', 'bad');
            soundSystem.play('error');
            
            cardEl.classList.add('shaking');
            questionCardEl.classList.add('shaking');
            
            setTimeout(() => {
                cardEl.classList.remove('shaking');
                questionCardEl.classList.remove('shaking');
            }, 500);
        }
    }

    function renderStage3(container){
        renderControls();
        matchedPairsCountStage3 = 0;
        selectedQuestionStage3 = null;

        const questions = stage3Pairs.map(d => ({ chol: d.chol, es: d.es }));
        const answers = stage3Pairs.map(d => ({ chol: d.chol, es: d.es }));
        
        shuffleArray(questions);
        shuffleArray(answers);

        container.innerHTML = `<p class="stage0-info">Haz clic en la palabra en Ch'ol (Izquierda) y luego en su Significado (Derecha) para unirlas.</p>`;

        const matchingContainer = document.createElement('div');
        matchingContainer.className = 'matching-click-container';

        const questionsStack = document.createElement('div');
        questionsStack.className = 'questions-stack';
        questionsStack.innerHTML = `<p class="stack-title">Ch'ol</p>`;
        
        questions.forEach(q => {
            const cardEl = document.createElement('div');
            cardEl.className = 'matching-card';
            cardEl.textContent = q.chol;
            cardEl.dataset.chol = q.chol;
            cardEl.onclick = () => handleStage3QuestionClick(cardEl, q);
            questionsStack.appendChild(cardEl);
        });

        const answersStack = document.createElement('div');
        answersStack.className = 'answers-stack';
        answersStack.innerHTML = `<p class="stack-title">Español</p>`;

        answers.forEach(a => {
            const cardEl = document.createElement('div');
            cardEl.className = 'matching-card';
            cardEl.textContent = a.es;
            cardEl.onclick = () => handleStage3AnswerClick(cardEl, a);
            answersStack.appendChild(cardEl);
        });

        matchingContainer.appendChild(questionsStack);
        matchingContainer.appendChild(answersStack);
        container.appendChild(matchingContainer);
        setFeedback('Selecciona una palabra y su traducción.', 'neutral');
        setStageComplete(false);
    }
    
    function renderStage4(container) {
        container.innerHTML = `
            <div style="text-align: center; padding: 40px; border: 5px dashed var(--ok); border-radius: 20px; background-color: rgba(255,255,255,0.9);">
                <h2 style="color: var(--ok); font-size: 2.5rem; margin-bottom: 20px;">🎉 ¡Tema 1 Completado! 🎉</h2>
                <p style="font-size: 1.5rem; font-weight: bold;">Puntuación simulada: ${userScore}/${TOTAL_ACTIVITY_POINTS}</p>
                <p style="margin-top: 15px;">Has aprendido las Profesiones en Ch'ol.</p>
                <p>Presiona Siguiente para volver a la pantalla principal.</p>
            </div>
        `;
        
        try {
            if (window.visualEffects && typeof window.visualEffects.confetti === 'function') {
                window.visualEffects.confetti();
            } else if (typeof celebrateLevelComplete === 'function') {
                celebrateLevelComplete();
            }
        } catch (e) {
            console.log("Efectos visuales no disponibles");
        }

        guardarProgresoEnBD();
        setStageComplete(true);
        renderControls();
    }

    function guardarProgresoEnBD() {
        fetch('../../backend/api/progress.php', { 
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                tema_id: TEMA_ID,
                completado: true
            })
        })
        .then(response => response.json())
        .then(data => {
            console.log("Progreso guardado:", data);
            if(data.success && window.collectCoin) {
                collectCoin();
            }
        })
        .catch(error => console.error('Error al guardar:', error));
    }

    document.addEventListener('DOMContentLoaded', () => {
        render();
    });
</script>
</body>
</html>
