<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Tema 3: Verbos</title>

    <link rel="stylesheet" href="../assets/css/styles.css">
    <link rel="stylesheet" href="../assets/css/enhanced-styles.css">

    <style>

        button.primary {
            opacity: 0.5;
            pointer-events: none;
        }
        button.primary.active {
            opacity: 1;
            pointer-events: auto;
        }

        .opt {
            min-width: 140px; 
            padding: 15px; 
            border-radius: 20px; 
            background: #fff;
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.1); 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center;
            gap: 10px; 
            cursor: pointer;
            border: 4px solid #E0E0E0; 
            font-size: 1.1rem; 
            font-weight: 600; 
            transition: all .2s;
            text-align: center;
        }

        .opt:hover:not(.disabled) {
            transform: translateY(-5px); 
            border-color: var(--accent);
        }

        .opt.disabled { 
            pointer-events: none; 
            opacity: 0.7; 
            cursor: default;
        }

        .day-image-option img {
            width: 120px; 
            height: 120px; 
            border-radius: 12px; 
            object-fit: cover;
        }
    </style>
</head>
<body>
    <div class="app" role="application" aria-label="Prototipo actividades para primaria">
        <header>
            <h1 id="title">Mini-Clase: Verbos Ch'ol</h1>
            <div style="display: flex; gap: 10px;">
                <button class="ghost" onclick="goHome()" style="font-weight: 500; padding: 10px;">🏠 Inicio</button>
                <button class="primary" id="nextBtn" onclick="next()">Siguiente</button>
            </div>
        </header>

        <main class="stage-area" id="stageArea"></main>

        <div class="controls" id="controlsArea"></div>

        <footer>Prototipo educativo · Módulo 3: Tema 3</footer>
    </div>

    <div class="ground-sim"></div>

    <script src="../assets/js/sound-effects.js"></script>

<script>
    const TEMA_ID = 10;
    const MAIN_SCREEN_URL = '../U3/U3ESC.html'; 
    const USER_GOOGLE_ID = 'ID_DEL_USUARIO_AUTENTICADO'; 
    const TOTAL_ACTIVITY_POINTS = 40; 
    
    let stage1Attempts = 0;
    const stage1MaxAttempts = 2;

    let stage2Attempts = 0;
    const stage2MaxAttempts = 2;

    let stage3Attempts = 0;
    const stage3MaxAttempts = 2;

    function goHome() {
        soundSystem.play('whoosh');
        setTimeout(() => {
            window.location.href = MAIN_SCREEN_URL;
        }, 200);
    }

    const stages = [renderStage0, renderStage1, renderStage2, renderStage3, renderStage4];
    let currentStage = 0;
    let feedbackEl = null; 
    const titleEl = document.getElementById('title');
    const nextBtn = document.getElementById('nextBtn');
    const controlsArea = document.getElementById('controlsArea');
    
    let stageProgress = new Array(stages.length).fill(false); 
    let userScore = 0; 

    function setStageComplete(isComplete = true) {
        if (isComplete && !stageProgress[currentStage]) {
            if(currentStage >= 1 && currentStage <= 3) { userScore += 10; }
        }
        stageProgress[currentStage] = isComplete;
        nextBtn.classList.toggle('active', isComplete);
    }

    function clearFeedback(){ if(feedbackEl) feedbackEl.textContent = ""; }
    
    function setFeedback(text, kind){
        if(!feedbackEl) return;
        feedbackEl.innerHTML = text; 
        if(kind === 'ok'){ feedbackEl.style.color = 'var(--ok)' }
        else if(kind === 'bad'){ feedbackEl.style.color = 'var(--bad)' }
        else { feedbackEl.style.color = 'var(--text-color)' }
    }
    
    function disableOptions(selector) {
        document.querySelectorAll(selector).forEach(el => el.classList.add('disabled'));
    }

    function renderControls(html = '') {
        controlsArea.innerHTML = `<div id="feedback" class="feedback"></div>${html}`;
        feedbackEl = document.getElementById('feedback');
    }

    function next(){ 
        if (!stageProgress[currentStage]) {
            setFeedback("¡Termina esta parte antes de continuar!", 'bad');
            soundSystem.play('error');
            return;
        }

        soundSystem.play('whoosh');

        if (currentStage === 4) {
             setTimeout(() => {
                 alert(`✅ Tema Terminado. Puntuación simulada: ${userScore}/${TOTAL_ACTIVITY_POINTS}. Volviendo a la pantalla principal...`);
                 window.location.href = MAIN_SCREEN_URL; 
             }, 300);
             return; 
        }

        currentStage++;
        if (currentStage >= stages.length) { currentStage = stages.length - 1; }
        render(); 
    }

    function speakText(text, lang='es-ES'){
        if(!window.speechSynthesis) return;
        const u = new SpeechSynthesisUtterance(text);
        u.lang = lang;
        window.speechSynthesis.cancel();
        window.speechSynthesis.speak(u);
    }
    
    function render(){ 
        clearFeedback(); 
        setStageComplete(false);
        const container = document.getElementById('stageArea'); 
        container.innerHTML=''; 

        const titles = [
            'Mini-Clase: Verbos Ch\'ol', 
            'Actividad 1: Verbo a Figura', 
            'Actividad 2: Oración de Acción', 
            'Actividad 3: Completa la Oración', 
            '¡Tema Terminado!'
        ];
        titleEl.textContent = titles[currentStage];

        stages[currentStage](container);
        
        if (currentStage === 0 || currentStage === 4) { setStageComplete(true); }
    }

    function playAudio(audioFilename, text, lang = 'cho') {
        const audioUrl = `../assets/audio/${audioFilename}`; 
        const audio = new Audio(audioUrl);
        
        audio.play()
            .then(() => { setFeedback(`🔊 Reproduciendo: "${text}"`, 'neutral'); })
            .catch(e => {
                console.error(`❌ Error al cargar o reproducir "${audioUrl}": ${e.message}`);
                speakText(text, lang); 
                setFeedback(`[TTS] No se encontró el audio real. Reproduciendo: "${text}"`, 'neutral');
            });
    }

    function createAudioButton(text, audioFilename, lang = 'cho') {
        const btn = document.createElement('button');
        btn.className = 'ghost audio-btn';
        btn.innerHTML = '🔊 Reproducir Audio';
        btn.onclick = () => { playAudio(audioFilename, text, lang); };
        return btn;
    }

    function renderStage0(container){
        const videoHtml = `
            <div class="video-wrapper">
                <iframe src="https://www.youtube.com/embed/URL_DEL_VIDEO_TEMA3?rel=0" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
            </div>
            <p style="text-align:center; max-width: 600px; margin-top: 20px;">
                ¡Mira el video para aprender sobre los Verbos en Ch'ol! Luego, presiona Siguiente.
            </p>
        `;
        container.innerHTML = videoHtml;
        setStageComplete(true);
        renderControls();
    }

    const stage1Questions = [
        { ch_word: "Päty bäñäk´äl", filename: "cocinar.mp3", correct: "abuela_cocinando.png", word: "Cocinar" },
        { ch_word: "Pokoñel", filename: "lavar.mp3", correct: "lavar.png", word: "Lavar" }, 
        { ch_word: "Sujkuñ", filename: "limpiar.mp3", correct: "limpiar.png", word: "Limpiar" },
        { ch_word: "Misujel", filename: "barrer.mp3", correct: "barrer.png", word: "Barrer" },
        { ch_word: "Päk´oñel", filename: "sembrar.mp3", correct: "campesino.png", word: "Sembrar" },
        { ch_word: "lukbäl", filename: "pescar.mp3", correct: "pescador.png", word: "Pescar" },
    ];
    let currentRound1 = 0; 

    const stage1AllOptions = [
        { filename: "abuela_cocinando.png", word: "Cocinar" },
        { filename: "lavar.png", word: "Lavar" },
        { filename: "limpiar.png", word: "Limpiar" },
        { filename: "barrer.png", word: "Barrer" },
        { filename: "campesino.png", word: "Sembrar" },
        { filename: "pescador.png", word: "Pescar" },
        { filename: "maestro.png", word: "Enseñar" } 
    ];

    function checkAnswer1(selectedImage, currentData, allOptionsElements, selectedElement) {
        if (selectedImage === currentData.correct) {
            setFeedback(`¡Correcto! Es ${currentData.word}.`, 'ok');
            handleCorrectAnswer(selectedElement);
            
            stage1Attempts = 0;
            currentRound1++;
            setTimeout(() => { renderStage1(document.getElementById('stageArea')); }, 1200);
        } else {
            stage1Attempts++;
            if (stage1Attempts < stage1MaxAttempts) {
                handleIncorrectAnswer(selectedElement);
                setFeedback(`Incorrecto. Te quedan ${stage1MaxAttempts - stage1Attempts} intentos.`, 'bad');
                
                setTimeout(() => {
                    allOptionsElements.forEach(el => {
                        el.classList.remove('disabled', 'bad');
                        el.style.pointerEvents = 'auto';
                    });
                    setFeedback('Intenta de nuevo...', 'neutral');
                }, 1500);
            } else {
                handleIncorrectAnswer(selectedElement);
                setFeedback('Incorrecto. La figura correcta representa ' + currentData.word + '!', 'bad');
                
                allOptionsElements.forEach(el => {
                    if (el.dataset.img === currentData.correct) { el.classList.add('ok'); }
                });
                
                stage1Attempts = 0;
                currentRound1++;
                setTimeout(() => { renderStage1(document.getElementById('stageArea')); }, 2500);
            }
        }
    }
    
    function renderStage1(container) {
        if (currentRound1 >= stage1Questions.length) {
            container.innerHTML = `<h2 style="color: var(--ok);">¡Felicidades! Completaste las ${stage1Questions.length} rondas de verbos léxicos.</h2>`;
            setStageComplete(true);
            renderControls();
            earnStar(container);
            return; 
        }

        const currentData = stage1Questions[currentRound1];
        const attemptsInfo = stage1MaxAttempts > 1 ? `(Tienes ${stage1MaxAttempts} intentos)` : '';

        container.innerHTML = `<p class="stage0-info">Ronda ${currentRound1 + 1} de ${stage1Questions.length}. Escucha el audio y selecciona la figura que muestra la acción: ${currentData.word}. ${attemptsInfo}</p>`;
        
        const audioBtn = createAudioButton(currentData.ch_word, currentData.filename, 'cho');
        audioBtn.innerHTML = '🔊 Reproducir Verbo';
        renderControls();
        const buttonWrapper = document.createElement('div');
        buttonWrapper.style.cssText = "display: flex; gap: 15px; justify-content: center; margin-bottom: 20px;";
        buttonWrapper.appendChild(audioBtn);
        const feedbackEl = document.getElementById('feedback');
        if (controlsArea) { controlsArea.insertBefore(buttonWrapper, feedbackEl.nextSibling); }

        const row = document.createElement('div');
        row.className = 'options-row';
        
        let optionsToDisplay = stage1AllOptions.filter(opt => opt.filename === currentData.correct);
        let distractionOptions = stage1AllOptions.filter(opt => opt.filename !== currentData.correct);
        
        while(optionsToDisplay.length < 4 && distractionOptions.length > 0) {
            const randomIndex = Math.floor(Math.random() * distractionOptions.length);
            optionsToDisplay.push(distractionOptions.splice(randomIndex, 1)[0]);
        }
        optionsToDisplay.sort(() => Math.random() - 0.5);

        optionsToDisplay.forEach(it => {
            const b = document.createElement('div');
            b.className = 'opt day-image-option'; 
            b.dataset.img = it.filename;
            
            b.innerHTML = `<img src="../assets/img/${it.filename}" alt="${it.word}"/> <span style="margin-top: 5px; font-size: 0.9rem;">${it.word}</span>`;
            
            b.onclick = ()=>{
                const allOptions = document.querySelectorAll('.opt');
                disableOptions('.opt');
                if (it.filename === currentData.correct) { b.classList.add('ok'); } else { b.classList.add('bad'); }
                checkAnswer1(it.filename, currentData, allOptions, b); 
            };
            row.appendChild(b);
        });

        container.appendChild(row);
        setStageComplete(false);
    }

    const stage2Data = [
        { ch_sentence: "Jiñi kpap muk´ tyi toñel tyi cholel", audio: "papa_trabaja.mp3", correct_img: "campesino.png", distractor_img: "albañil.png", hint: "Mi papá trabaja en la milpa" },
        { ch_sentence: "Jiñi xchuty alo´ chonko boñ ijuñ", audio: "niño_pinta.mp3", correct_img: "niño_pintando.png", distractor_img: "niño.png", hint: "El niño esta pintando" },
        { ch_sentence: "Jiñi kmam ipäty ibäñik´ tyi k´ajk", audio: "mama_cocina.mp3", correct_img: "abuela_cocinando.png", distractor_img: "mama_abrazando.png", hint: "Mi mamá cocina en el fogon" },
        { ch_sentence: "Jiñi kchicho´ imisuño´ li otyoty", audio: "hermanas_barren.mp3", correct_img: "hermanas_barren.png", distractor_img: "niña.png", hint: "Mis hermanas barren la casa" },
    ];
    let currentRound2 = 0;

    function checkAnswer2(selectedImage, currentData, allOptionsElements, selectedElement) {
        if (selectedImage === currentData.correct_img) {
            setFeedback('¡Muy bien! ¡Correcto!', 'ok');
            handleCorrectAnswer(selectedElement);
            
            stage2Attempts = 0;
            currentRound2++;
            setTimeout(() => { renderStage2(document.getElementById('stageArea')); }, 1500);
        } else {
            stage2Attempts++;
            if (stage2Attempts < stage2MaxAttempts) {
                handleIncorrectAnswer(selectedElement);
                setFeedback(`Incorrecto. Te quedan ${stage2MaxAttempts - stage2Attempts} intentos.`, 'bad');
                
                setTimeout(() => {
                    allOptionsElements.forEach(el => {
                        el.classList.remove('disabled', 'bad');
                        el.style.pointerEvents = 'auto';
                    });
                    setFeedback('Lee de nuevo e intenta...', 'neutral');
                }, 1500);
            } else {
                handleIncorrectAnswer(selectedElement);
                setFeedback(`Incorrecto. La oración significa: **${currentData.hint}**`, 'bad');
                
                allOptionsElements.forEach(el => {
                    if (el.dataset.img === currentData.correct_img) { el.classList.add('ok'); }
                });
                
                stage2Attempts = 0;
                currentRound2++;
                setTimeout(() => { renderStage2(document.getElementById('stageArea')); }, 3000);
            }
        }
    }

    function renderStage2(container) {
        if (currentRound2 >= stage2Data.length) {
            container.innerHTML = `<h2 style="color: var(--ok);">¡Felicidades! Completaste las ${stage2Data.length} rondas de oraciones de acción.</h2>`;
            setStageComplete(true);
            renderControls();
            earnStar(container);
            return;
        }

        const currentData = stage2Data[currentRound2];
        const attemptsInfo = stage2MaxAttempts > 1 ? `(Tienes ${stage2MaxAttempts} intentos)` : '';

        renderControls();
        
        container.innerHTML = `
            <p class="stage0-info">Ronda ${currentRound2 + 1} de ${stage2Data.length}: Escucha la oración y selecciona la acción correcta. ${attemptsInfo}</p>
            <p style="font-size: 1.4rem; font-weight: bold; color: var(--accent); margin-bottom: 20px; text-align:center;">${currentData.ch_sentence}</p>
        `;
        
        const audioBtn = createAudioButton(currentData.ch_sentence, currentData.audio, 'cho');
        audioBtn.innerHTML = '🔊 Reproducir Oración';
        const buttonWrapper = document.createElement('div');
        buttonWrapper.style.cssText = "display: flex; gap: 15px; justify-content: center; margin-bottom: 20px;";
        buttonWrapper.appendChild(audioBtn);
        controlsArea.insertBefore(buttonWrapper, feedbackEl.nextSibling); 

        const options = [currentData.correct_img, currentData.distractor_img, "tio.png", "tia.png"];
        options.sort(() => Math.random() - 0.5); 

        const row = document.createElement('div');
        row.className = 'options-row';
        
        options.forEach(imgName => {
            const b = document.createElement('div');
            b.className = 'opt day-image-option'; 
            b.dataset.img = imgName;
            
            b.innerHTML = `<img src="../assets/img/${imgName}" alt="Opción de acción" style="width: 140px; height: 140px; border-radius:15px;"/>`;
            
            b.onclick = ()=>{
                const allOptions = document.querySelectorAll('.opt');
                disableOptions('.opt');
                
                if (imgName === currentData.correct_img) { b.classList.add('ok'); } else { b.classList.add('bad'); }
                
                checkAnswer2(imgName, currentData, allOptions, b); 
            };
            row.appendChild(b);
        });

        container.appendChild(row);
        setStageComplete(false);
    }

    const stage3Data = [
        { sentence: "Jiñi xchuty alo´ chonko ___ ijuñ", correct: "boñ", options: ["boñ", "ts´ijbuñ", "sety´"], hint_es: "El niño esta pintando" },
        { sentence: "Li alpeñalo´ chonkolo´ tyi ñak tyi yorojlel ___", correct: "uch´el", options: ["uch´el", "ka´y", "tsik"], hint_es: "Los niños están jugando en la hora del recreo" },
        { sentence: "Li xpäsjuño´ muk´o´ tyi ___", correct: "käñtyisaj", options: ["käñtyisaj", "lukbäl", "soñ"], hint_es: "Los maestros enseñan" },
        { sentence: "¿Ba´ki año´ li ___?", correct: "alp´eñalo´", options: ["alp´eñalo´", "dibru", "mam"], hint_es: "¿Dónde están los niños?" },
    ];
    let currentRound3 = 0; 

    function checkAnswer3(selectedOption, currentData, allOptionsElements, selectedElement) {
        if (selectedOption === currentData.correct) {
            setFeedback('¡Muy bien! ¡Correcto!', 'ok');
            handleCorrectAnswer(selectedElement);
            
            stage3Attempts = 0;
            currentRound3++;
            setTimeout(() => { renderStage3(document.getElementById('stageArea')); }, 1500);
        } else {
            stage3Attempts++;
            if (stage3Attempts < stage3MaxAttempts) {
                handleIncorrectAnswer(selectedElement);
                setFeedback(`Incorrecto. Te quedan ${stage3MaxAttempts - stage3Attempts} intentos.`, 'bad');
                
                setTimeout(() => {
                    allOptionsElements.forEach(el => {
                        el.classList.remove('disabled', 'bad');
                        el.style.pointerEvents = 'auto';
                    });
                    setFeedback('Intenta de nuevo.', 'neutral');
                }, 1500);
            } else {
                handleIncorrectAnswer(selectedElement);
                setFeedback(`Incorrecto. ¡La respuesta correcta era: **${currentData.correct}**!`, 'bad');
                
                allOptionsElements.forEach(el => {
                    if (el.textContent === currentData.correct) { el.classList.add('ok'); }
                });
                
                stage3Attempts = 0;
                currentRound3++;
                setTimeout(() => { renderStage3(document.getElementById('stageArea')); }, 3500);
            }
        }
    }

    function renderStage3(container) {
        if (currentRound3 >= stage3Data.length) {
            container.innerHTML = `<h2 style="color: var(--ok);">¡Felicidades! Completaste las ${stage3Data.length} rondas de completar oraciones.</h2>`;
            setStageComplete(true);
            renderControls();
            earnStar(container);
            return;
        }

        const currentData = stage3Data[currentRound3];
        const attemptsInfo = stage3MaxAttempts > 1 ? `(Tienes ${stage3MaxAttempts} intentos)` : '';

        container.innerHTML = `
            <p class="stage0-info">Ronda ${currentRound3 + 1} de ${stage3Data.length}: Completa la oración en Ch'ol seleccionando la palabra correcta. ${attemptsInfo}</p>
            <p style="font-size: 1.4rem; font-weight: bold; color: var(--accent); margin-bottom: 25px; text-align:center; padding: 15px; background: #fff; border-radius: 15px;">
                ${currentData.sentence.replace('___', '<span style="color: var(--accent); text-decoration: underline; font-weight: 800;">___</span>')}
            </p>
        `;

        renderControls(); 
        
        const row = document.createElement('div');
        row.className = 'options-row';
        currentData.options.sort(() => Math.random() - 0.5); 

        currentData.options.forEach(opt => {
            const b = document.createElement('div');
            b.className = 'opt';
            b.textContent = opt;
            
            b.onclick = (e) => {
                const allOptions = document.querySelectorAll('.opt');
                disableOptions('.opt'); 
                
                if (opt === currentData.correct) { b.classList.add('ok'); } else { b.classList.add('bad'); }
                
                checkAnswer3(opt, currentData, allOptions, b);
            };
            row.appendChild(b);
        });

        container.appendChild(row);
        setStageComplete(false); 
    }
    
    function renderStage4(container) {
        container.innerHTML = `
            <div style="text-align: center; padding: 40px; border: 5px dashed var(--ok); border-radius: 20px; background-color: rgba(255,255,255,0.9);">
                <h2 style="color: var(--ok); font-size: 2.5rem; margin-bottom: 20px;">🎉 ¡Tema 3 Completado! 🎉</h2>
                <p style="font-size: 1.5rem; font-weight: bold;">Puntuación simulada: ${userScore}/${TOTAL_ACTIVITY_POINTS}</p>
                <p style="margin-top: 15px;">Has aprendido los Verbos en Ch'ol.</p>
                <p>Presiona Siguiente para volver a la pantalla principal.</p>
            </div>
        `;
        
        try {
            if (window.visualEffects && typeof window.visualEffects.confetti === 'function') {
                window.visualEffects.confetti();
            } else if (typeof celebrateLevelComplete === 'function') {
                celebrateLevelComplete();
            }
        } catch (e) {
            console.log("Efectos visuales no disponibles");
        }

        guardarProgresoEnBD();
        setStageComplete(true);
        renderControls();
    }

    function guardarProgresoEnBD() {
        fetch('../../backend/api/progress.php', { 
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                tema_id: TEMA_ID,
                completado: true
            })
        })
        .then(response => response.json())
        .then(data => {
            console.log("Progreso guardado:", data);
            if(data.success && window.collectCoin) {
                collectCoin();
            }
        })
        .catch(error => console.error('Error al guardar:', error));
    }

    document.addEventListener('DOMContentLoaded', () => {
        render();
    });
</script>
</body>
</html>
